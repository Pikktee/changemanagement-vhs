<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="KLARTEXT">
  <!-- Favicon, Fassung „Schlitz". Dieselbe Wand wie favicon-durchgang.svg,
       nur ist der Spalt schmal: das Motiv der Titelfolie, nicht der
       Schlussfolie. Geschlossener, dafuer bei 16px etwas ruhiger. -->
  <rect width="16" height="16" fill="#14459E"/>
  <g fill="#B9DFFA">
    <rect x="2" y="1"  width="12" height="2"/>
    <rect x="2" y="5"  width="10" height="2"/>
    <rect x="2" y="9"  width="12" height="2"/>
    <rect x="2" y="13" width="5"  height="2"/>
  </g>
  <rect x="7" y="0" width="1" height="16" fill="#FFFFFF"/>
</svg>
