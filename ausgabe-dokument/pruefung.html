<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Ueberlaufpruefung</title>
<style>
 body{font:13px/1.5 -apple-system,Helvetica,sans-serif;padding:20px;background:#fff}
 table{border-collapse:collapse;font-size:13px}
 td,th{padding:3px 12px 3px 0;text-align:left;border-bottom:1px solid #ddd}
 .ok{color:#128a3a} .bad{color:#c00;font-weight:700}
 #buehne{position:absolute;left:-9999px;top:0}
</style></head>
<body>
<h2>Ueberlaufpruefung der Dokumentseiten</h2>
<p id="stand">messe …</p>
<table id="tab"><thead><tr><th>Seite</th><th>Inhalt</th><th>Platz</th><th>Rest</th><th>Status</th></tr></thead><tbody></tbody></table>
<div id="buehne"></div>
<script>
(async function(){
  const buehne = document.getElementById('buehne');
  const tbody  = document.querySelector('#tab tbody');
  let schlecht = 0, gemessen = 0;
  // Bis zur ersten Seite, die es nicht gibt: Die Seitenzahl aendert sich mit
  // dem Inhalt, eine feste Zahl hier meldet sonst stillschweigend zu wenig.
  for (let i = 1; i <= 99; i++) {
    const nr = String(i).padStart(2,'0');
    const rahmen = document.createElement('iframe');
    rahmen.style.width = '794px';
    rahmen.style.height = '1123px';
    rahmen.style.border = '0';
    rahmen.src = 'seite-' + nr + '.html';
    buehne.appendChild(rahmen);
    await new Promise(r => rahmen.onload = r);
    const d = rahmen.contentDocument;
    const seite = d.querySelector('.seite');
    const main  = d.querySelector('main');
    if (!main) { rahmen.remove(); break; }
    gemessen++;
    // verfuegbare Hoehe = Seite minus Kopf, Fuss und Innenabstand
    const st = getComputedStyle(seite);
    let platz = 1123 - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom);
    const kopf = d.querySelector('header'), fuss = d.querySelector('footer');
    if (kopf) platz -= kopf.getBoundingClientRect().height +
                        parseFloat(getComputedStyle(kopf).marginBottom);
    if (fuss) platz -= fuss.getBoundingClientRect().height +
                        parseFloat(getComputedStyle(fuss).marginTop || 0);
    // scrollHeight taugt hier nicht: main ist kein Scrollcontainer und
    // meldet dann nur die eigene Boxhoehe. Gemessen wird die Unterkante
    // des letzten Kindes gegen die Oberkante von main.
    let inhalt = 0;
    const oben = main.getBoundingClientRect().top;
    for (const kind of main.children) {
      const u = kind.getBoundingClientRect().bottom - oben;
      if (u > inhalt) inhalt = u;
    }
    const rest = Math.round(platz - inhalt);
    const ok = rest >= 0;
    if (!ok) schlecht++;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + nr + '</td><td>' + Math.round(inhalt) +
      '</td><td>' + Math.round(platz) + '</td><td>' + rest +
      '</td><td class="' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? 'ok' : 'LAEUFT UEBER') + '</td>';
    tbody.appendChild(tr);
    rahmen.remove();
  }
  document.getElementById('stand').textContent =
    schlecht === 0 ? 'Alle ' + gemessen + ' Seiten passen.'
                   : schlecht + ' von ' + gemessen + ' Seiten laufen ueber.';
  document.title = 'FERTIG ' + schlecht;
})();
</script>
</body></html>
