<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLARTEXT — Referentennotizen</title>
<link rel="stylesheet" href="../schriften/schriften.css">
<style>
:root{
  --marke:#14459E;
  --auf-marke:#B9DFFA;
  --papier:#FFFFFF;
  --schrift:"Atkinson Hyperlegible Next","Helvetica Neue",Arial,sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }

body{
  font-family:var(--schrift);
  background:var(--marke);
  color:var(--papier);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* Drei Zeilen: Kopf, Text (nimmt den Rest), Fuss. Der Textbereich ist der
   einzige, der wachsen und schrumpfen darf — min-height:0 ist noetig,
   sonst laesst Grid ihn ueber das Fenster hinauswachsen und die Messung
   im Skript findet nie einen Ueberlauf. */
.seite{
  height:100%;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:3.2vmin 3.6vmin 2.4vmin;
  gap:2.2vmin;
}

/* ---------- Kopf ---------- */
.kopf{ display:flex; align-items:baseline; gap:.55em; }

.nr{
  font-size:clamp(26px, 3.4vmin, 46px);
  font-weight:700;
  color:var(--auf-marke);
  font-variant-numeric:tabular-nums;
  flex:none;
}

h1{
  font-size:clamp(26px, 3.4vmin, 46px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-0.01em;
}

.weiter{
  margin-top:.5em;
  font-size:clamp(26px, 2.4vmin, 32px);
  font-weight:400;
  color:var(--auf-marke);
}

/* ---------- Notiz ---------- */
/* --gr wird von der Halbierungssuche gesetzt. overflow bleibt hidden,
   solange der Text passt; erst wenn selbst die Untergrenze nicht reicht,
   schaltet das Skript .rollt und damit Scrollen frei. */
#notiz{
  font-size:var(--gr, 30px);
  line-height:1.42;
  overflow:hidden;
  /* Keine Silbentrennung. Sie spart Platz, aber dieser Text wird unter Druck
     vorgelesen — ein am Zeilenende zerschnittenes Wort muss das Auge erst
     wieder zusammensetzen. Der rechte Rand wird dafuer unruhiger, das ist
     der guenstigere Tausch. */
  -webkit-hyphens:none; hyphens:none;
}
#notiz.rollt{ overflow-y:auto; }
#notiz p + p{ margin-top:.62em; }
#notiz strong{ font-weight:700; }

/* ---------- Bearbeiten ---------- */
/* outline statt border: der Rahmen sitzt ausserhalb des Boxmodells und
   veraendert clientHeight nicht. Sonst misst die Halbierungssuche beim
   Verlassen gegen einen anderen Kasten als beim Betreten. */
#notiz.bearbeitet{
  outline:2px solid var(--auf-marke);
  outline-offset:8px;
}
/* Chrome zeichnet auf contenteditable zusaetzlich einen eigenen Fokusrahmen.
   Der liegt direkt am Text und stoert neben dem eigenen. */
#notiz.bearbeitet:focus{ outline:2px solid var(--auf-marke); }
#notiz.bearbeitet p{ caret-color:var(--papier); }

/* ---------- Fuss ---------- */
/* Der Hinweis auf den Server steht nur, bis zum ersten Mal geblaettert
   wurde. Danach ist die Seite leer bis zum Rand. */
/* Weiss, nicht --auf-marke: die Zeile ist klein, und --auf-marke haelt auf
   --marke 6,32:1 — AAA fuer grossen Text, nicht fuer kleinen. */
.fuss{
  font-size:clamp(15px, 1.5vmin, 21px);
  color:var(--papier);
  min-height:1.4em;
}
.fuss[hidden]{ display:block; visibility:hidden; }

/* Querformat: derselbe Aufbau, nur schmalere Raender. Zerbrechen kann
   nichts, weil die Groesse ohnehin gemessen und nicht gesetzt wird. */
@media (orientation:landscape){
  .seite{ padding:2.6vmin 3vmin 2vmin; gap:1.8vmin; }
}
</style>
</head>
<body>
<div class="seite">
  <header>
    <div class="kopf"><span class="nr" id="nr"></span><h1 id="titel"></h1></div>
    <p class="weiter" id="weiter"></p>
  </header>
  <div id="notiz"></div>
  <p class="fuss" id="fuss">Kopplung nur über den lokalen Server: Beide Fenster unter „http://localhost/…“ öffnen, nicht als Datei. Weiter mit Pfeiltaste, Leertaste oder Bild ab.</p>
</div>
<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "text": ["Ich stelle euch heute mein Abschlussprojekt vor: KLARTEXT, ein Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.", "Es geht um Barrierefreiheit. Die meisten denken dabei an Technik: Kontraste, Tastaturbedienung, Vorleseprogramme. Mich interessiert der andere Teil — ob der Text ankommt bei denen, für die er geschrieben ist. Das betrifft alle acht Programmbereiche.", "Angefangen hat es mit dem schärfsten Fall. Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen, und die Beschreibungen dieser Kurse sind in einem Deutsch geschrieben, das man erst nach dem Kurs versteht. Wer Deutsch lernen will, muss also erst Deutsch können. Das ist der Extremfall, aber das Prinzip dahinter gilt überall.", "Ich habe das Projekt allein bearbeitet, alle Rollen liegen also bei mir. Und alle Zahlen, die gleich kommen, habe ich selbst gemessen, an der echten Website, am achtundzwanzigsten Juli. Der Datensatz liegt der Arbeit bei.", "Am Ende zeige ich das Werkzeug an einem echten Kurstext."]}, {"nr": 2, "titel": "5.800 Texte im Jahr, geprüft wird die Technik.", "bild": "folie-02.png", "text": ["Drei Zahlen zum Einstieg.", "Die Volkshochschule veröffentlicht rund fünftausendachthundert Kursbeschreibungen im Jahr. Von allen Texten, die heute im Portal stehen, haben siebenundfünfzig Prozent mindestens einen Befund, und das ist die Untergrenze: Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.", "Die dritte Zahl stammt aus dem Unternehmen selbst. In der Erklärung zur Barrierefreiheit steht, wann die Website zuletzt extern geprüft wurde: am ersten Juli zweitausendeinundzwanzig, heute auf den Tag genau fünf Jahre her. Seitdem bewertet sich das Unternehmen selbst.", "Dieselbe Erklärung enthält den Satz, der mich auf dieses Projekt gebracht hat. Die wichtigsten Informationen zu Betrieb und Kursgeschäft, heißt es dort, seien in einfacher Sprache verfügbar. Das Unternehmen hat die Frage nach der Verständlichkeit also längst gestellt und für einen Bereich beantwortet. Nur für die Kursbeschreibungen selbst, den mit Abstand größten Textbestand, gilt das nicht.", "Da setze ich an. Unten steht die Frage, um die es geht: Mehr als jeder zweite Text hat einen Befund. Für wen ist er eigentlich zu schwer?"]}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "text": ["Daraus folgt mein Vorschlag.", "Das Ziel oben ist von den Lesenden her formuliert. Wer einen Kurs sucht, soll die Beschreibung verstehen, ob er sie liest oder vorgelesen bekommt. Die Betriebssatzung sagt, die Angebote stehen allen offen — dann muss das auch für die Texte gelten, mit denen wir sie ankündigen.", "Geprüft wird zweierlei: ob die Zielgruppe den Text versteht, und ob ein Vorleseprogramm etwas damit anfangen kann.", "Dafür genügt ein System-Prompt in dem KI-Rahmen, den der Volkshochschul- Verband ohnehin für alle Volkshochschulen bereitstellt. Es muss nichts beschafft werden.", "Die Abgrenzung darunter zieht sich durch das ganze Konzept: Für die technische Barrierefreiheit der Website bleibt ein normales Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.", "Unten steht der erste Schritt: ein Pilot in einem Programmbereich, drei Monate. Der Prompt schlägt vor, der Mensch entscheidet."]}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "text": ["Das Unternehmen und der Prozess.", "Die Volkshochschule Frankfurt ist kein Amt, sondern ein Eigenbetrieb der Stadt. Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist. Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat. Diese zwei Sitze spielen später noch eine Rolle.", "Am Ende der ersten Zeile steht die Qualitätstestierung. Das Unternehmen ist seit zweitausendfünf nach L Q W testiert, Lernerorientierte Qualitätstestierung in der Weiterbildung, ein Verfahren mit regelmäßiger externer Prüfung, inzwischen in der sechsten Runde. Hier fehlt also keine Qualitätskultur. Es fehlt genau ein Schritt darin.", "Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung. Daran messe ich das Unternehmen — nicht am Gesetz, sondern an seinem eigenen Anspruch.", "Rechts steht, wie ein Kurstext entsteht. Geplant wird halbjährlich, von den Teams der vier Fachbereiche. Der Text wird geschrieben und ins Kursverwaltungssystem eingepflegt, und dann erscheint er. Über der Spalte steht das Wort angenommen, denn wer bei der vhs Frankfurt die Texte schreibt, ist nicht öffentlich dokumentiert.", "Zwischen dem Einpflegen und dem Erscheinen ist kein Prüfschritt auf Verständlichkeit vorgesehen. Das ist kein Vorwurf, denn dieser Arbeitsschritt ist nirgends vorgesehen. Genau deshalb ist es ein Fall für Prozessgestaltung und nicht für einen Appell, sich mehr Mühe zu geben.", "Für das gedruckte Programmheft gibt es sehr wohl eine Redaktion, das Impressum nennt sie mit Namen. Für das Portal gibt es sie nicht, und dort stehen die Texte, um die es hier geht.", "Ich habe nachgezählt: Vierundfünfzig Prozent aller Kurse teilen sich ihren Text mit mindestens einem anderen. Ein schlecht formulierter Text ist hier nie ein Einzelfall."]}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "text": ["Zur Potenzialermittlung. Hier habe ich nicht geschätzt, sondern gemessen.", "Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen, gut dreitausend, und mit einem eigenen Skript ausgewertet. Siebenundfünfzig Prozent haben mindestens einen Befund.", "Oben steht, wonach ich gemessen habe: sechs Regeln, erst der Maßstab, dann das Ergebnis. Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.", "Links stehen die beiden Pflichtregeln. Sie stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit verbindlich.", "Struktur heißt: Eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext. Dasselbe gilt für Aufzählungen, die jemand nur mit Bindestrichen gebaut hat. Wer sehend liest, merkt davon nichts. Ein Screenreader dagegen bietet an, sich alle Überschriften einer Seite vorlesen zu lassen, um gezielt dorthin zu springen — was technisch keine Überschrift ist, taucht in dieser Liste nicht auf. Die Gliederung ist dann sichtbar vorhanden und für das Vorleseprogramm nicht da.", "Linktext heißt: Der Link sagt nicht, wohin er führt. Das bekannteste Beispiel ist ein Link, der schlicht „hier“ heißt. Der Grund ist derselbe: Screenreader lesen auf Wunsch nur die Links einer Seite vor, ohne den Text drumherum. Eine Liste aus fünfmal „hier“ hilft niemandem weiter.", "Rechts stehen die vier Empfehlungen. Verbindlich sind sie nicht, aber sie sind der eigentliche Ertrag dieses Projekts. Zwei davon, zu schwere Wörter und nicht aufgelöste Abkürzungen, stehen auf Stufe AAA — der höchsten, die niemand einhalten muss. Die beiden anderen habe ich selbst gesetzt.", "Niveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.", "Amtsdeutsch heißt: Im Text steht ein Verwaltungswort, obwohl ein alltägliches genügen würde. Umbuchung statt Wechsel, gegebenenfalls statt wenn nötig. Das trifft nicht nur Sprachanfänger, sondern auch geübte Leserinnen und Leser.", "Satz heißt: über fünfundzwanzig Wörter, bei Deutschkursen über fünfzehn. Diese beiden Zahlen habe ich gesetzt, nicht gemessen; sie orientieren sich an den Empfehlungen für einfache Sprache. Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nämlich nichts, und ob es die richtigen Zahlen sind, soll der Pilot beantworten.", "Abkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.", "Die Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.", "Beim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.", "Der Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.", "Dabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.", "Deshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.", "Noch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch."]}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "text": ["Kurz die Rechtslage.", "Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.", "Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.", "Der Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — genau die beiden Kriterien also, um die es in diesem Projekt geht.", "Ich könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.", "Freiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.", "Den eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind."]}, {"nr": 7, "titel": "Was die Technik prüft, und was nur ein Mensch sieht.", "bild": "folie-07.png", "text": ["Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.", "Links steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.", "Rechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.", "Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.", "Diese Trennung hat sich beim Bauen zweimal selbst bestätigt. Zwei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Beide stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.", "Technisch braucht es den KI-Rahmen, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort hinterlegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem."]}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "text": ["Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.", "Die ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.", "Der KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.", "Das ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.", "In der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn Anhang III setzt überall eine Bewertung natürlicher Personen voraus. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird."]}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "text": ["Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.", "Der erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.", "Eine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.", "Der zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.", "Rechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.", "Ich zeige euch das kurz live, an genau diesem Kurs.", "Das ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.", "Die Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt."]}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "text": ["Damit zum Change-Teil, und der beginnt mit den <strong>Stakeholdern</strong>. Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.", "Oben rechts, eng einbinden: wer entscheidet oder zustimmen muss.", "<strong>Der Direktor</strong> — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.", "<strong>Der Fachbereich des Pilotbereichs</strong> — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.", "<strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.", "<strong>Der Personalrat</strong> — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein <strong>sperrender</strong>: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.", "Nur dieser eine Fachbereich — deshalb unten links, informieren.", "<strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.", "Oben links: hoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.", "<strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.", "<strong>Advellence</strong> — die Schweizer Firma, die laut Impressum das Portal programmiert.", "<strong>Die Betriebskommission</strong> — Aufsichtsgremium.", "<strong>Der Volkshochschul-Verband</strong> — stellt den KI-Rahmen, den ich nutze.", "Und unten rechts der Quadrant, der mich am meisten beschäftigt hat.", "<strong>Die Kursleitungen auf Honorarbasis</strong> — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.", "<strong>Die Teilnehmenden</strong> — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.", "Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie."]}, {"nr": 11, "titel": "Wer Nein sagt, und was darauf antwortet.", "bild": "folie-11.png", "text": ["Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Verlustangst, Unsicherheit, Gewohnheit und fehlende Perspektive. Ich zeige sie nicht als Liste, sondern an vier Rollen von der Folie davor — jede sagt Nein aus einem anderen Grund.", "Der Programmbereich zuerst. Sein Einwand: Die Befunde stehen in Bausteinen, über die ich nicht entscheide. Ich habe das nachgezählt, und es stimmt vollständig. Der Beispielkurs, den ich gleich vorführe, hat keinen eigenen Satz. Er besteht restlos aus zwei Bausteinen, dem Anmeldehinweis und der Niveaubeschreibung. Alle neun Befunde liegen dort, und der Anmeldehinweis steht wortgleich in hundertfünf Kursen. Das ist Verlustangst in ihrer echten Form: nicht Angst vor der Maschine, sondern die Aussicht, für etwas gemessen zu werden, das man nicht ändern darf. Meine Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage, die vor dem Pilot geklärt wird. Nebenbei ist es die gute Nachricht: ein Baustein in Ordnung gebracht, und hundertfünf Kurse sind es mit.", "Die Kursleitung auf Honorarbasis. Noch eine Aufgabe, für die es keine Unterrichtseinheit gibt — das ist fehlende Perspektive, und bei dieser Gruppe schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor. Meine Antwort ist der Zuschnitt: Geprüft wird im Programmbereich, an dem Text, der dort eingeht. Das schützt auch den Status. Verbindliche Regeln, Schulungspflicht und ein Protokoll je Text sind genau die Merkmale, aus denen das Bundessozialgericht im Herrenberg-Urteil eine Eingliederung in den Betrieb hergeleitet hat.", "Die Redaktion des Programmhefts. Ihr Einwand ist der, an den ich zuletzt gedacht hätte: Verständlicher heißt länger, und ich habe eine feste Seitenzahl. Das ist Gewohnheit, aber nicht als Trägheit, sondern als konkurrierendes Regelwerk. Diese Redaktion kürzt beruflich, ein Werkzeug, das Erklärungen verlangt, arbeitet gegen ihren Auftrag. Meine Antwort trennt die Medien: Geprüft wird der Text im Portal, und dort gibt es keine Seitenzahl.", "Und der Personalrat. Der Paragraf knüpft die Mitbestimmung an technische Einrichtungen, die zur Überwachung geeignet sind — geeignet, nicht verwendet. Eine Zusage, nicht nach Urheber auszuwerten, räumt den Tatbestand also gar nicht aus, und etwas vorzulegen ist keine Zustimmung. Das Instrument nennt der Paragraf selbst: die Dienstvereinbarung, mit Zweckbindung, Zugriffskreis und Löschfrist. Sie ist die Voraussetzung für alles Weitere und kommt auf den nächsten beiden Folien noch zweimal vor.", "Der Satz unten: Betroffene zu Beteiligten machen. Hier heißt das konkret, entscheiden, bevor geschult wird. Drei der vier Einwände sind überhaupt keine Kommunikationsaufgabe. Wer die Bausteinfreigabe, die Zuständigkeit und den Umgang mit den Protokollen offenlässt und stattdessen eine Schulung ansetzt, schult gegen einen Widerstand, der berechtigt ist. Der vierte, der der Redaktion, ist einer — und er wird beantwortet, indem man zugibt, dass sie mit dem fehlenden Prüfschritt die ganze Zeit recht hatte."]}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "text": ["Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.", "Erstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.", "Und zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat."]}, {"nr": 13, "titel": "Die ersten 30 Tage, und was sie kosten.", "bild": "folie-13.png", "text": ["Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.", "Die Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine, sonst trifft der Quick Win auf niemanden. Und erst als viertes das Technische, den Assistenten anlegen.", "Rechts die Zahlen, denn der häufigste Einwand lautet, das koste zu viel Zeit. Er rechnet so: fünftausendachthundert Veranstaltungen, drei Minuten pro Text, zweihundertneunzig Stunden im Jahr. Diese Rechnung unterstellt, dass jede Veranstaltung einen eigenen Text hat. Hat sie nicht. Vierundfünfzig Prozent der Kurse teilen ihren Text mit mindestens einem anderen, und nur rund zehn Prozent der Angebote sind je Semester neu. Übrig bleiben ungefähr sechshundert Texte und damit neunundzwanzig Stunden. Im Pilot sind es vier.", "Die größte Unsicherheit steht unten: Was die vhs als neues Angebot zählt, ist nicht dokumentiert. Im Grenzfall wären es zweihundertzwanzig Stunden — immer noch unter dem Einwand, aber die Zahl gehört im Pilot gemessen."]}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "text": ["Und woran würde man merken, ob es gewirkt hat?", "Vier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.", "Die vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.", "Diese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.", "In der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und das Skript ist dafür eingefroren. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.", "Unten steht das Risiko, das ich zuerst übersehen habe und das unangenehmste ist: Die Protokolle können gegen das Unternehmen verwendet werden. Sie belegen datiert und zitierbar, dass Texte Kriterien verletzen, die das Haus sich freiwillig gibt. Wer laut Impressum persönlich für die Inhalte verantwortlich ist, hat nach dem Pilot eine Kenntnis, die er vorher nicht hatte. Deshalb gehören die Protokolle in dieselbe Dienstvereinbarung, und deshalb gehört zu jedem Befundstand ein Abstellplan mit Datum. Ein dokumentierter Mangel mit Plan steht besser da als ungeprüfter Bestand — aber nur, wenn der Plan wirklich existiert."]}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "text": ["Ich habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.", "Der System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.", "Danke für die Aufmerksamkeit. Die Adresse steht oben, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen."]}];
</script>
<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
// Untergrenze der Halbierungssuche, in px. Auf dem Zielgeraet (1080x1920)
// kommt keine Folie ihr nahe — die laengste Notiz, Folie 5 mit 612 Woertern,
// passt bei 21px. Die Grenze greift erst in kleinen Fenstern; dort rollt die
// Folie dann lieber, statt unleserlich zu werden.
const MIN = 18;
const MAX = 64;          // Obergrenze
const SPEICHER = 'klartext-notizen-nachstellung';

// Nachstellung des Referenten, in Prozent. + und - verschieben sie, der
// Wert ueberlebt einen Neustart des Browsers.
let nachstellung = 100;
try { nachstellung = parseInt(localStorage.getItem(SPEICHER), 10) || 100; }
catch (e) {}

const eNr     = document.getElementById('nr');
const eTitel  = document.getElementById('titel');
const eWeiter = document.getElementById('weiter');
const eNotiz  = document.getElementById('notiz');
const eFuss   = document.getElementById('fuss');

let letzteGroesse = 0;   // fuer die Messseite

// Groesste Schriftgroesse suchen, bei der der Text noch in den Kasten
// passt. Halbierungssuche in ganzen Pixeln: rund sieben Durchlaeufe, das
// merkt niemand. Gemessen wird scrollHeight gegen clientHeight — genau der
// Wert, der auch entscheidet, ob abgeschnitten wuerde.
function passtBei(px){
  eNotiz.style.setProperty('--gr', px + 'px');
  return eNotiz.scrollHeight <= eNotiz.clientHeight;
}

function sucheGroesse(){
  if (passtBei(MAX)) return MAX;
  let lo = MIN, hi = MAX, best = 0;
  while (lo <= hi) {
    const mitte = (lo + hi) >> 1;
    if (passtBei(mitte)) { best = mitte; lo = mitte + 1; }
    else { hi = mitte - 1; }
  }
  return best || MIN;      // 0 heisst: passt selbst bei MIN nicht
}

function einpassen(){
  // Beim Bearbeiten bleibt die Groesse stehen, die beim Oeffnen gefunden
  // wurde. Sonst springt der ganze Text bei jedem getippten Wort um eine
  // Stufe, sobald er die Kastenhoehe kreuzt.
  if (editorAktiv()) return;
  eNotiz.classList.remove('rollt');
  const basis = sucheGroesse();

  // Die Nachstellung wirkt auf das gefundene Mass. Ohne sie fuellt der Text
  // den Kasten genau aus, und + und - haetten fast nie eine Wirkung — die
  // Groesse haengt ja am Platz, nicht am Geschmack. Stellt der Referent
  // groesser, als es passt, rollt die Folie. Das ist gewollt: lieber rollen
  // als abschneiden, denn ein abgeschnittener Satz faellt auf der Buehne
  // nicht auf.
  const px = Math.min(128, Math.max(10, Math.round(basis * nachstellung / 100)));
  if (!passtBei(px)) eNotiz.classList.add('rollt');
  letzteGroesse = px;
}

function zeige(i){
  const f = FOLIEN[i];
  eNr.textContent = String(f.nr).padStart(2, '0');
  eTitel.textContent = f.titel;
  const n = FOLIEN[i + 1];
  eWeiter.textContent = n ? 'Weiter: ' + n.titel : 'Letzte Folie.';
  eNotiz.innerHTML = f.text.map(p => '<p>' + p + '</p>').join('');
  eNotiz.scrollTop = 0;
  fussSetzen();
  einpassen();
  document.title = 'Notizen ' + String(f.nr).padStart(2, '0');
}

function groesser(richtung){
  nachstellung = Math.min(200, Math.max(50, nachstellung + richtung * 5));
  try { localStorage.setItem(SPEICHER, String(nachstellung)); } catch (e) {}
  einpassen();
}

// Nach einer Groessenaenderung erst messen, wenn der Umbruch steht.
//
// einpassen() sucht die Groesse ueber eine Halbierungssuche und misst dabei
// mehrfach die Hoehe des Textes. Wer ein Fenster am Rand zieht, loest
// Dutzende resize-Ereignisse aus; ohne Zusammenfassung liefe die Suche
// jedes Mal komplett durch. Ein Takt Verzoegerung plus Bildrahmen fasst sie
// zusammen und stellt zugleich sicher, dass gegen den neuen und nicht gegen
// den alten Kasten gemessen wird.
let nachlauf = 0;
function einpassenSpaeter(){
  clearTimeout(nachlauf);
  nachlauf = setTimeout(() => requestAnimationFrame(einpassen), 60);
}
addEventListener('resize', einpassenSpaeter);
// Beim Wechsel ins Vollbild aendert sich die Fensterhoehe; das Ereignis kommt
// je nach Browser vor oder nach dem Neuaufbau. Der Beobachter greift in
// beiden Faellen, auch wenn resize einmal ausbleibt.
addEventListener('fullscreenchange', einpassenSpaeter);
if (window.ResizeObserver) new ResizeObserver(einpassenSpaeter).observe(document.documentElement);
document.fonts.ready.then(einpassen);

// Haken fuer die Ueberlaufmessung. Die Messseite laedt diese Datei in einen
// iframe, springt jede Folie an und liest hier ab.
// Unterkante des Textes im Kasten. scrollHeight taugt dafuer nicht: er ist
// nie kleiner als clientHeight und meldet deshalb immer 0 Rest.
function unterkante(){
  const oben = eNotiz.getBoundingClientRect().top;
  let tief = 0;
  for (const p of eNotiz.children) {
    const u = p.getBoundingClientRect().bottom - oben + eNotiz.scrollTop;
    if (u > tief) tief = u;
  }
  return Math.round(tief);
}

window.klartext = {
  gehe: i => gehe(i, false),
  anzahl: () => FOLIEN.length,
  messung: () => ({
    folie: folie + 1,
    groesse: letzteGroesse,
    inhalt: unterkante(),
    kasten: eNotiz.clientHeight,
    rest: eNotiz.clientHeight - unterkante(),
    rollt: eNotiz.classList.contains('rollt'),
    fett: eNotiz.querySelectorAll('strong').length,
    absaetze: eNotiz.querySelectorAll('p').length
  })
};

// ---------- Notiz bearbeiten ----------
//
// Geschrieben wird in folien.md, dafuer braucht es einen Server, der schreiben
// kann. python3 -m http.server kann es nicht; ob dieser es kann, wird einmal
// beim Aufbau gefragt.

let bearbeitet = false;   // Editiermodus an
let schmutzig  = false;   // ungespeicherte Aenderung im Kasten
let schreibbar = false;   // Server nimmt POST /notiz an
let meldung    = '';      // Statuszeile, verdraengt den Fusstext
let meldeUhr   = 0;

const FUSS_RUHE = eFuss.textContent;

function imEditor(){ return bearbeitet; }

function fussSetzen(){
  if (meldung) { eFuss.textContent = meldung; eFuss.hidden = false; return; }
  if (bearbeitet) {
    eFuss.textContent = schmutzig
      ? 'Bearbeiten — noch nicht gespeichert. ⌘S speichert, Esc speichert und schließt, ⌘B setzt fett.'
      : 'Bearbeiten — gespeichert. Esc schließt, ⌘B setzt fett.';
    eFuss.hidden = false;
    return;
  }
  eFuss.textContent = FUSS_RUHE;
  eFuss.hidden = geblaettert;
}

function melde(text, dauer){
  clearTimeout(meldeUhr);
  meldung = text || '';
  fussSetzen();
  if (meldung && dauer) {
    meldeUhr = setTimeout(() => { meldung = ''; fussSetzen(); }, dauer);
  }
}

// ---------- Kasten zurueck nach Markdown ----------
//
// Nicht die Sterne beim Durchlaufen einsetzen und auf das Beste hoffen:
// contenteditable schachtelt gern (<b><b>x</b></b>) und zerteilt eine
// Auszeichnung an der Stelle, an der der Cursor stand. Deshalb entsteht erst
// eine flache Folge aus {text, fett}, in der gleiche Nachbarn verschmelzen.
// Die Sterne kommen zuletzt und koennen so nicht doppelt auftreten.

const BLOCK = /^(P|DIV|LI|BLOCKQUOTE|PRE|H[1-6]|TR)$/;

function istFett(k){
  if (k.tagName === 'STRONG' || k.tagName === 'B') return true;
  const g = k.style && k.style.fontWeight;
  return g === 'bold' || g === 'bolder' || parseInt(g, 10) >= 600;
}

function alsMarkdown(){
  const teile = [];
  function schiebe(text, fett){
    if (!text) return;
    const letzt = teile[teile.length - 1];
    if (letzt && letzt.fett === fett) letzt.text += text;
    else teile.push({text: text, fett: fett});
  }
  function lauf(knoten, fett){
    for (const k of knoten.childNodes) {
      if (k.nodeType === 3) { schiebe(k.data, fett); continue; }
      if (k.nodeType !== 1) continue;
      if (k.tagName === 'BR') { schiebe('\n\n', false); continue; }
      lauf(k, fett || istFett(k));
      if (BLOCK.test(k.tagName)) schiebe('\n\n', false);
    }
  }
  lauf(eNotiz, false);

  let t = '';
  for (const s of teile) {
    if (!s.fett) { t += s.text; continue; }
    // Die Sterne muessen am Wort kleben: '** fett **' ist in Markdown keine
    // Auszeichnung, sondern landet als vier Sternchen im Vortragstext.
    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s.text);
    t += m[2] ? m[1] + '**' + m[2] + '**' + m[3] : s.text;
  }

  // Absaetze trennen an Leerzeilen. Aller uebrige Weissraum — einzelne
  // Umbrueche, Tabulatoren, die geschuetzten Leerzeichen, die contenteditable
  // beim Tippen einstreut — wird zu einem Leerzeichen. In folien.md steht
  // danach je Absatz ein Block; den Zeilenumbruch darin macht umbrechen().
  return t.split(/\n\s*\n/)
          .map(b => b.replace(/\s+/g, ' ').trim())
          .filter(Boolean)
          .join('\n\n');
}

// ---------- Oeffnen, speichern, schliessen ----------

function editorOeffnen(){
  if (bearbeitet) return;
  if (!schreibbar) {
    melde('Bearbeiten braucht den schreibenden Server: python3 notizen.py --server', 8000);
    return;
  }
  bearbeitet = true;
  schmutzig = false;
  // Rollen erlauben: beim Tippen darf der Text ueber den Kasten hinaus
  // wachsen. Die Schriftgroesse bleibt derweil stehen, siehe einpassen().
  eNotiz.classList.add('bearbeitet', 'rollt');
  eNotiz.contentEditable = 'true';
  eNotiz.spellcheck = true;
  eNotiz.focus();
  // Ohne das legt Chrome fuer Fettdruck ein <span style="font-weight:bold">
  // an statt eines <b>. Lesbar waere beides, aber <b> ist das, was der
  // Umwandler oben zuerst prueft.
  try { document.execCommand('styleWithCSS', false, false); } catch (e) {}
  melde('');
}

async function speichern(){
  const text = alsMarkdown();
  if (!text) { melde('Die Notiz ist leer — nicht gespeichert.', 8000); return false; }
  melde('Speichere …');
  let d;
  try {
    const a = await fetch('/notiz', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nr: FOLIEN[folie].nr, text: text})
    });
    d = await a.json();
  } catch (e) {
    melde('Server nicht erreichbar. Es wurde nichts gespeichert.', 10000);
    return false;
  }
  if (!d.ok) { melde('Nicht gespeichert: ' + d.fehler, 10000); return false; }
  // Der Server liefert die Absaetze so zurueck, wie sie beim naechsten Start
  // aus der Datei gelesen wuerden. Damit zeigt der Kasten nach dem Schliessen
  // genau das, was in folien.md steht — nicht das, was man getippt hat.
  FOLIEN[folie].text = d.absaetze;
  schmutzig = false;
  melde('In folien.md gespeichert.', 4000);
  return true;
}

async function editorSchliessen(){
  if (!bearbeitet) return;
  if (schmutzig && !(await speichern())) return;   // Fehler: offen lassen
  bearbeitet = false;
  eNotiz.contentEditable = 'false';
  eNotiz.spellcheck = false;
  eNotiz.classList.remove('bearbeitet');
  const f = FOLIEN[folie];
  eNotiz.innerHTML = f.text.map(p => '<p>' + p + '</p>').join('');
  eNotiz.scrollTop = 0;
  einpassen();
  fussSetzen();
}

// ---------- Tastatur und Eingabe ----------

// Laeuft nach dem Handler in JS_GEMEINSAM, der bei offenem Editor sofort
// aussteigt. Diese drei Griffe sind die einzigen, die dann noch gelten.
document.addEventListener('keydown', ev => {
  if (!bearbeitet) return;
  const k = ev.key, cmd = ev.metaKey || ev.ctrlKey;
  if (k === 'Escape') { ev.preventDefault(); editorSchliessen(); }
  else if (cmd && (k === 's' || k === 'S')) { ev.preventDefault(); speichern(); }
  else if (cmd && (k === 'b' || k === 'B')) {
    ev.preventDefault();
    document.execCommand('bold');
    schmutzig = true;
    fussSetzen();
  }
});

eNotiz.addEventListener('input', () => {
  if (!bearbeitet || schmutzig) return;
  schmutzig = true;
  fussSetzen();
});

// Eingefuegter Text aus Word oder aus einer Website bringt sonst <span
// style=...>, <font> und ganze Tabellen mit in den Kasten. Uebernommen wird
// nur der reine Text; fett setzt man danach mit ⌘B.
eNotiz.addEventListener('paste', ev => {
  if (!bearbeitet) return;
  ev.preventDefault();
  const t = (ev.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});
eNotiz.addEventListener('drop', ev => { if (bearbeitet) ev.preventDefault(); });

addEventListener('beforeunload', ev => {
  if (!schmutzig) return;
  ev.preventDefault();
  ev.returnValue = '';
});

// Einmal fragen, ob der Server schreiben kann. Bei python3 -m http.server
// gibt es /notiz nicht, dann bleibt schreibbar false und die Taste E meldet
// das beim Druecken.
fetch('/notiz')
  .then(a => a.ok ? a.json() : null)
  .then(d => { schreibbar = !!(d && d.schreibbar); })
  .catch(() => {});

gehe(ausAdresse(), false);
</script>
