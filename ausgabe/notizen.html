<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLARTEXT — Referentennotizen</title>
<link rel="stylesheet" href="../schriften/schriften.css">
<style>
:root{
  --marke:#14459E;
  --auf-marke:#B9DFFA;
  --papier:#FFFFFF;
  --schrift:"Atkinson Hyperlegible Next","Helvetica Neue",Arial,sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }

body{
  font-family:var(--schrift);
  background:var(--marke);
  color:var(--papier);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* Drei Zeilen: Kopf, Text (nimmt den Rest), Fuss. Der Textbereich ist der
   einzige, der wachsen und schrumpfen darf — min-height:0 ist noetig,
   sonst laesst Grid ihn ueber das Fenster hinauswachsen und die Messung
   im Skript findet nie einen Ueberlauf. */
.seite{
  height:100%;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:3.2vmin 3.6vmin 2.4vmin;
  gap:2.2vmin;
}

/* Alle vier ausdruecklich platzieren. Anzeige und Textfeld teilen sich die
   mittlere Zelle — sichtbar ist immer nur eines von beiden. Ohne die
   ausdrueckliche Zuweisung schoebe das automatische Platzieren die Fusszeile
   in eine vierte Zeile, sobald das Textfeld dazukommt. */
.seite > header{ grid-row:1; }
#notiz, #quelle{ grid-row:2; grid-column:1; }
.seite > .fuss{ grid-row:3; }

/* ---------- Kopf ---------- */
.kopf{ display:flex; align-items:baseline; gap:.55em; }

.nr{
  font-size:clamp(26px, 3.4vmin, 46px);
  font-weight:700;
  color:var(--auf-marke);
  font-variant-numeric:tabular-nums;
  flex:none;
}

h1{
  font-size:clamp(26px, 3.4vmin, 46px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-0.01em;
}

/* ---------- Notiz ---------- */
/* --gr wird von der Halbierungssuche gesetzt. overflow bleibt hidden,
   solange der Text passt; erst wenn selbst die Untergrenze nicht reicht,
   schaltet das Skript .rollt und damit Scrollen frei. */
#notiz{
  font-size:var(--gr, 30px);
  line-height:1.42;
  overflow:hidden;
  /* Keine Silbentrennung. Sie spart Platz, aber dieser Text wird unter Druck
     vorgelesen — ein am Zeilenende zerschnittenes Wort muss das Auge erst
     wieder zusammensetzen. Der rechte Rand wird dafuer unruhiger, das ist
     der guenstigere Tausch. */
  -webkit-hyphens:none; hyphens:none;
}
#notiz.rollt{ overflow-y:auto; }
#notiz p + p{ margin-top:.62em; }
#notiz strong{ font-weight:700; }
#notiz em{ font-style:italic; }

/* Markdown in der Notiz. Alle Masse in em, damit die Halbierungssuche mit
   einer einzigen Schriftgroesse den ganzen Block skaliert — ein fester
   px-Wert an einer Ueberschrift liesse sie beim Verkleinern stehen und die
   Suche faende nie eine passende Groesse.

   Die Ueberschriften stehen in --auf-marke. Das haelt auf --marke 6,32:1 und
   ist damit AAA fuer grossen Text; klein werden sie nicht, sie sind stets
   groesser als der Fliesstext. */
#notiz h2, #notiz h3, #notiz h4{
  color:var(--auf-marke);
  font-weight:700;
  line-height:1.2;
  margin:1.1em 0 .35em;
}
#notiz > :first-child{ margin-top:0; }
#notiz h2{ font-size:1.5em; }
#notiz h3{ font-size:1.25em; }
#notiz h4{ font-size:1.08em; }

#notiz ul, #notiz ol{ margin:.5em 0 .5em 1.4em; }
#notiz li{ margin-top:.3em; }
#notiz li::marker{ color:var(--auf-marke); }

/* Zitat: was wortwoertlich vorgelesen wird. Der Balken links zeigt beim
   Ueberfliegen sofort, wo der eigene Text aufhoert. */
#notiz blockquote{
  margin:.7em 0;
  padding-left:.8em;
  border-left:.2em solid var(--auf-marke);
}

#notiz hr{
  border:none;
  border-top:1px solid var(--auf-marke);
  margin:1em 0;
}

/* ---------- Bearbeiten ---------- */
/* Ein Textfeld mit dem rohen Markdown, kein contenteditable. Es liegt an
   derselben Stelle wie die Anzeige und ersetzt sie, solange bearbeitet wird.
   Die Anzeige bleibt dabei im Baum stehen (display:none), damit die
   Halbierungssuche beim Schliessen wieder gegen denselben Kasten misst.

   Warum Textfeld statt WYSIWYG: contenteditable liefert HTML zurueck, und
   dieses HTML muss jemand nach Markdown ruecklesen — mit geschachtelten <b>,
   eingefuegten <span style>, Absaetzen, die mal <p> und mal <div> sind. Was
   im Textfeld steht, geht dagegen unveraendert in die Datei. */
#quelle{
  display:none;
  width:100%; height:100%;
  box-sizing:border-box;
  padding:.7em .8em;
  border:none;
  outline:2px solid var(--auf-marke);
  outline-offset:6px;
  border-radius:2px;
  background:rgba(0,0,0,.22);        /* etwas tiefer als die Flaeche, damit
                                        das Feld als Feld lesbar ist */
  color:var(--papier);
  caret-color:var(--papier);
  font-family:var(--schrift);
  /* Dieselbe Groesse und Zeilenhoehe wie die Anzeige: --gr haengt an .seite
     und wird von beiden geerbt. Beim Umschalten springt der Text so nicht in
     der Groesse — man bearbeitet den Text, den man eben gelesen hat.
     Die Markdown-Marker machen den Text laenger als die Anzeige; passt er
     dann nicht mehr, rollt das Feld. */
  font-size:var(--gr, 30px);
  line-height:1.42;
  resize:none;
  -webkit-hyphens:none; hyphens:none;
}
.bearbeitet #quelle{ display:block; }
.bearbeitet #notiz{ display:none; }

/* ---------- Stift ---------- */
/* Sitzt rechts in der Fusszeile und bleibt stehen, auch wenn der Hinweistext
   nach dem ersten Blaettern verschwindet. Erscheint nur, wenn der Server
   schreiben kann — sonst waere er eine Falle. */
.fuss{ display:flex; align-items:center; gap:1em; }
.fusstext{ flex:1; min-width:0; }
.fusstext[hidden]{ display:block; visibility:hidden; }

.stift{
  flex:none;
  display:flex; align-items:center; justify-content:center;
  width:2.4em; height:2.4em;
  padding:0; border:none; border-radius:50%;
  background:transparent;
  color:var(--auf-marke);
  cursor:pointer;
}
.stift svg{ width:1.5em; height:1.5em; display:block; }
.stift:hover{ background:rgba(255,255,255,.14); color:var(--papier); }
/* Der Fokusrahmen muss sichtbar bleiben: die Seite laesst sich vollstaendig
   mit der Tastatur bedienen, und das ist bei diesem Projekt keine Nebensache. */
.stift:focus-visible{ outline:2px solid var(--papier); outline-offset:2px; }
.stift[hidden]{ display:none; }

/* ---------- Fuss ---------- */
/* Der Hinweis auf den Server steht nur, bis zum ersten Mal geblaettert
   wurde. Danach ist die Seite leer bis zum Rand. */
/* Weiss, nicht --auf-marke: die Zeile ist klein, und --auf-marke haelt auf
   --marke 6,32:1 — AAA fuer grossen Text, nicht fuer kleinen. */
.fuss{
  font-size:clamp(15px, 1.5vmin, 21px);
  color:var(--papier);
  min-height:1.4em;
}

/* Querformat: derselbe Aufbau, nur schmalere Raender. Zerbrechen kann
   nichts, weil die Groesse ohnehin gemessen und nicht gesetzt wird. */
@media (orientation:landscape){
  .seite{ padding:2.6vmin 3vmin 2vmin; gap:1.8vmin; }
}
</style>
</head>
<body>
<div class="seite">
  <header>
    <div class="kopf"><span class="nr" id="nr"></span><h1 id="titel"></h1></div>
  </header>
  <div id="notiz"></div>
  <textarea id="quelle" spellcheck="true" aria-label="Notiz als Markdown"></textarea>
  <p class="fuss">
    <span class="fusstext" id="fusstext">Kopplung nur über den lokalen Server: Beide Fenster unter „http://localhost/…“ öffnen, nicht als Datei. Weiter mit Pfeiltaste, Leertaste oder Bild ab.</span>

            title="Notiz bearbeiten (Taste E)" aria-label="Notiz bearbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg></button>
  </p>
</div>
<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "html": "<h3>Begrüßung</h3><p>Ich stelle euch heute mein Abschlussprojekt vor: KLARTEXT, ein Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.</p><h3>Worum es geht</h3><p>Es geht um Barrierefreiheit. Die meisten denken dabei an Technik: Kontraste, Tastaturbedienung, Vorleseprogramme. Mich interessiert der andere Teil — ob der Text ankommt bei denen, für die er geschrieben ist. Das betrifft alle acht Programmbereiche.</p><h3>Der schärfste Fall</h3><p>Angefangen hat es mit dem schärfsten Fall. Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen, und die Beschreibungen dieser Kurse sind in einem Deutsch geschrieben, das man erst nach dem Kurs versteht. Wer Deutsch lernen will, muss also erst Deutsch können. Das ist der Extremfall, aber das Prinzip dahinter gilt überall.</p><h3>Rollen und Datenstand</h3><p>Ich habe das Projekt allein bearbeitet, alle Rollen liegen also bei mir. Und alle Zahlen, die gleich kommen, habe ich selbst gemessen, an der echten Website, am achtundzwanzigsten Juli. Der Datensatz liegt der Arbeit bei.</p><h3>Ausblick</h3><p>Am Ende zeige ich das Werkzeug an einem echten Kurstext.</p>", "roh": "### Begrüßung\n\nIch stelle euch heute mein Abschlussprojekt vor: KLARTEXT, ein Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.\n\n### Worum es geht\n\nEs geht um Barrierefreiheit. Die meisten denken dabei an Technik: Kontraste, Tastaturbedienung, Vorleseprogramme. Mich interessiert der andere Teil — ob der Text ankommt bei denen, für die er geschrieben ist. Das betrifft alle acht Programmbereiche.\n\n### Der schärfste Fall\n\nAngefangen hat es mit dem schärfsten Fall. Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen, und die Beschreibungen dieser Kurse sind in einem Deutsch geschrieben, das man erst nach dem Kurs versteht. Wer Deutsch lernen will, muss also erst Deutsch können. Das ist der Extremfall, aber das Prinzip dahinter gilt überall.\n\n### Rollen und Datenstand\n\nIch habe das Projekt allein bearbeitet, alle Rollen liegen also bei mir. Und alle Zahlen, die gleich kommen, habe ich selbst gemessen, an der echten Website, am achtundzwanzigsten Juli. Der Datensatz liegt der Arbeit bei.\n\n### Ausblick\n\nAm Ende zeige ich das Werkzeug an einem echten Kurstext."}, {"nr": 2, "titel": "5.800 Texte im Jahr, geprüft wird die Technik.", "bild": "folie-02.png", "html": "<p>Drei Zahlen zum Einstieg.</p><h3>5.800 Texte und 57 Prozent</h3><p>Die Volkshochschule veröffentlicht rund fünftausendachthundert Kursbeschreibungen im Jahr. Von allen Texten, die heute im Portal stehen, haben siebenundfünfzig Prozent mindestens einen Befund, und das ist die Untergrenze: Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.</p><h3>Fünf Jahre ohne externe Prüfung</h3><p>Die dritte Zahl stammt aus dem Unternehmen selbst. In der Erklärung zur Barrierefreiheit steht, wann die Website zuletzt extern geprüft wurde: am ersten Juli zweitausendeinundzwanzig, heute auf den Tag genau fünf Jahre her. Seitdem bewertet sich das Unternehmen selbst.</p><h3>Einfache Sprache, der eigentliche Anlass</h3><p>Dieselbe Erklärung enthält den Satz, der mich auf dieses Projekt gebracht hat. Die wichtigsten Informationen zu Betrieb und Kursgeschäft, heißt es dort, seien in einfacher Sprache verfügbar. Das Unternehmen hat die Frage nach der Verständlichkeit also längst gestellt und für einen Bereich beantwortet. Nur für die Kursbeschreibungen selbst, den mit Abstand größten Textbestand, gilt das nicht.</p><h3>Der Kasten unten</h3><p>Da setze ich an. Unten steht die Frage, um die es geht: Mehr als jeder zweite Text hat einen Befund. Für wen ist er eigentlich zu schwer?</p>", "roh": "Drei Zahlen zum Einstieg.\n\n### 5.800 Texte und 57 Prozent\n\nDie Volkshochschule veröffentlicht rund fünftausendachthundert Kursbeschreibungen im Jahr. Von allen Texten, die heute im Portal stehen, haben siebenundfünfzig Prozent mindestens einen Befund, und das ist die Untergrenze: Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.\n\n### Fünf Jahre ohne externe Prüfung\n\nDie dritte Zahl stammt aus dem Unternehmen selbst. In der Erklärung zur Barrierefreiheit steht, wann die Website zuletzt extern geprüft wurde: am ersten Juli zweitausendeinundzwanzig, heute auf den Tag genau fünf Jahre her. Seitdem bewertet sich das Unternehmen selbst.\n\n### Einfache Sprache, der eigentliche Anlass\n\nDieselbe Erklärung enthält den Satz, der mich auf dieses Projekt gebracht hat. Die wichtigsten Informationen zu Betrieb und Kursgeschäft, heißt es dort, seien in einfacher Sprache verfügbar. Das Unternehmen hat die Frage nach der Verständlichkeit also längst gestellt und für einen Bereich beantwortet. Nur für die Kursbeschreibungen selbst, den mit Abstand größten Textbestand, gilt das nicht.\n\n### Der Kasten unten\n\nDa setze ich an. Unten steht die Frage, um die es geht: Mehr als jeder zweite Text hat einen Befund. Für wen ist er eigentlich zu schwer?"}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "html": "<p>Daraus folgt mein Vorschlag.</p><h3>Ziel</h3><p>Das Ziel oben ist von den Lesenden her formuliert. Wer einen Kurs sucht, soll die Beschreibung verstehen, ob er sie liest oder vorgelesen bekommt. Die Betriebssatzung sagt, die Angebote stehen allen offen — dann muss das auch für die Texte gelten, mit denen wir sie ankündigen.</p><p>Geprüft wird zweierlei: ob die Zielgruppe den Text versteht, und ob ein Vorleseprogramm etwas damit anfangen kann.</p><h3>Lösung</h3><p>Dafür genügt ein System-Prompt in dem KI-Rahmen, den der Volkshochschul- Verband ohnehin für alle Volkshochschulen bereitstellt. Es muss nichts beschafft werden.</p><h3>Abgrenzung</h3><p>Die Abgrenzung darunter zieht sich durch das ganze Konzept: Für die technische Barrierefreiheit der Website bleibt ein normales Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.</p><h3>Der Kasten unten</h3><p>Unten steht der erste Schritt: ein Pilot in einem Programmbereich, drei Monate. Der Prompt schlägt vor, der Mensch entscheidet.</p>", "roh": "Daraus folgt mein Vorschlag.\n\n### Ziel\n\nDas Ziel oben ist von den Lesenden her formuliert. Wer einen Kurs sucht, soll die Beschreibung verstehen, ob er sie liest oder vorgelesen bekommt. Die Betriebssatzung sagt, die Angebote stehen allen offen — dann muss das auch für die Texte gelten, mit denen wir sie ankündigen.\n\nGeprüft wird zweierlei: ob die Zielgruppe den Text versteht, und ob ein Vorleseprogramm etwas damit anfangen kann.\n\n### Lösung\n\nDafür genügt ein System-Prompt in dem KI-Rahmen, den der Volkshochschul- Verband ohnehin für alle Volkshochschulen bereitstellt. Es muss nichts beschafft werden.\n\n### Abgrenzung\n\nDie Abgrenzung darunter zieht sich durch das ganze Konzept: Für die technische Barrierefreiheit der Website bleibt ein normales Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.\n\n### Der Kasten unten\n\nUnten steht der erste Schritt: ein Pilot in einem Programmbereich, drei Monate. Der Prompt schlägt vor, der Mensch entscheidet."}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "html": "<p>Das Unternehmen und der Prozess.</p><h3>Linke Spalte: Das Unternehmen</h3><p>Die Volkshochschule Frankfurt ist kein Amt, sondern ein Eigenbetrieb der Stadt. Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist. Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat. Diese zwei Sitze spielen später noch eine Rolle.</p><p>Am Ende der ersten Zeile steht die Qualitätstestierung. Das Unternehmen ist seit zweitausendfünf nach L Q W testiert, Lernerorientierte Qualitätstestierung in der Weiterbildung, ein Verfahren mit regelmäßiger externer Prüfung, inzwischen in der sechsten Runde. Hier fehlt also keine Qualitätskultur. Es fehlt genau ein Schritt darin.</p><h3>Der Satz oben aus der Betriebssatzung</h3><p>Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung. Daran messe ich das Unternehmen — nicht am Gesetz, sondern an seinem eigenen Anspruch.</p><h3>Rechte Spalte: So entsteht ein Kurstext</h3><p>Rechts steht, wie ein Kurstext entsteht. Geplant wird halbjährlich, von den Teams der vier Fachbereiche. Der Text wird geschrieben und ins Kursverwaltungssystem eingepflegt, und dann erscheint er. Über der Spalte steht das Wort angenommen, denn wer bei der vhs Frankfurt die Texte schreibt, ist nicht öffentlich dokumentiert.</p><h3>Der Kasten unten</h3><p>Zwischen dem Einpflegen und dem Erscheinen ist kein Prüfschritt auf Verständlichkeit vorgesehen. Das ist kein Vorwurf, denn dieser Arbeitsschritt ist nirgends vorgesehen. Genau deshalb ist es ein Fall für Prozessgestaltung und nicht für einen Appell, sich mehr Mühe zu geben.</p><p>Für das gedruckte Programmheft gibt es sehr wohl eine Redaktion, das Impressum nennt sie mit Namen. Für das Portal gibt es sie nicht, und dort stehen die Texte, um die es hier geht.</p><p>Ich habe nachgezählt: Vierundfünfzig Prozent aller Kurse teilen sich ihren Text mit mindestens einem anderen. Ein schlecht formulierter Text ist hier nie ein Einzelfall.</p>", "roh": "Das Unternehmen und der Prozess.\n\n### Linke Spalte: Das Unternehmen\n\nDie Volkshochschule Frankfurt ist kein Amt, sondern ein Eigenbetrieb der Stadt. Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist. Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat. Diese zwei Sitze spielen später noch eine Rolle.\n\nAm Ende der ersten Zeile steht die Qualitätstestierung. Das Unternehmen ist seit zweitausendfünf nach L Q W testiert, Lernerorientierte Qualitätstestierung in der Weiterbildung, ein Verfahren mit regelmäßiger externer Prüfung, inzwischen in der sechsten Runde. Hier fehlt also keine Qualitätskultur. Es fehlt genau ein Schritt darin.\n\n### Der Satz oben aus der Betriebssatzung\n\nDer Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung. Daran messe ich das Unternehmen — nicht am Gesetz, sondern an seinem eigenen Anspruch.\n\n### Rechte Spalte: So entsteht ein Kurstext\n\nRechts steht, wie ein Kurstext entsteht. Geplant wird halbjährlich, von den Teams der vier Fachbereiche. Der Text wird geschrieben und ins Kursverwaltungssystem eingepflegt, und dann erscheint er. Über der Spalte steht das Wort angenommen, denn wer bei der vhs Frankfurt die Texte schreibt, ist nicht öffentlich dokumentiert.\n\n### Der Kasten unten\n\nZwischen dem Einpflegen und dem Erscheinen ist kein Prüfschritt auf Verständlichkeit vorgesehen. Das ist kein Vorwurf, denn dieser Arbeitsschritt ist nirgends vorgesehen. Genau deshalb ist es ein Fall für Prozessgestaltung und nicht für einen Appell, sich mehr Mühe zu geben.\n\nFür das gedruckte Programmheft gibt es sehr wohl eine Redaktion, das Impressum nennt sie mit Namen. Für das Portal gibt es sie nicht, und dort stehen die Texte, um die es hier geht.\n\nIch habe nachgezählt: Vierundfünfzig Prozent aller Kurse teilen sich ihren Text mit mindestens einem anderen. Ein schlecht formulierter Text ist hier nie ein Einzelfall."}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "html": "<p>Zur Potenzialermittlung. Hier habe ich nicht geschätzt, sondern gemessen.</p><h3>Die Messung</h3><p>Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen, gut dreitausend, und mit einem eigenen Skript ausgewertet. Siebenundfünfzig Prozent haben mindestens einen Befund.</p><h3>Wonach gemessen wurde</h3><p>Oben steht, wonach ich gemessen habe: sechs Regeln, erst der Maßstab, dann das Ergebnis. Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.</p><h3>Links: die zwei Pflichtregeln</h3><p>Links stehen die beiden Pflichtregeln. Sie stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit verbindlich.</p><p>Struktur heißt: Eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext. Dasselbe gilt für Aufzählungen, die jemand nur mit Bindestrichen gebaut hat. Wer sehend liest, merkt davon nichts. Ein Screenreader dagegen bietet an, sich alle Überschriften einer Seite vorlesen zu lassen, um gezielt dorthin zu springen — was technisch keine Überschrift ist, taucht in dieser Liste nicht auf. Die Gliederung ist dann sichtbar vorhanden und für das Vorleseprogramm nicht da.</p><p>Linktext heißt: Der Link sagt nicht, wohin er führt. Das bekannteste Beispiel ist ein Link, der schlicht „hier“ heißt. Der Grund ist derselbe: Screenreader lesen auf Wunsch nur die Links einer Seite vor, ohne den Text drumherum. Eine Liste aus fünfmal „hier“ hilft niemandem weiter.</p><h3>Rechts: die vier Empfehlungen</h3><p>Rechts stehen die vier Empfehlungen. Verbindlich sind sie nicht, aber sie sind der eigentliche Ertrag dieses Projekts. Zwei davon, zu schwere Wörter und nicht aufgelöste Abkürzungen, stehen auf Stufe AAA — der höchsten, die niemand einhalten muss. Die beiden anderen habe ich selbst gesetzt.</p><p>Niveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.</p><p>Amtsdeutsch heißt: Im Text steht ein Verwaltungswort, obwohl ein alltägliches genügen würde. Umbuchung statt Wechsel, gegebenenfalls statt wenn nötig. Das trifft nicht nur Sprachanfänger, sondern auch geübte Leserinnen und Leser.</p><p>Satz heißt: über fünfundzwanzig Wörter, bei Deutschkursen über fünfzehn. Diese beiden Zahlen habe ich gesetzt, nicht gemessen; sie orientieren sich an den Empfehlungen für einfache Sprache. Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nämlich nichts, und ob es die richtigen Zahlen sind, soll der Pilot beantworten.</p><p>Abkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.</p><h3>Zwei Kurse im Vergleich</h3><p>Die Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.</p><p>Beim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.</p><p>Der Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.</p><p>Dabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.</p><h3>Der Kasten unten</h3><p>Deshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.</p><h3>Nachtrag: warum 57 Prozent eine Untergrenze sind</h3><p>Noch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch.</p>", "roh": "Zur Potenzialermittlung. Hier habe ich nicht geschätzt, sondern gemessen.\n\n### Die Messung\n\nDas Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen, gut dreitausend, und mit einem eigenen Skript ausgewertet. Siebenundfünfzig Prozent haben mindestens einen Befund.\n\n### Wonach gemessen wurde\n\nOben steht, wonach ich gemessen habe: sechs Regeln, erst der Maßstab, dann das Ergebnis. Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.\n\n### Links: die zwei Pflichtregeln\n\nLinks stehen die beiden Pflichtregeln. Sie stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit verbindlich.\n\nStruktur heißt: Eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext. Dasselbe gilt für Aufzählungen, die jemand nur mit Bindestrichen gebaut hat. Wer sehend liest, merkt davon nichts. Ein Screenreader dagegen bietet an, sich alle Überschriften einer Seite vorlesen zu lassen, um gezielt dorthin zu springen — was technisch keine Überschrift ist, taucht in dieser Liste nicht auf. Die Gliederung ist dann sichtbar vorhanden und für das Vorleseprogramm nicht da.\n\nLinktext heißt: Der Link sagt nicht, wohin er führt. Das bekannteste Beispiel ist ein Link, der schlicht „hier“ heißt. Der Grund ist derselbe: Screenreader lesen auf Wunsch nur die Links einer Seite vor, ohne den Text drumherum. Eine Liste aus fünfmal „hier“ hilft niemandem weiter.\n\n### Rechts: die vier Empfehlungen\n\nRechts stehen die vier Empfehlungen. Verbindlich sind sie nicht, aber sie sind der eigentliche Ertrag dieses Projekts. Zwei davon, zu schwere Wörter und nicht aufgelöste Abkürzungen, stehen auf Stufe AAA — der höchsten, die niemand einhalten muss. Die beiden anderen habe ich selbst gesetzt.\n\nNiveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.\n\nAmtsdeutsch heißt: Im Text steht ein Verwaltungswort, obwohl ein alltägliches genügen würde. Umbuchung statt Wechsel, gegebenenfalls statt wenn nötig. Das trifft nicht nur Sprachanfänger, sondern auch geübte Leserinnen und Leser.\n\nSatz heißt: über fünfundzwanzig Wörter, bei Deutschkursen über fünfzehn. Diese beiden Zahlen habe ich gesetzt, nicht gemessen; sie orientieren sich an den Empfehlungen für einfache Sprache. Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nämlich nichts, und ob es die richtigen Zahlen sind, soll der Pilot beantworten.\n\nAbkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.\n\n### Zwei Kurse im Vergleich\n\nDie Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.\n\nBeim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.\n\nDer Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.\n\nDabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.\n\n### Der Kasten unten\n\nDeshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.\n\n### Nachtrag: warum 57 Prozent eine Untergrenze sind\n\nNoch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch."}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "html": "<p>Kurz die Rechtslage.</p><h3>Was Barrierefreiheit heißt</h3><p>Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.</p><h3>Welches Recht gilt</h3><p>Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.</p><h3>Der Block in der Mitte: Pflicht und freiwillig</h3><p>Der Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — genau die beiden Kriterien also, um die es in diesem Projekt geht.</p><h3>Der Kasten unten</h3><p>Ich könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.</p><p>Freiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.</p><p>Den eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind.</p>", "roh": "Kurz die Rechtslage.\n\n### Was Barrierefreiheit heißt\n\nDigitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.\n\n### Welches Recht gilt\n\nFür die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.\n\n### Der Block in der Mitte: Pflicht und freiwillig\n\nDer Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — genau die beiden Kriterien also, um die es in diesem Projekt geht.\n\n### Der Kasten unten\n\nIch könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.\n\nFreiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.\n\nDen eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind."}, {"nr": 7, "titel": "Was die Technik prüft, und was nur ein Mensch sieht.", "bild": "folie-07.png", "html": "<p>Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.</p><h3>Linke Spalte: Das Seitengerüst</h3><p>Links steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.</p><h3>Rechte Spalte: Der einzelne Text</h3><p>Rechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.</p><h3>Der Kasten unten: wo die Trennlinie verläuft</h3><p>Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.</p><p>Diese Trennung hat sich beim Bauen zweimal selbst bestätigt. Zwei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Beide stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.</p><h3>Technische Voraussetzungen</h3><p>Technisch braucht es den KI-Rahmen, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort hinterlegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem.</p>", "roh": "Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.\n\n### Linke Spalte: Das Seitengerüst\n\nLinks steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.\n\n### Rechte Spalte: Der einzelne Text\n\nRechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.\n\n### Der Kasten unten: wo die Trennlinie verläuft\n\nDie Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.\n\nDiese Trennung hat sich beim Bauen zweimal selbst bestätigt. Zwei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Beide stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.\n\n### Technische Voraussetzungen\n\nTechnisch braucht es den KI-Rahmen, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort hinterlegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem."}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "html": "<p>Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.</p><h3>Rolle, Aufgabe, Format</h3><p>Die ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.</p><h3>Kontext: die Wortliste</h3><p>Der KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.</p><p>Das ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.</p><h3>Der Kasten unten: die Zeile Grenzen</h3><p>In der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn Anhang III setzt überall eine Bewertung natürlicher Personen voraus. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird.</p>", "roh": "Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.\n\n### Rolle, Aufgabe, Format\n\nDie ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.\n\n### Kontext: die Wortliste\n\nDer KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.\n\nDas ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.\n\n### Der Kasten unten: die Zeile Grenzen\n\nIn der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn Anhang III setzt überall eine Bewertung natürlicher Personen voraus. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird."}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "html": "<p>Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.</p><h3>Weg 1: Als KI-Assistent bei fobizz</h3><p>Der erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.</p><h3>Die Einschränkung zu Weg 1</h3><p>Eine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.</p><h3>Weg 2: Als eigenes Prüfwerkzeug</h3><p>Der zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.</p><h3>Rechts im Bild: ein Befund</h3><p>Rechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.</p><h3>Hier die Vorführung</h3><p>Ich zeige euch das kurz live, an genau diesem Kurs.</p><p>Das ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.</p><h3>Der Kasten unten</h3><p>Die Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt.</p>", "roh": "Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.\n\n### Weg 1: Als KI-Assistent bei fobizz\n\nDer erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.\n\n### Die Einschränkung zu Weg 1\n\nEine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.\n\n### Weg 2: Als eigenes Prüfwerkzeug\n\nDer zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.\n\n### Rechts im Bild: ein Befund\n\nRechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.\n\n### Hier die Vorführung\n\nIch zeige euch das kurz live, an genau diesem Kurs.\n\nDas ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.\n\n### Der Kasten unten\n\nDie Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt."}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "html": "<p>Damit zum Change-Teil, und der beginnt mit den <strong>Stakeholdern</strong>. Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.</p><h3>Oben rechts: Eng einbinden</h3><p>Wer entscheidet oder zustimmen muss.</p><p><strong>Der Direktor</strong> — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.</p><p><strong>Der Fachbereich des Pilotbereichs</strong> — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.</p><p><strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.</p><p><strong>Der Personalrat</strong> — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein <strong>sperrender</strong>: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.</p><h3>Unten links: Informieren</h3><p>Nur dieser eine Fachbereich ist im Pilot — die anderen erfahren davon.</p><p><strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.</p><h3>Oben links: Beobachten</h3><p>Hoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.</p><p><strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.</p><p><strong>Advellence</strong> — die Schweizer Firma, die laut Impressum das Portal programmiert.</p><p><strong>Die Betriebskommission</strong> — Aufsichtsgremium.</p><p><strong>Der Volkshochschul-Verband</strong> — stellt den KI-Rahmen, den ich nutze.</p><h3>Unten rechts: Konsultieren</h3><p>Der Quadrant, der mich am meisten beschäftigt hat.</p><p><strong>Die Kursleitungen auf Honorarbasis</strong> — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.</p><p><strong>Die Teilnehmenden</strong> — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.</p><p>Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie.</p>", "roh": "Damit zum Change-Teil, und der beginnt mit den **Stakeholdern**. Die **Einfluss-Betroffenheits-Matrix** sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.\n\n### Oben rechts: Eng einbinden\n\nWer entscheidet oder zustimmen muss.\n\n**Der Direktor** — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.\n\n**Der Fachbereich des Pilotbereichs** — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.\n\n**Die Redaktion des Programmhefts** — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.\n\n**Der Personalrat** — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein **sperrender**: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.\n\n### Unten links: Informieren\n\nNur dieser eine Fachbereich ist im Pilot — die anderen erfahren davon.\n\n**Die drei übrigen Fachbereiche** — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.\n\n### Oben links: Beobachten\n\nHoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.\n\n**Die städtische IT** — bleibt für die technische Seite zuständig.\n\n**Advellence** — die Schweizer Firma, die laut Impressum das Portal programmiert.\n\n**Die Betriebskommission** — Aufsichtsgremium.\n\n**Der Volkshochschul-Verband** — stellt den KI-Rahmen, den ich nutze.\n\n### Unten rechts: Konsultieren\n\nDer Quadrant, der mich am meisten beschäftigt hat.\n\n**Die Kursleitungen auf Honorarbasis** — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.\n\n**Die Teilnehmenden** — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.\n\nBei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie."}, {"nr": 11, "titel": "Vier Widerstände, und vier Antworten.", "bild": "folie-11.png", "html": "<p>Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.</p><h3>Unsicherheit · im ganzen Haus</h3><p>Die Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.</p><h3>Verlustangst · Fachbereich</h3><p>Der einzige Einwand, der noch offen ist. Eine Kursbeschreibung ist selten von einer Hand: Der Anmeldehinweis, die Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht in dem Bereich gepflegt, der den Kurs anbietet. Wer die Befunde bekommt, darf den Text also oft gar nicht ändern. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.</p><h3>Fehlende Perspektive · Kursleitung</h3><p>Bei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor. Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.</p><h3>Gewohnheit · Redaktion des Programmhefts</h3><p>Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Er stimmt vermutlich sogar — nur beweist er das Gegenteil. Wer sich beschwert, hat den Text gelesen und verstanden. Die Menschen, um die es hier geht, melden sich nicht: Sie verstehen die Beschreibung nicht, sie fragen nicht nach, und sie melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. Und geprüft wird ohnehin der Text im Portal, und dort gibt es keine Seitenzahl.</p><h3>Der Kasten unten</h3><p>Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird.</p>", "roh": "Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.\n\n### Unsicherheit · im ganzen Haus\n\nDie Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.\n\n### Verlustangst · Fachbereich\n\nDer einzige Einwand, der noch offen ist. Eine Kursbeschreibung ist selten von einer Hand: Der Anmeldehinweis, die Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht in dem Bereich gepflegt, der den Kurs anbietet. Wer die Befunde bekommt, darf den Text also oft gar nicht ändern. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.\n\n### Fehlende Perspektive · Kursleitung\n\nBei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor. Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.\n\n### Gewohnheit · Redaktion des Programmhefts\n\nDer Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Er stimmt vermutlich sogar — nur beweist er das Gegenteil. Wer sich beschwert, hat den Text gelesen und verstanden. Die Menschen, um die es hier geht, melden sich nicht: Sie verstehen die Beschreibung nicht, sie fragen nicht nach, und sie melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. Und geprüft wird ohnehin der Text im Portal, und dort gibt es keine Seitenzahl.\n\n### Der Kasten unten\n\nBetroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird."}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "html": "<p>Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.</p><h3>Monat 2, Strang Kommunikation: Training</h3><p>Erstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.</p><h3>Strang Change: erst fragen, dann handeln</h3><p>Und zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat.</p>", "roh": "Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.\n\n### Monat 2, Strang Kommunikation: Training\n\nErstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.\n\n### Strang Change: erst fragen, dann handeln\n\nUnd zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat."}, {"nr": 13, "titel": "Die ersten 30 Tage.", "bild": "folie-13.png", "html": "<p>Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.</p><h3>Die vier Schritte</h3><p>Die Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Rahmen ist da.</p><h3>Der Kasten unten: der dritte Schritt</h3><p>Der dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt.</p>", "roh": "Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.\n\n### Die vier Schritte\nDie Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Rahmen ist da.\n\n### Der Kasten unten: der dritte Schritt\n\nDer dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt."}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "html": "<p>Und woran würde man merken, ob es gewirkt hat?</p><h3>Die ersten drei Kennzahlen</h3><p>Vier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.</p><h3>Die vierte Kennzahl: die Befragung</h3><p>Die vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.</p><p>Diese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.</p><h3>Letzte Spalte: womit gemessen wird</h3><p>In der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und das Skript ist dafür eingefroren. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.</p><h3>Das Risiko unten</h3><p>Das Risiko steckt in den Kennzahlen selbst. Die ersten drei lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Befundquote — ob der Text dadurch verständlicher geworden ist, hat dann noch niemand gefragt. Ein kürzerer Satz ist nicht automatisch ein verständlicherer.</p><p>Genau dagegen steht die vierte Kennzahl. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist. Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab.</p>", "roh": "Und woran würde man merken, ob es gewirkt hat?\n\n### Die ersten drei Kennzahlen\n\nVier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.\n\n### Die vierte Kennzahl: die Befragung\n\nDie vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.\n\nDiese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.\n\n### Letzte Spalte: womit gemessen wird\n\nIn der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und das Skript ist dafür eingefroren. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.\n\n### Das Risiko unten\n\nDas Risiko steckt in den Kennzahlen selbst. Die ersten drei lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Befundquote — ob der Text dadurch verständlicher geworden ist, hat dann noch niemand gefragt. Ein kürzerer Satz ist nicht automatisch ein verständlicherer.\n\nGenau dagegen steht die vierte Kennzahl. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist. Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab."}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "html": "<h3>Was diese Arbeit ist</h3><p>Ich habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.</p><h3>Meine Lehre aus dem Projekt</h3><p>Der System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.</p><h3>Der Link auf der Folie</h3><p>Danke für die Aufmerksamkeit. Die Adresse steht oben, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen.</p>", "roh": "### Was diese Arbeit ist\n\nIch habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.\n\n### Meine Lehre aus dem Projekt\n\nDer System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.\n\n### Der Link auf der Folie\n\nDanke für die Aufmerksamkeit. Die Adresse steht oben, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen."}];

<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
// Untergrenze der Halbierungssuche, in px. Auf dem Zielgeraet (1080x1920)
// kommt keine Folie ihr nahe — die laengste Notiz, Folie 5 mit 612 Woertern,
// passt bei 21px. Die Grenze greift erst in kleinen Fenstern; dort rollt die
// Folie dann lieber, statt unleserlich zu werden.
const MIN = 18;
const MAX = 64;          // Obergrenze
const SPEICHER = 'klartext-notizen-nachstellung';

// Nachstellung des Referenten, in Prozent. + und - verschieben sie, der
// Wert ueberlebt einen Neustart des Browsers.
let nachstellung = 100;
try { nachstellung = parseInt(localStorage.getItem(SPEICHER), 10) || 100; }
catch (e) {}

const eSeite  = document.querySelector('.seite');
const eNr     = document.getElementById('nr');
const eTitel  = document.getElementById('titel');
const eNotiz  = document.getElementById('notiz');
const eQuelle = document.getElementById('quelle');
const eFuss   = document.getElementById('fusstext');
const eStift  = document.getElementById('stift');

let letzteGroesse = 0;   // fuer die Messseite

// Groesste Schriftgroesse suchen, bei der der Text noch in den Kasten
// passt. Halbierungssuche in ganzen Pixeln: rund sieben Durchlaeufe, das
// merkt niemand. Gemessen wird scrollHeight gegen clientHeight — genau der
// Wert, der auch entscheidet, ob abgeschnitten wuerde.
// --gr sitzt auf .seite, nicht auf #notiz: Anzeige und Textfeld erben
// dieselbe Groesse, damit der Text beim Umschalten nicht springt.
function passtBei(px){
  eSeite.style.setProperty('--gr', px + 'px');
  return eNotiz.scrollHeight <= eNotiz.clientHeight;
}

function sucheGroesse(){
  if (passtBei(MAX)) return MAX;
  let lo = MIN, hi = MAX, best = 0;
  while (lo <= hi) {
    const mitte = (lo + hi) >> 1;
    if (passtBei(mitte)) { best = mitte; lo = mitte + 1; }
    else { hi = mitte - 1; }
  }
  return best || MIN;      // 0 heisst: passt selbst bei MIN nicht
}

function einpassen(){
  // Beim Bearbeiten bleibt die Groesse stehen, die beim Oeffnen gefunden
  // wurde. Sonst springt der ganze Text bei jedem getippten Wort um eine
  // Stufe, sobald er die Kastenhoehe kreuzt.
  if (editorAktiv()) return;
  eNotiz.classList.remove('rollt');
  const basis = sucheGroesse();

  // Die Nachstellung wirkt auf das gefundene Mass. Ohne sie fuellt der Text
  // den Kasten genau aus, und + und - haetten fast nie eine Wirkung — die
  // Groesse haengt ja am Platz, nicht am Geschmack. Stellt der Referent
  // groesser, als es passt, rollt die Folie. Das ist gewollt: lieber rollen
  // als abschneiden, denn ein abgeschnittener Satz faellt auf der Buehne
  // nicht auf.
  const px = Math.min(128, Math.max(10, Math.round(basis * nachstellung / 100)));
  if (!passtBei(px)) eNotiz.classList.add('rollt');
  letzteGroesse = px;
}

function zeige(i){
  const f = FOLIEN[i];
  eNr.textContent = String(f.nr).padStart(2, '0');
  eTitel.textContent = f.titel;
  eNotiz.innerHTML = f.html;
  eNotiz.scrollTop = 0;
  fussSetzen();
  einpassen();
  document.title = 'Notizen ' + String(f.nr).padStart(2, '0');
}

function groesser(richtung){
  nachstellung = Math.min(200, Math.max(50, nachstellung + richtung * 5));
  try { localStorage.setItem(SPEICHER, String(nachstellung)); } catch (e) {}
  einpassen();
}

// Nach einer Groessenaenderung erst messen, wenn der Umbruch steht.
//
// einpassen() sucht die Groesse ueber eine Halbierungssuche und misst dabei
// mehrfach die Hoehe des Textes. Wer ein Fenster am Rand zieht, loest
// Dutzende resize-Ereignisse aus; ohne Zusammenfassung liefe die Suche
// jedes Mal komplett durch. Ein Takt Verzoegerung plus Bildrahmen fasst sie
// zusammen und stellt zugleich sicher, dass gegen den neuen und nicht gegen
// den alten Kasten gemessen wird.
let nachlauf = 0;
function einpassenSpaeter(){
  clearTimeout(nachlauf);
  nachlauf = setTimeout(() => requestAnimationFrame(einpassen), 60);
}
addEventListener('resize', einpassenSpaeter);
// Beim Wechsel ins Vollbild aendert sich die Fensterhoehe; das Ereignis kommt
// je nach Browser vor oder nach dem Neuaufbau. Der Beobachter greift in
// beiden Faellen, auch wenn resize einmal ausbleibt.
addEventListener('fullscreenchange', einpassenSpaeter);
if (window.ResizeObserver) new ResizeObserver(einpassenSpaeter).observe(document.documentElement);
document.fonts.ready.then(einpassen);

// Haken fuer die Ueberlaufmessung. Die Messseite laedt diese Datei in einen
// iframe, springt jede Folie an und liest hier ab.
// Unterkante des Textes im Kasten. scrollHeight taugt dafuer nicht: er ist
// nie kleiner als clientHeight und meldet deshalb immer 0 Rest.
function unterkante(){
  const oben = eNotiz.getBoundingClientRect().top;
  let tief = 0;
  for (const p of eNotiz.children) {
    const u = p.getBoundingClientRect().bottom - oben + eNotiz.scrollTop;
    if (u > tief) tief = u;
  }
  return Math.round(tief);
}

window.klartext = {
  gehe: i => gehe(i, false),
  anzahl: () => FOLIEN.length,
  messung: () => ({
    folie: folie + 1,
    groesse: letzteGroesse,
    inhalt: unterkante(),
    kasten: eNotiz.clientHeight,
    rest: eNotiz.clientHeight - unterkante(),
    rollt: eNotiz.classList.contains('rollt'),
    fett: eNotiz.querySelectorAll('strong').length,
    absaetze: eNotiz.querySelectorAll('p').length
  })
};

// ---------- Notiz bearbeiten ----------
//
// Bearbeitet wird der rohe Markdown-Text in einem Textfeld, nicht die
// gesetzte Anzeige. Das ist die kuerzere und die ehrlichere Loesung: Was im
// Feld steht, geht Zeichen fuer Zeichen in folien.md — es gibt keinen
// Ruecklese-Schritt, der etwas anders verstehen koennte, als es aussieht.
// **fett** tippt man selbst, ohne Tastengriff und ohne execCommand.
//
// Geschrieben wird ueber POST /notiz, dafuer braucht es einen Server, der das
// annimmt. python3 -m http.server kann es nicht; ob dieser es kann, wird
// einmal beim Aufbau gefragt.

let bearbeitet = false;   // Editiermodus an
let schmutzig  = false;   // ungespeicherte Aenderung im Feld
let schreibbar = false;   // Server nimmt POST /notiz an
let meldung    = '';      // Statuszeile, verdraengt den Fusstext
let meldeUhr   = 0;

const FUSS_RUHE = eFuss.textContent;

function imEditor(){ return bearbeitet; }

function fussSetzen(){
  if (meldung) { eFuss.textContent = meldung; eFuss.hidden = false; return; }
  if (bearbeitet) {
    eFuss.textContent = schmutzig
      ? 'Bearbeiten — noch nicht gespeichert. Markdown: **fett**, *kursiv*, ### Überschrift, - Liste, > Zitat. \u2318S speichert, Esc speichert und schließt.'
      : 'Bearbeiten — gespeichert. Markdown: **fett**, *kursiv*, ### Überschrift, - Liste, > Zitat. Esc schließt.';
    eFuss.hidden = false;
    return;
  }
  eFuss.textContent = FUSS_RUHE;
  eFuss.hidden = geblaettert;
}

function melde(text, dauer){
  clearTimeout(meldeUhr);
  meldung = text || '';
  fussSetzen();
  if (meldung && dauer) {
    meldeUhr = setTimeout(() => { meldung = ''; fussSetzen(); }, dauer);
  }
}

// ---------- Oeffnen, speichern, schliessen ----------

function editorOeffnen(){
  if (bearbeitet) return;
  if (!schreibbar) {
    melde('Bearbeiten braucht den schreibenden Server: python3 notizen.py --server', 8000);
    return;
  }
  bearbeitet = true;
  schmutzig = false;
  eQuelle.value = FOLIEN[folie].roh;
  eSeite.classList.add('bearbeitet');
  eQuelle.focus();
  eQuelle.setSelectionRange(0, 0);
  eQuelle.scrollTop = 0;
  melde('');
}

async function speichern(){
  const text = eQuelle.value;
  if (!text.trim()) { melde('Die Notiz ist leer — nicht gespeichert.', 8000); return false; }
  melde('Speichere …');
  let d;
  try {
    const a = await fetch('/notiz', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nr: FOLIEN[folie].nr, text: text})
    });
    d = await a.json();
  } catch (e) {
    melde('Server nicht erreichbar. Es wurde nichts gespeichert.', 10000);
    return false;
  }
  if (!d.ok) { melde('Nicht gespeichert: ' + d.fehler, 10000); return false; }
  // Der Server antwortet mit dem, was beim naechsten Start aus der Datei
  // gelesen wuerde. Das Feld uebernimmt es — steht dort etwas anderes als
  // getippt, sieht man es sofort statt erst nach einem Neustart.
  FOLIEN[folie].html = d.html;
  FOLIEN[folie].roh  = d.roh;
  const p = eQuelle.selectionStart;
  eQuelle.value = d.roh;
  eQuelle.setSelectionRange(Math.min(p, d.roh.length), Math.min(p, d.roh.length));
  schmutzig = false;
  melde('In folien.md gespeichert.', 4000);
  return true;
}

async function editorSchliessen(){
  if (!bearbeitet) return;
  if (schmutzig && !(await speichern())) return;   // Fehler: offen lassen
  bearbeitet = false;
  eSeite.classList.remove('bearbeitet');
  const f = FOLIEN[folie];
  eNotiz.innerHTML = f.html;
  eNotiz.scrollTop = 0;
  einpassen();
  fussSetzen();
}

// ---------- Bedienung ----------

// Laeuft nach dem Handler in JS_GEMEINSAM, der bei offenem Editor sofort
// aussteigt. Diese beiden Griffe sind die einzigen, die dann noch gelten;
// alles uebrige gehoert dem Textfeld.
document.addEventListener('keydown', ev => {
  if (!bearbeitet) return;
  const cmd = ev.metaKey || ev.ctrlKey;
  if (ev.key === 'Escape') { ev.preventDefault(); editorSchliessen(); }
  else if (cmd && (ev.key === 's' || ev.key === 'S')) { ev.preventDefault(); speichern(); }
});

eQuelle.addEventListener('input', () => {
  if (!bearbeitet || schmutzig) return;
  schmutzig = true;
  fussSetzen();
});

// stopPropagation, sonst blaettert der Klick auf den Stift die Seite weiter —
// der Handler in JS_GEMEINSAM sieht jeden Klick auf dem Dokument.
eStift.addEventListener('click', ev => {
  ev.stopPropagation();
  if (bearbeitet) editorSchliessen(); else editorOeffnen();
});

addEventListener('beforeunload', ev => {
  if (!schmutzig) return;
  ev.preventDefault();
  ev.returnValue = '';
});

// Einmal fragen, ob der Server schreiben kann. Bei python3 -m http.server
// gibt es /notiz nicht; dann bleibt der Stift verborgen und die Taste E
// meldet den Grund beim Druecken.
fetch('/notiz')
  .then(a => a.ok ? a.json() : null)
  .then(d => { schreibbar = !!(d && d.schreibbar); eStift.hidden = !schreibbar; })
  .catch(() => {});

gehe(ausAdresse(), false);
</script>
</body>
</html>
