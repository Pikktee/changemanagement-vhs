<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "html": "<p>Ich stelle euch heute mein Abschlussprojekt vor: KLARTEXT, ein Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.</p><p>Es geht um Barrierefreiheit. Die meisten denken dabei an Technik: Kontraste, Tastaturbedienung, Vorleseprogramme. Mich interessiert der andere Teil — ob der Text ankommt bei denen, für die er geschrieben ist. Das betrifft alle acht Programmbereiche.</p><p>Angefangen hat es mit dem schärfsten Fall. Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen, und die Beschreibungen dieser Kurse sind in einem Deutsch geschrieben, das man erst nach dem Kurs versteht. Wer Deutsch lernen will, muss also erst Deutsch können. Das ist der Extremfall, aber das Prinzip dahinter gilt überall.</p><p>Ich habe das Projekt allein bearbeitet, alle Rollen liegen also bei mir. Und alle Zahlen, die gleich kommen, habe ich selbst gemessen, an der echten Website, am achtundzwanzigsten Juli. Der Datensatz liegt der Arbeit bei.</p><p>Am Ende zeige ich das Werkzeug an einem echten Kurstext.</p>", "roh": "Ich stelle euch heute mein Abschlussprojekt vor: KLARTEXT, ein Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.\n\nEs geht um Barrierefreiheit. Die meisten denken dabei an Technik: Kontraste, Tastaturbedienung, Vorleseprogramme. Mich interessiert der andere Teil — ob der Text ankommt bei denen, für die er geschrieben ist. Das betrifft alle acht Programmbereiche.\n\nAngefangen hat es mit dem schärfsten Fall. Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen, und die Beschreibungen dieser Kurse sind in einem Deutsch geschrieben, das man erst nach dem Kurs versteht. Wer Deutsch lernen will, muss also erst Deutsch können. Das ist der Extremfall, aber das Prinzip dahinter gilt überall.\n\nIch habe das Projekt allein bearbeitet, alle Rollen liegen also bei mir. Und alle Zahlen, die gleich kommen, habe ich selbst gemessen, an der echten Website, am achtundzwanzigsten Juli. Der Datensatz liegt der Arbeit bei.\n\nAm Ende zeige ich das Werkzeug an einem echten Kurstext."}, {"nr": 2, "titel": "5.800 Texte im Jahr, geprüft wird die Technik.", "bild": "folie-02.png", "html": "<p>Drei Zahlen zum Einstieg.</p><p>Die Volkshochschule veröffentlicht rund fünftausendachthundert Kursbeschreibungen im Jahr. Von allen Texten, die heute im Portal stehen, haben siebenundfünfzig Prozent mindestens einen Befund, und das ist die Untergrenze: Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.</p><p>Die dritte Zahl stammt aus dem Unternehmen selbst. In der Erklärung zur Barrierefreiheit steht, wann die Website zuletzt extern geprüft wurde: am ersten Juli zweitausendeinundzwanzig, heute auf den Tag genau fünf Jahre her. Seitdem bewertet sich das Unternehmen selbst.</p><p>Dieselbe Erklärung enthält den Satz, der mich auf dieses Projekt gebracht hat. Die wichtigsten Informationen zu Betrieb und Kursgeschäft, heißt es dort, seien in einfacher Sprache verfügbar. Das Unternehmen hat die Frage nach der Verständlichkeit also längst gestellt und für einen Bereich beantwortet. Nur für die Kursbeschreibungen selbst, den mit Abstand größten Textbestand, gilt das nicht.</p><p>Da setze ich an. Unten steht die Frage, um die es geht: Mehr als jeder zweite Text hat einen Befund. Für wen ist er eigentlich zu schwer?</p>", "roh": "Drei Zahlen zum Einstieg.\n\nDie Volkshochschule veröffentlicht rund fünftausendachthundert Kursbeschreibungen im Jahr. Von allen Texten, die heute im Portal stehen, haben siebenundfünfzig Prozent mindestens einen Befund, und das ist die Untergrenze: Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.\n\nDie dritte Zahl stammt aus dem Unternehmen selbst. In der Erklärung zur Barrierefreiheit steht, wann die Website zuletzt extern geprüft wurde: am ersten Juli zweitausendeinundzwanzig, heute auf den Tag genau fünf Jahre her. Seitdem bewertet sich das Unternehmen selbst.\n\nDieselbe Erklärung enthält den Satz, der mich auf dieses Projekt gebracht hat. Die wichtigsten Informationen zu Betrieb und Kursgeschäft, heißt es dort, seien in einfacher Sprache verfügbar. Das Unternehmen hat die Frage nach der Verständlichkeit also längst gestellt und für einen Bereich beantwortet. Nur für die Kursbeschreibungen selbst, den mit Abstand größten Textbestand, gilt das nicht.\n\nDa setze ich an. Unten steht die Frage, um die es geht: Mehr als jeder zweite Text hat einen Befund. Für wen ist er eigentlich zu schwer?"}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "html": "<p>Daraus folgt mein Vorschlag.</p><p>Das Ziel oben ist von den Lesenden her formuliert. Wer einen Kurs sucht, soll die Beschreibung verstehen, ob er sie liest oder vorgelesen bekommt. Die Betriebssatzung sagt, die Angebote stehen allen offen — dann muss das auch für die Texte gelten, mit denen wir sie ankündigen.</p><p>Geprüft wird zweierlei: ob die Zielgruppe den Text versteht, und ob ein Vorleseprogramm etwas damit anfangen kann.</p><p>Dafür genügt ein System-Prompt in dem KI-Rahmen, den der Volkshochschul- Verband ohnehin für alle Volkshochschulen bereitstellt. Es muss nichts beschafft werden.</p><p>Die Abgrenzung darunter zieht sich durch das ganze Konzept: Für die technische Barrierefreiheit der Website bleibt ein normales Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.</p><p>Unten steht der erste Schritt: ein Pilot in einem Programmbereich, drei Monate. Der Prompt schlägt vor, der Mensch entscheidet.</p>", "roh": "Daraus folgt mein Vorschlag.\n\nDas Ziel oben ist von den Lesenden her formuliert. Wer einen Kurs sucht, soll die Beschreibung verstehen, ob er sie liest oder vorgelesen bekommt. Die Betriebssatzung sagt, die Angebote stehen allen offen — dann muss das auch für die Texte gelten, mit denen wir sie ankündigen.\n\nGeprüft wird zweierlei: ob die Zielgruppe den Text versteht, und ob ein Vorleseprogramm etwas damit anfangen kann.\n\nDafür genügt ein System-Prompt in dem KI-Rahmen, den der Volkshochschul- Verband ohnehin für alle Volkshochschulen bereitstellt. Es muss nichts beschafft werden.\n\nDie Abgrenzung darunter zieht sich durch das ganze Konzept: Für die technische Barrierefreiheit der Website bleibt ein normales Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.\n\nUnten steht der erste Schritt: ein Pilot in einem Programmbereich, drei Monate. Der Prompt schlägt vor, der Mensch entscheidet."}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "html": "<p>Das Unternehmen und der Prozess.</p><p>Die Volkshochschule Frankfurt ist kein Amt, sondern ein Eigenbetrieb der Stadt. Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist. Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat. Diese zwei Sitze spielen später noch eine Rolle.</p><p>Am Ende der ersten Zeile steht die Qualitätstestierung. Das Unternehmen ist seit zweitausendfünf nach L Q W testiert, Lernerorientierte Qualitätstestierung in der Weiterbildung, ein Verfahren mit regelmäßiger externer Prüfung, inzwischen in der sechsten Runde. Hier fehlt also keine Qualitätskultur. Es fehlt genau ein Schritt darin.</p><p>Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung. Daran messe ich das Unternehmen — nicht am Gesetz, sondern an seinem eigenen Anspruch.</p><p>Rechts steht, wie ein Kurstext entsteht. Geplant wird halbjährlich, von den Teams der vier Fachbereiche. Der Text wird geschrieben und ins Kursverwaltungssystem eingepflegt, und dann erscheint er. Über der Spalte steht das Wort angenommen, denn wer bei der vhs Frankfurt die Texte schreibt, ist nicht öffentlich dokumentiert.</p><p>Zwischen dem Einpflegen und dem Erscheinen ist kein Prüfschritt auf Verständlichkeit vorgesehen. Das ist kein Vorwurf, denn dieser Arbeitsschritt ist nirgends vorgesehen. Genau deshalb ist es ein Fall für Prozessgestaltung und nicht für einen Appell, sich mehr Mühe zu geben.</p><p>Für das gedruckte Programmheft gibt es sehr wohl eine Redaktion, das Impressum nennt sie mit Namen. Für das Portal gibt es sie nicht, und dort stehen die Texte, um die es hier geht.</p><p>Ich habe nachgezählt: Vierundfünfzig Prozent aller Kurse teilen sich ihren Text mit mindestens einem anderen. Ein schlecht formulierter Text ist hier nie ein Einzelfall.</p>", "roh": "Das Unternehmen und der Prozess.\n\nDie Volkshochschule Frankfurt ist kein Amt, sondern ein Eigenbetrieb der Stadt. Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist. Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat. Diese zwei Sitze spielen später noch eine Rolle.\n\nAm Ende der ersten Zeile steht die Qualitätstestierung. Das Unternehmen ist seit zweitausendfünf nach L Q W testiert, Lernerorientierte Qualitätstestierung in der Weiterbildung, ein Verfahren mit regelmäßiger externer Prüfung, inzwischen in der sechsten Runde. Hier fehlt also keine Qualitätskultur. Es fehlt genau ein Schritt darin.\n\nDer Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung. Daran messe ich das Unternehmen — nicht am Gesetz, sondern an seinem eigenen Anspruch.\n\nRechts steht, wie ein Kurstext entsteht. Geplant wird halbjährlich, von den Teams der vier Fachbereiche. Der Text wird geschrieben und ins Kursverwaltungssystem eingepflegt, und dann erscheint er. Über der Spalte steht das Wort angenommen, denn wer bei der vhs Frankfurt die Texte schreibt, ist nicht öffentlich dokumentiert.\n\nZwischen dem Einpflegen und dem Erscheinen ist kein Prüfschritt auf Verständlichkeit vorgesehen. Das ist kein Vorwurf, denn dieser Arbeitsschritt ist nirgends vorgesehen. Genau deshalb ist es ein Fall für Prozessgestaltung und nicht für einen Appell, sich mehr Mühe zu geben.\n\nFür das gedruckte Programmheft gibt es sehr wohl eine Redaktion, das Impressum nennt sie mit Namen. Für das Portal gibt es sie nicht, und dort stehen die Texte, um die es hier geht.\n\nIch habe nachgezählt: Vierundfünfzig Prozent aller Kurse teilen sich ihren Text mit mindestens einem anderen. Ein schlecht formulierter Text ist hier nie ein Einzelfall."}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "html": "<p>Zur Potenzialermittlung. Hier habe ich nicht geschätzt, sondern gemessen.</p><p>Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen, gut dreitausend, und mit einem eigenen Skript ausgewertet. Siebenundfünfzig Prozent haben mindestens einen Befund.</p><p>Oben steht, wonach ich gemessen habe: sechs Regeln, erst der Maßstab, dann das Ergebnis. Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.</p><p>Links stehen die beiden Pflichtregeln. Sie stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit verbindlich.</p><p>Struktur heißt: Eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext. Dasselbe gilt für Aufzählungen, die jemand nur mit Bindestrichen gebaut hat. Wer sehend liest, merkt davon nichts. Ein Screenreader dagegen bietet an, sich alle Überschriften einer Seite vorlesen zu lassen, um gezielt dorthin zu springen — was technisch keine Überschrift ist, taucht in dieser Liste nicht auf. Die Gliederung ist dann sichtbar vorhanden und für das Vorleseprogramm nicht da.</p><p>Linktext heißt: Der Link sagt nicht, wohin er führt. Das bekannteste Beispiel ist ein Link, der schlicht „hier“ heißt. Der Grund ist derselbe: Screenreader lesen auf Wunsch nur die Links einer Seite vor, ohne den Text drumherum. Eine Liste aus fünfmal „hier“ hilft niemandem weiter.</p><p>Rechts stehen die vier Empfehlungen. Verbindlich sind sie nicht, aber sie sind der eigentliche Ertrag dieses Projekts. Zwei davon, zu schwere Wörter und nicht aufgelöste Abkürzungen, stehen auf Stufe AAA — der höchsten, die niemand einhalten muss. Die beiden anderen habe ich selbst gesetzt.</p><p>Niveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.</p><p>Amtsdeutsch heißt: Im Text steht ein Verwaltungswort, obwohl ein alltägliches genügen würde. Umbuchung statt Wechsel, gegebenenfalls statt wenn nötig. Das trifft nicht nur Sprachanfänger, sondern auch geübte Leserinnen und Leser.</p><p>Satz heißt: über fünfundzwanzig Wörter, bei Deutschkursen über fünfzehn. Diese beiden Zahlen habe ich gesetzt, nicht gemessen; sie orientieren sich an den Empfehlungen für einfache Sprache. Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nämlich nichts, und ob es die richtigen Zahlen sind, soll der Pilot beantworten.</p><p>Abkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.</p><p>Die Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.</p><p>Beim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.</p><p>Der Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.</p><p>Dabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.</p><p>Deshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.</p><p>Noch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch.</p>", "roh": "Zur Potenzialermittlung. Hier habe ich nicht geschätzt, sondern gemessen.\n\nDas Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen, gut dreitausend, und mit einem eigenen Skript ausgewertet. Siebenundfünfzig Prozent haben mindestens einen Befund.\n\nOben steht, wonach ich gemessen habe: sechs Regeln, erst der Maßstab, dann das Ergebnis. Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.\n\nLinks stehen die beiden Pflichtregeln. Sie stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit verbindlich.\n\nStruktur heißt: Eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext. Dasselbe gilt für Aufzählungen, die jemand nur mit Bindestrichen gebaut hat. Wer sehend liest, merkt davon nichts. Ein Screenreader dagegen prachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.\n\nDer Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.\n\nDabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.\n\nDeshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.\n\nNoch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch."}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "html": "<p>Kurz die Rechtslage.</p><p>Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.</p><p>Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.</p><p>Der Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — genau die beiden Kriterien also, um die es in diesem Projekt geht.</p><p>Ich könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.</p><p>Freiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.</p><p>Den eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind.</p>", "roh": "Kurz die Rechtslage.\n\nDigitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.\n\nFür die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.\n\nDer Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — genau die beiden Kriterien also, um die es in diesem Projekt geht.\n\nIch könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.\n\nFreiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.\n\nDen eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind."}, {"nr": 7, "titel": "Was die Technik prüft, und was nur ein Mensch sieht.", "bild": "folie-07.png", "html": "<p>Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.</p><p>Links steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.</p><p>Rechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.</p><p>Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.</p><p>Diese Trennung hat sich beim Bauen zweimal selbst bestätigt. Zwei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Beide stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.</p><p>Technisch braucht es den KI-Rahmen, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort hinterlegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem.</p>", "roh": "Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.\n\nLinks steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.\n\nRechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.\n\nDie Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.\n\nDiese Trennung hat sich beim Bauen zweimal selbst bestätigt. Zwei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Beide stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.\n\nTechnisch braucht es den KI-Rahmen, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort hinterlegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem."}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "html": "<p>Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.</p><p>Die ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.</p><p>Der KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.</p><p>Das ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.</p><p>In der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn Anhang III setzt überall eine Bewertung natürlicher Personen voraus. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird.</p>", "roh": "Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.\n\nDie ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.\n\nDer KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.\n\nDas ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.\n\nIn der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn Anhang III setzt überall eine Bewertung natürlicher Personen voraus. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird."}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "html": "<p>Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.</p><p>Der erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.</p><p>Eine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.</p><p>Der zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.</p><p>Rechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.</p><p>Ich zeige euch das kurz live, an genau diesem Kurs.</p><p>Das ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.</p><p>Die Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt.</p>", "roh": "Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.\n\nDer erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.\n\nEine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.\n\nDer zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.\n\nRechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.\n\nIch zeige euch das kurz live, an genau diesem Kurs.\n\nDas ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.\n\nDie Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt."}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "html": "<p>Damit zum Change-Teil, und der beginnt mit den <strong>Stakeholdern</strong>. Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.</p><p>Oben rechts, eng einbinden: wer entscheidet oder zustimmen muss.</p><p><strong>Der Direktor</strong> — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.</p><p><strong>Der Fachbereich des Pilotbereichs</strong> — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.</p><p><strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.</p><p><strong>Der Personalrat</strong> — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein <strong>sperrender</strong>: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.</p><p>Nur dieser eine Fachbereich — deshalb unten links, informieren.</p><p><strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.</p><p>Oben links: hoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.</p><p><strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.</p><p><strong>Advellence</strong> — die Schweizer Firma, die laut Impressum das Portal programmiert.</p><p><strong>Die Betriebskommission</strong> — Aufsichtsgremium.</p><p><strong>Der Volkshochschul-Verband</strong> — stellt den KI-Rahmen, den ich nutze.</p><p>Und unten rechts der Quadrant, der mich am meisten beschäftigt hat.</p><p><strong>Die Kursleitungen auf Honorarbasis</strong> — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.</p><p><strong>Die Teilnehmenden</strong> — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.</p><p>Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie.</p>", "roh": "Damit zum Change-Teil, und der beginnt mit den **Stakeholdern**. Die **Einfluss-Betroffenheits-Matrix** sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.\n\nOben rechts, eng einbinden: wer entscheidet oder zustimmen muss.\n\n**Der Direktor** — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.\n\n**Der Fachbereich des Pilotbereichs** — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.\n\n**Die Redaktion des Programmhefts** — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.\n\n**Der Personalrat** — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein **sperrender**: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.\n\nNur dieser eine Fachbereich — deshalb unten links, informieren.\n\n**Die drei übrigen Fachbereiche** — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.\n\nOben links: hoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.\n\n**Die städtische IT** — bleibt für die technische Seite zuständig.\n\n**Advellence** — die Schweizer Firma, die laut Impressum das Portal programmiert.\n\n**Die Betriebskommission** — Aufsichtsgremium.\n\n**Der Volkshochschul-Verband** — stellt den KI-Rahmen, den ich nutze.\n\nUnd unten rechts der Quadrant, der mich am meisten beschäftigt hat.\n\n**Die Kursleitungen auf Honorarbasis** — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.\n\n**Die Teilnehmenden** — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.\n\nBei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie."}, {"nr": 11, "titel": "Vier Widerstände, und vier Antworten.", "bild": "folie-11.png", "html": "<p>Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.</p><p><strong>Unsicherheit</strong> — die Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.</p><p><strong>Verlustangst</strong> — und das ist der einzige Einwand, der noch offen ist. Ich habe nachgezählt: Der Beispielkurs besteht restlos aus zwei Bausteinen, dem Anmeldehinweis und der Niveaubeschreibung. Alle Befunde liegen dort, und der Anmeldehinweis steht wortgleich in hundertfünf Kursen. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas gemessen zu werden, das man nicht ändern darf. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage. Und darin steckt die gute Nachricht: ein Baustein in Ordnung gebracht, und hundertfünf Kurse sind es mit.</p><p><strong>Fehlende Perspektive</strong> — bei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor. Die Antwort ist der Zuschnitt: Geprüft wird im Programmbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status — verbindliche Regeln und ein Protokoll je Text sind genau die Merkmale, aus denen das Bundessozialgericht im Herrenberg-Urteil eine Eingliederung in den Betrieb hergeleitet hat.</p><p><strong>Gewohnheit</strong> — nicht als Trägheit, sondern als konkurrierendes Regelwerk: Diese Redaktion kürzt beruflich. Ein Werkzeug, das Erklärungen verlangt, arbeitet gegen ihren Auftrag. Die Antwort trennt die Medien: Geprüft wird der Text im Portal, und dort gibt es keine Seitenzahl.</p><p>Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird.</p>", "roh": "Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.\n\n**Unsicherheit** — die Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.\n\n**Verlustangst** — und das ist der einzige Einwand, der noch offen ist. Ich habe nachgezählt: Der Beispielkurs besteht restlos aus zwei Bausteinen, dem Anmeldehinweis und der Niveaubeschreibung. Alle Befunde liegen dort, und der Anmeldehinweis steht wortgleich in hundertfünf Kursen. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas gemessen zu werden, das man nicht ändern darf. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage. Und darin steckt die gute Nachricht: ein Baustein in Ordnung gebracht, und hundertfünf Kurse sind es mit.\n\n**Fehlende Perspektive** — bei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor. Die Antwort ist der Zuschnitt: Geprüft wird im Programmbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status — verbindliche Regeln und ein Protokoll je Text sind genau die Merkmale, aus denen das Bundessozialgericht im Herrenberg-Urteil eine Eingliederung in den Betrieb hergeleitet hat.\n\n**Gewohnheit** — nicht als Trägheit, sondern als konkurrierendes Regelwerk: Diese Redaktion kürzt beruflich. Ein Werkzeug, das Erklärungen verlangt, arbeitet gegen ihren Auftrag. Die Antwort trennt die Medien: Geprüft wird der Text im Portal, und dort gibt es keine Seitenzahl.\n\nBetroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird."}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "html": "<p>Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.</p><p>Erstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.</p><p>Und zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat.</p>", "roh": "Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.\n\nErstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.\n\nUnd zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat."}, {"nr": 13, "titel": "Die ersten 30 Tage.", "bild": "folie-13.png", "html": "<p>Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.</p><p>Die Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Rahmen ist da.</p><p>Der dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt.</p>", "roh": "Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.\n\nDie Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Rahmen ist da.\n\nDer dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt."}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "html": "<p>Und woran würde man merken, ob es gewirkt hat?</p><p>Vier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.</p><p>Die vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.</p><p>Diese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.</p><p>In der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und das Skript ist dafür eingefroren. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.</p><p>Unten steht das Risiko, das ich zuerst übersehen habe und das unangenehmste ist: Die Protokolle können gegen das Unternehmen verwendet werden. Sie belegen datiert und zitierbar, dass Texte Kriterien verletzen, die das Haus sich freiwillig gibt. Wer laut Impressum persönlich für die Inhalte verantwortlich ist, hat nach dem Pilot eine Kenntnis, die er vorher nicht hatte. Deshalb gehören die Protokolle in dieselbe Dienstvereinbarung, und deshalb gehört zu jedem Befundstand ein Abstellplan mit Datum. Ein dokumentierter Mangel mit Plan steht besser da als ungeprüfter Bestand — aber nur, wenn der Plan wirklich existiert.</p>", "roh": "Und woran würde man merken, ob es gewirkt hat?\n\nVier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.\n\nDie vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.\n\nDiese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.\n\nIn der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und das Skript ist dafür eingefroren. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.\n\nUnten steht das Risiko, das ich zuerst übersehen habe und das unangenehmste ist: Die Protokolle können gegen das Unternehmen verwendet werden. Sie belegen datiert und zitierbar, dass Texte Kriterien verletzen, die das Haus sich freiwillig gibt. Wer laut Impressum persönlich für die Inhalte verantwortlich ist, hat nach dem Pilot eine Kenntnis, die er vorher nicht hatte. Deshalb gehören die Protokolle in dieselbe Dienstvereinbarung, und deshalb gehört zu jedem Befundstand ein Abstellplan mit Datum. Ein dokumentierter Mangel mit Plan steht besser da als ungeprüfter Bestand — aber nur, wenn der Plan wirklich existiert."}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "html": "<p>Ich habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.</p><p>Der System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.</p><p>Danke für die Aufmerksamkeit. Die Adresse steht oben, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen.</p>", "roh": "Ich habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.\n\nDer System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.\n\nDanke für die Aufmerksamkeit. Die Adresse steht oben, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen."}];

<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
const eBild = document.getElementById('bild');

function zeige(i){
  const f = FOLIEN[i];
  eBild.src = f.bild;
  eBild.alt = 'Folie ' + f.nr + ': ' + f.titel;
  document.title = 'Folie ' + String(f.nr).padStart(2, '0');
}

// Alle Folienbilder einmal vorladen, damit beim Blaettern kein schwarzer
// Zwischenzustand entsteht.
FOLIEN.forEach(f => { const v = new Image(); v.src = f.bild; });

window.klartext = { gehe: i => gehe(i, false), anzahl: () => FOLIEN.length };

gehe(ausAdresse(), false);
</script>
