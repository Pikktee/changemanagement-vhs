<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "html": "<h3>Begrüßung</h3><p>Willkommen zu meinem Abschlussprojekt!</p><ul><li>KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.</li></ul><h3>Worum geht es?</h3><ul><li>Barrierefreiheit.</li><li>Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:</li><li>ob der Text ankommt bei denen, für die er geschrieben ist.</li></ul><h3>Ein konkreter Fall</h3><ul><li>Beispiel: Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen.</li><li>Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht.</li></ul>", "roh": "### Begrüßung\n\nWillkommen zu meinem Abschlussprojekt!\n- KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.\n\n### Worum geht es?\n\n- Barrierefreiheit.\n- Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:\n- ob der Text ankommt bei denen, für die er geschrieben ist.\n\n### Ein konkreter Fall\n- Beispiel: Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen.\n- Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht."}, {"nr": 2, "titel": "Die Technik wird geprüft, die Texte nicht.", "bild": "folie-02.png", "html": "<p>Erstmal eine kurze Übersicht zum Projekt.</p><h3>5.800 Texte und 57 Prozent</h3><ul><li>Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.</li><li>Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. <span class=\"neben\">Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.</span></li></ul><h3>Fünf Jahre ohne externe Prüfung</h3><p>Die letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.</p><h3>Einfache Sprache, der eigentliche Anlass</h3><p>Dort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.</p><h3>Der Kasten unten</h3><p>Vor allem hier setzt das Projekt an.</p>", "roh": "Erstmal eine kurze Übersicht zum Projekt.\n\n### 5.800 Texte und 57 Prozent\n\n- Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.\n- Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. ((Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.))\n\n### Fünf Jahre ohne externe Prüfung\nDie letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.\n\n### Einfache Sprache, der eigentliche Anlass\nDort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.\n\n### Der Kasten unten\nVor allem hier setzt das Projekt an."}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "html": "<p>Daraus folgt mein Vorschlag.</p><h3>Ziel</h3><ul><li><em>vorlesen</em></li></ul><h3>Lösung</h3><ul><li><span class=\"wichtig\">Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung.</span> (weiter vorlesen)</li></ul><h3>Abgrenzung</h3><ul><li>Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.</li></ul><h3>Ergebnis</h3><ul><li><em>vorlesen</em></li></ul><h3>Der Kasten unten</h3><ul><li><em>vorlesen</em></li></ul>", "roh": "Daraus folgt mein Vorschlag.\n\n### Ziel\n- *vorlesen*\n\n### Lösung\n- ==Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung.== (weiter vorlesen)\n\n### Abgrenzung\n- Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.\n\n### Ergebnis\n- *vorlesen*\n\n### Der Kasten unten\n- *vorlesen*"}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "html": "<p>Zunächst zum Unternehmen und zum aktuellen Prozess.</p><h3>Das Unternehmen</h3><ul><li>kein Amt, sondern ein Eigenbetrieb der Stadt.</li><li>seit 2005 extern qualitätsgeprüft nach <strong>LQW</strong>, <strong>Lernerorientierte Qualitätstestierung in der Weiterbildung</strong></li><li>Es gibt acht Programmbereiche in vier Fachbereichen</li><li>Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.</li><li>Darüber steht eine Betriebskommission mit 16 Sitzen, 2 davon für den Personalrat.</li></ul><h3>Der Satz oben aus der Betriebssatzung</h3><p>Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.</p><h3>So entsteht ein Kurstext</h3><ul><li><em>(vorlesen)</em></li></ul>", "roh": "Zunächst zum Unternehmen und zum aktuellen Prozess.\n\n### Das Unternehmen\n- kein Amt, sondern ein Eigenbetrieb der Stadt.\n- seit 2005 extern qualitätsgeprüft nach **LQW**, **Lernerorientierte Qualitätstestierung in der Weiterbildung**\n- Es gibt acht Programmbereiche in vier Fachbereichen\n- Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.\n- Darüber steht eine Betriebskommission mit 16 Sitzen, 2 davon für den Personalrat.\n\n### Der Satz oben aus der Betriebssatzung\nDer Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.\n\n### So entsteht ein Kurstext\n- *(vorlesen)*"}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "html": "<p>Zur Potenzialermittlung. Was zählt als Befund und für wen?</p><ul><li>Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte erhalten und mit einem Skript ausgewertet.</li></ul><h3>Wonach wurde gemssen?</h3><ul><li>Nach 6 Regeln, die auch im System-Prompt Verwendung finden</li></ul><h3>Es gibt 2 Pflichtregeln</h3><ul><li>Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.</li><li><strong>STRUKTUR</strong>: z.B. eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.</li><li><strong>LINKTEXT</strong>: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“</li><li><strong>Bei beiden</strong>: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.</li></ul><h3>Die vier Empfehlungen</h3><ul><li>Nicht verbindlich, aber sind die wichtigsten des Projekts.</li><li><strong>NIVEAU:</strong> Niveau heißt: Ein Wort liegt über dem Sprachniveau der Menschen, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.</li><li><strong>AMTSDEUTSCH</strong>: (vorlesen)</li><li><strong>SATZ</strong>: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.</li><li><strong>ABKÜRZUNG</strong>: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.</li></ul><h3>Zwei Kurse im Vergleich als Beispiel</h3><ul><li>Englisch A1.1 und Deutsch als Fremdsprache A2.2</li><li>Beide Beschreibungen sind auf Deutsch. <span class=\"wichtig\">Nur kann die eine Zielgruppe Deutsch — die andere lernt es gerade erst.</span></li><li>Englischkurs: kein einziges zu schweres Wort. Deutschkurs: dreiundfünfzig.</li><li>Beide Texte haben kurze Sätze. Ein Programm, das nur zählt, findet bei keinem etwas.</li></ul><h3>Der Kasten unten</h3><ul><li>Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es z.B. 31 verschiedene Texte, die  Wörter über dem Niveau ihrer Leser enthalten. Genau hier kann ein KI-Prompt etwas, was ein Standardwerkzeug nicht kann.</li></ul>", "roh": "Zur Potenzialermittlung. Was zählt als Befund und für wen?\n\n- Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte erhalten und mit einem Skript ausgewertet.\n\n### Wonach wurde gemssen?\n- Nach 6 Regeln, die auch im System-Prompt Verwendung finden\n\n### Es gibt 2 Pflichtregeln\n- Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.\n- **STRUKTUR**: z.B. eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.\n- **LINKTEXT**: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“\n- **Bei beiden**: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.\n\n### Die vier Empfehlungen\n- Nicht verbindlich, aber sind die wichtigsten des Projekts.\n- **NIVEAU:** Niveau heißt: Ein Wort liegt über dem Sprachniveau der Menschen, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.\n- **AMTSDEUTSCH**: (vorlesen)\n- **SATZ**: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.\n- **ABKÜRZUNG**: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.\n\n### Zwei Kurse im Vergleich als Beispiel\n- Englisch A1.1 und Deutsch als Fremdsprache A2.2\n- Beide Beschreibungen sind auf Deutsch. ==Nur kann die eine Zielgruppe Deutsch — die andere lernt es gerade erst.==\n- Englischkurs: kein einziges zu schweres Wort. Deutschkurs: dreiundfünfzig.\n- Beide Texte haben kurze Sätze. Ein Programm, das nur zählt, findet bei keinem etwas.\n\n### Der Kasten unten\n- Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es z.B. 31 verschiedene Texte, die  Wörter über dem Niveau ihrer Leser enthalten. Genau hier kann ein KI-Prompt etwas, was ein Standardwerkzeug nicht kann."}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "html": "<p>Zunächst noch kurz zur Rechtslage.</p><h3>Was bedeutet Barrierefreiheit?</h3><ul><li>Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, Doppel A und Dreifach A.</li></ul><h3>Welches Recht gilt?</h3><ul><li>Wichtig: Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar.</li><li>Als kommunale Einrichtung in Hessen greift Landesrecht: Paragraph 14 des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe Doppel A.</li></ul><h3>Callout</h3><ul><li>Einige der Regeln sind freiwillig, da sie nicht in WCAG Doppel A enthalten sind.</li><li>Freiwillig heißt aber nicht belanglos. Paragraph 3 Absatz 1 der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind.</li><li>Außerdem sagt die Betriebssatzung, dass die Angebote allen offen stehen, ohne Rücksicht auf Vorbildung.</li></ul>", "roh": "Zunächst noch kurz zur Rechtslage.\n\n### Was bedeutet Barrierefreiheit?\n- Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, Doppel A und Dreifach A.\n\n### Welches Recht gilt?\n- Wichtig: Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar.\n- Als kommunale Einrichtung in Hessen greift Landesrecht: Paragraph 14 des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe Doppel A.\n\n### Callout\n- Einige der Regeln sind freiwillig, da sie nicht in WCAG Doppel A enthalten sind.\n- Freiwillig heißt aber nicht belanglos. Paragraph 3 Absatz 1 der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind.\n- Außerdem sagt die Betriebssatzung, dass die Angebote allen offen stehen, ohne Rücksicht auf Vorbildung."}, {"nr": 7, "titel": "Was die Technik prüft, und wo KLARTEXT ansetzt.", "bild": "folie-07.png", "html": "<p>Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.</p><h3>Die Website</h3><ul><li>Links steht, was an der Website als Ganzem hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation.</li><li>Prüfbar, ohne einen einzigen Kurs zu kennen. Gilt für alle 5800 Texte gleich.</li><li>Dafür gibt es etablierte Programme wie <strong>axe-core</strong>. Zuständig ist die städtische IT.</li></ul><h3>Der einzelne Text</h3><ul><li>Rechts steht, was am einzelnen Text hängt: <span class=\"wichtig\">Versteht die Zielgruppe genau dieses Kurses ihn?</span></li><li>Das lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.</li></ul><h3>Der Kasten unten</h3><ul><li>Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien.</li><li>Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, im Quelltext aber keine. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts.</li><li>Ob sie eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt dieses Pflichtkriterium rechts.</li><li><span class=\"neben\">Beim Bauen hat sich das dreimal bestätigt: Drei Zusagen, die zuerst im Prompt standen, hielt das Modell nicht zuverlässig ein. Alle drei stehen heute im Programmcode.</span></li></ul><h3>Technische Voraussetzungen</h3><ul><li>Der KI-Zugang, den der Volkshochschul-Verband ohnehin bereitstellt, ein dort angelegter Assistent, die Wortliste als Datei.</li><li>Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem.</li></ul>", "roh": "Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.\n\n### Die Website\n- Links steht, was an der Website als Ganzem hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation.\n- Prüfbar, ohne einen einzigen Kurs zu kennen. Gilt für alle 5800 Texte gleich.\n- Dafür gibt es etablierte Programme wie **axe-core**. Zuständig ist die städtische IT.\n\n### Der einzelne Text\n- Rechts steht, was am einzelnen Text hängt: ==Versteht die Zielgruppe genau dieses Kurses ihn?==\n- Das lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.\n\n### Der Kasten unten\n- Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien.\n- Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, im Quelltext aber keine. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts.\n- Ob sie eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt dieses Pflichtkriterium rechts.\n- ((Beim Bauen hat sich das dreimal bestätigt: Drei Zusagen, die zuerst im Prompt standen, hielt das Modell nicht zuverlässig ein. Alle drei stehen heute im Programmcode.))\n\n### Technische Voraussetzungen\n- Der KI-Zugang, den der Volkshochschul-Verband ohnehin bereitstellt, ein dort angelegter Assistent, die Wortliste als Datei.\n- Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem."}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "html": "<p>Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.</p><h3>Rolle, Aufgabe, Format</h3><ul><li><strong>ROLLE</strong>: Redaktionsassistenz, nicht Autorin.</li><li><strong>AUFGABE</strong>: erst die Zielgruppe bestimmen, dann prüfen. Die Reihenfolge steht fest.</li><li><strong>FORMAT</strong>: zu jedem Befund ein wörtliches Zitat, eine Begründung, ein konkreter Vorschlag. <span class=\"wichtig\">Ohne Vorschlag kein Befund.</span></li></ul><h3>Kontext: die Wortliste</h3><ul><li>Der KONTEXT enthält das Hauswissen: acht Programmbereiche, interne Abkürzungen, sechs Prüfregeln.</li><li>Der wichtigste Teil: 820 Wörter des Prüfungswortschatzes für das <strong>Goethe-Zertifikat A1</strong>. Vollständig im Prompt, nicht als Verweis.</li><li><span class=\"wichtig\">Er schätzt das Sprachniveau also nicht, er begründet es.</span></li><li>Das ist das Ergebnis der ersten Überarbeitung: Vorher behauptete der Prompt, gegen Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte frei und klang nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe.</li><li><span class=\"neben\">Der Grundstock dieser Listen stammt laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschul-Verbands in Frankfurt.</span></li></ul><h3>Der Kasten unten: die Zeile GRENZEN</h3><ul><li>„Bewertet Texte, niemals Personen.“ Dieser eine Satz leistet zweierlei.</li><li>Er hält das Projekt aus dem Hochrisikobereich der KI-Verordnung: Hoch eingestuft wird dort nur, was Menschen bewertet — dieses System bewertet Texte.</li><li>Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird.</li></ul>", "roh": "Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.\n\n### Rolle, Aufgabe, Format\n- **ROLLE**: Redaktionsassistenz, nicht Autorin.\n- **AUFGABE**: erst die Zielgruppe bestimmen, dann prüfen. Die Reihenfolge steht fest.\n- **FORMAT**: zu jedem Befund ein wörtliches Zitat, eine Begründung, ein konkreter Vorschlag. ==Ohne Vorschlag kein Befund.==\n\n### Kontext: die Wortliste\n- Der KONTEXT enthält das Hauswissen: acht Programmbereiche, interne Abkürzungen, sechs Prüfregeln.\n- Der wichtigste Teil: 820 Wörter des Prüfungswortschatzes für das **Goethe-Zertifikat A1**. Vollständig im Prompt, nicht als Verweis.\n- ==Er schätzt das Sprachniveau also nicht, er begründet es.==\n- Das ist das Ergebnis der ersten Überarbeitung: Vorher behauptete der Prompt, gegen Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte frei und klang nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe.\n- ((Der Grundstock dieser Listen stammt laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschul-Verbands in Frankfurt.))\n\n### Der Kasten unten: die Zeile GRENZEN\n- „Bewertet Texte, niemals Personen.“ Dieser eine Satz leistet zweierlei.\n- Er hält das Projekt aus dem Hochrisikobereich der KI-Verordnung: Hoch eingestuft wird dort nur, was Menschen bewertet — dieses System bewertet Texte.\n- Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird."}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "html": "<p>Bleibt die Frage, wie das in den Alltag kommt. Zwei Wege, beide vom ersten Tag an offen.</p><h3>Weg 1: Als KI-Assistent bei fobizz</h3><ul><li>Braucht keine eigene Technik.</li><li>Der Deutsche Volkshochschul-Verband hat im Mai 2025 eine Rahmenvereinbarung mit <strong>fobizz</strong> geschlossen: datenschutzkonformer KI-Zugang für alle Volkshochschulen, mit eigenen Assistenten und eigenen Anweisungen.</li><li>Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es nicht, weil der Rahmenvertrag schon da ist.</li><li><span class=\"neben\">Zu klären bleibt, ob die vhs Frankfurt die Lizenz auch gebucht hat. Der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.</span></li></ul><h3>Die Einschränkung dazu</h3><ul><li>Diesen Weg habe ich nicht ausprobiert.</li><li>Mein Prüfwerkzeug bearbeitet jede Antwort nach: Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, beides hielt das Modell nicht zuverlässig ein.</li><li><span class=\"wichtig\">In einem fremden Assistenten gibt es diesen Code nicht.</span> Was das praktisch bedeutet, muss der Pilot zeigen.</li></ul><h3>Weg 2: Als eigenes Prüfwerkzeug</h3><ul><li>Das Werkzeug, das ich gebaut habe. Entwurf einfügen — oder bei einem vorhandenen Kurs nur die Nummer, dann holt es den Text selbst.</li><li>Die Schnittstelle des Kursportals ist öffentlich. Es braucht nur einen eigenen Server.</li></ul><h3>Rechts im Bild: ein Befund</h3><ul><li>Ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2.</li><li>Jeder Befund hat dieselben vier Teile: Einstufung, Regel, wörtliche Stelle, Vorschlag.</li><li>Dieser hier ist Pflicht: Der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“.</li><li>Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.</li></ul><h3>Hier die Vorführung</h3><ul><li>Ich zeige euch das kurz live, an genau diesem Kurs.</li><li><span class=\"neben\">Ein Prototyp für diese Arbeit. Er belegt, dass der Weg funktioniert — eine fertige Anwendung ist er nicht.</span></li></ul><h3>Der Kasten unten</h3><ul><li>Kein Teil des Pilotprojekts: Man könnte die Prüfung ins Redaktionssystem einbauen, dort, wo der Text entsteht.</li><li>Nur wird das Portal von einem externen Dienstleister betreut. Also Auftrag, Budget, Vorlauf.</li><li><span class=\"wichtig\">Man kauft nichts, bevor man weiß, ob es wirkt.</span></li></ul>", "roh": "Bleibt die Frage, wie das in den Alltag kommt. Zwei Wege, beide vom ersten Tag an offen.\n\n### Weg 1: Als KI-Assistent bei fobizz\n- Braucht keine eigene Technik.\n- Der Deutsche Volkshochschul-Verband hat im Mai 2025 eine Rahmenvereinbarung mit **fobizz** geschlossen: datenschutzkonformer KI-Zugang für alle Volkshochschulen, mit eigenen Assistenten und eigenen Anweisungen.\n- Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es nicht, weil der Rahmenvertrag schon da ist.\n- ((Zu klären bleibt, ob die vhs Frankfurt die Lizenz auch gebucht hat. Der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.))\n\n### Die Einschränkung dazu\n- Diesen Weg habe ich nicht ausprobiert.\n- Mein Prüfwerkzeug bearbeitet jede Antwort nach: Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, beides hielt das Modell nicht zuverlässig ein.\n- ==In einem fremden Assistenten gibt es diesen Code nicht.== Was das praktisch bedeutet, muss der Pilot zeigen.\n\n### Weg 2: Als eigenes Prüfwerkzeug\n- Das Werkzeug, das ich gebaut habe. Entwurf einfügen — oder bei einem vorhandenen Kurs nur die Nummer, dann holt es den Text selbst.\n- Die Schnittstelle des Kursportals ist öffentlich. Es braucht nur einen eigenen Server.\n\n### Rechts im Bild: ein Befund\n- Ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2.\n- Jeder Befund hat dieselben vier Teile: Einstufung, Regel, wörtliche Stelle, Vorschlag.\n- Dieser hier ist Pflicht: Der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“.\n- Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.\n\n### Hier die Vorführung\n- Ich zeige euch das kurz live, an genau diesem Kurs.\n- ((Ein Prototyp für diese Arbeit. Er belegt, dass der Weg funktioniert — eine fertige Anwendung ist er nicht.))\n\n### Der Kasten unten\n- Kein Teil des Pilotprojekts: Man könnte die Prüfung ins Redaktionssystem einbauen, dort, wo der Text entsteht.\n- Nur wird das Portal von einem externen Dienstleister betreut. Also Auftrag, Budget, Vorlauf.\n- ==Man kauft nichts, bevor man weiß, ob es wirkt.=="}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "html": "<p>Damit zum Change-Teil, und der beginnt mit den <strong>Stakeholdern</strong>. Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.</p><h3>Oben rechts: Eng einbinden</h3><ul><li>Wer entscheidet oder zustimmen muss.</li><li><strong>Der Direktor</strong> — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.</li><li><strong>Der Fachbereich des Pilotbereichs</strong> — entscheidet über den Text. Und zwar nur dieser eine: Vier gleichzeitig wären kein Pilot mehr.</li><li><strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.</li><li><strong>Der Personalrat</strong> — hier ist die Einordnung zu schwach. Sein Einfluss ist kein hoher, sondern ein <span class=\"wichtig\">sperrender</span>: Die Einführung ist mitbestimmungspflichtig. <span class=\"neben\">Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.</span></li></ul><h3>Unten links: Informieren</h3><ul><li><strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.</li></ul><h3>Oben links: Beobachten</h3><ul><li>Hoher Einfluss, aber ihre Arbeit verändert das Projekt nicht.</li><li><strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.</li><li><strong>Advellence</strong> — programmiert laut Impressum das Portal.</li><li><strong>Die Betriebskommission</strong> — Aufsichtsgremium.</li><li><strong>Der Volkshochschul-Verband</strong> — stellt den KI-Zugang.</li></ul><h3>Unten rechts: Konsultieren</h3><ul><li>Der Quadrant, der mich am meisten beschäftigt hat.</li><li><strong>Die Kursleitungen auf Honorarbasis</strong> — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen nichts.</li><li>Einen Kanal haben sie doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.</li><li><strong>Die Teilnehmenden</strong> — besonders in Deutschkursen und Grundbildung. <span class=\"wichtig\">Für sie ist das Projekt gemacht, und sie haben keine Stimme — in keinem Gremium und in keinem Gesetz.</span></li><li>Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das es überhaupt gibt.</li></ul>", "roh": "Damit zum Change-Teil, und der beginnt mit den **Stakeholdern**. Die **Einfluss-Betroffenheits-Matrix** sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.\n\n### Oben rechts: Eng einbinden\n- Wer entscheidet oder zustimmen muss.\n- **Der Direktor** — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.\n- **Der Fachbereich des Pilotbereichs** — entscheidet über den Text. Und zwar nur dieser eine: Vier gleichzeitig wären kein Pilot mehr.\n- **Die Redaktion des Programmhefts** — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.\n- **Der Personalrat** — hier ist die Einordnung zu schwach. Sein Einfluss ist kein hoher, sondern ein ==sperrender==: Die Einführung ist mitbestimmungspflichtig. ((Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.))\n\n### Unten links: Informieren\n- **Die drei übrigen Fachbereiche** — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.\n\n### Oben links: Beobachten\n- Hoher Einfluss, aber ihre Arbeit verändert das Projekt nicht.\n- **Die städtische IT** — bleibt für die technische Seite zuständig.\n- **Advellence** — programmiert laut Impressum das Portal.\n- **Die Betriebskommission** — Aufsichtsgremium.\n- **Der Volkshochschul-Verband** — stellt den KI-Zugang.\n\n### Unten rechts: Konsultieren\n- Der Quadrant, der mich am meisten beschäftigt hat.\n- **Die Kursleitungen auf Honorarbasis** — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen nichts.\n- Einen Kanal haben sie doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.\n- **Die Teilnehmenden** — besonders in Deutschkursen und Grundbildung. ==Für sie ist das Projekt gemacht, und sie haben keine Stimme — in keinem Gremium und in keinem Gesetz.==\n- Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das es überhaupt gibt."}, {"nr": 11, "titel": "Vier Widerstände, und vier Antworten.", "bild": "folie-11.png", "html": "<p>Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Für jede gibt es hier einen Fall, den es wirklich gibt.</p><h3>Unsicherheit · im ganzen Haus</h3><ul><li>Die Frage, die als Erstes kommt: Schreibt die KI jetzt unsere Texte?</li><li>Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen.</li><li><span class=\"wichtig\">Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.</span></li></ul><h3>Verlustangst · Fachbereich</h3><ul><li>Der einzige Einwand, der noch offen ist.</li><li>Eine Kursbeschreibung ist selten von einer Hand: Anmeldehinweis, Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht dort gepflegt, wo der Kurs angeboten wird.</li><li>Wer die Befunde bekommt, darf den Text also oft gar nicht ändern.</li><li>Keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört.</li><li>Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.</li></ul><h3>Fehlende Perspektive · Kursleitung</h3><ul><li>Bei den Honorarkräften schärfer als bei allen anderen: Ihre Abrechnungseinheit ist die Unterrichtsstunde, Textarbeit kommt darin nicht vor.</li><li>Der Einwand ist berechtigt und gehört auch so beantwortet.</li><li>Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht.</li><li><span class=\"neben\">Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.</span></li></ul><h3>Gewohnheit · Redaktion des Programmhefts</h3><ul><li>Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich.</li><li>Diese Redaktion prüft als Einzige im Haus heute schon Texte. Sie ist keine Bremse, sondern der nächstliegende Verbündete — und so sollte man ihr auch begegnen.</li><li>Der Punkt ist nur: <span class=\"wichtig\">Wer sich beschwert, hat den Text gelesen und verstanden.</span></li><li>Die Menschen, um die es geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. <span class=\"neben\">Dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.</span></li></ul><h3>Der Kasten unten</h3><ul><li>Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird.</li></ul>", "roh": "Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Für jede gibt es hier einen Fall, den es wirklich gibt.\n\n### Unsicherheit · im ganzen Haus\n- Die Frage, die als Erstes kommt: Schreibt die KI jetzt unsere Texte?\n- Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen.\n- ==Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.==\n\n### Verlustangst · Fachbereich\n- Der einzige Einwand, der noch offen ist.\n- Eine Kursbeschreibung ist selten von einer Hand: Anmeldehinweis, Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht dort gepflegt, wo der Kurs angeboten wird.\n- Wer die Befunde bekommt, darf den Text also oft gar nicht ändern.\n- Keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört.\n- Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.\n\n### Fehlende Perspektive · Kursleitung\n- Bei den Honorarkräften schärfer als bei allen anderen: Ihre Abrechnungseinheit ist die Unterrichtsstunde, Textarbeit kommt darin nicht vor.\n- Der Einwand ist berechtigt und gehört auch so beantwortet.\n- Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht.\n- ((Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.))\n\n### Gewohnheit · Redaktion des Programmhefts\n- Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich.\n- Diese Redaktion prüft als Einzige im Haus heute schon Texte. Sie ist keine Bremse, sondern der nächstliegende Verbündete — und so sollte man ihr auch begegnen.\n- Der Punkt ist nur: ==Wer sich beschwert, hat den Text gelesen und verstanden.==\n- Die Menschen, um die es geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. ((Dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.))\n\n### Der Kasten unten\n- Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird."}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "html": "<p>Der Zeitplan: drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.</p><h3>Monat 2, Kommunikation: Training</h3><ul><li>Keine Kür, sondern Pflicht: <strong>Artikel 4 der KI-Verordnung</strong> verlangt seit Februar 2025 ausreichende KI-Kompetenz.</li><li>Und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind.</li><li>Deshalb steht in der Zelle nicht „Personal“, sondern „alle, die bedienen“. <span class=\"neben\">Wer nicht bedient, braucht die Schulung nicht — deshalb bleiben die Kursleitungen aus dieser Kette.</span></li></ul><h3>Strang Change: erst fragen, dann handeln</h3><ul><li>Die Freigabe der Textbausteine steht im ersten Monat, nicht im zweiten.</li><li><span class=\"wichtig\">Sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat.</span></li></ul>", "roh": "Der Zeitplan: drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.\n\n### Monat 2, Kommunikation: Training\n- Keine Kür, sondern Pflicht: **Artikel 4 der KI-Verordnung** verlangt seit Februar 2025 ausreichende KI-Kompetenz.\n- Und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind.\n- Deshalb steht in der Zelle nicht „Personal“, sondern „alle, die bedienen“. ((Wer nicht bedient, braucht die Schulung nicht — deshalb bleiben die Kursleitungen aus dieser Kette.))\n\n### Strang Change: erst fragen, dann handeln\n- Die Freigabe der Textbausteine steht im ersten Monat, nicht im zweiten.\n- ==Sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat.=="}, {"nr": 13, "titel": "Die ersten 30 Tage.", "bild": "folie-13.png", "html": "<p>Die ersten dreißig Tage. Keine Aufzählung, sondern eine Reihenfolge: <span class=\"wichtig\">Jeder Schritt bedingt den nächsten.</span></p><h3>Die vier Schritte</h3><ul><li>Die <strong>Dienstvereinbarung</strong> zuerst, aus dem Grund von eben.</li><li>Dann einen <strong>Programmbereich</strong> gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung.</li><li>Dann die <strong>Freigabe der Bausteine</strong>.</li><li>Und erst als viertes das Technische, den <strong>Assistenten anlegen</strong>. Das kostet nichts: kein Einkauf, keine neue Stelle, der KI-Zugang ist da.</li></ul><h3>Der Kasten unten: der dritte Schritt</h3><ul><li>Der, den man am ehesten überspringt, und der teuerste.</li><li>Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf.</li><li>Das Werkzeug hat sich dann beim ersten Durchlauf selbst erledigt.</li></ul>", "roh": "Die ersten dreißig Tage. Keine Aufzählung, sondern eine Reihenfolge: ==Jeder Schritt bedingt den nächsten.==\n\n### Die vier Schritte\n- Die **Dienstvereinbarung** zuerst, aus dem Grund von eben.\n- Dann einen **Programmbereich** gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung.\n- Dann die **Freigabe der Bausteine**.\n- Und erst als viertes das Technische, den **Assistenten anlegen**. Das kostet nichts: kein Einkauf, keine neue Stelle, der KI-Zugang ist da.\n\n### Der Kasten unten: der dritte Schritt\n- Der, den man am ehesten überspringt, und der teuerste.\n- Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf.\n- Das Werkzeug hat sich dann beim ersten Durchlauf selbst erledigt."}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "html": "<p>Und woran würde man merken, ob es gewirkt hat?</p><h3>Die ersten drei Kennzahlen</h3><ul><li>Vier Kennzahlen, jede mit Ausgangswert und Ziel.</li><li>Die Befundquote soll von 57 Prozent unter 25 fallen.</li><li>Alle neuen Texte im Pilotbereich sollen geprüft sein.</li><li>Von den 31 Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.</li></ul><h3>Die vierte Kennzahl: die Befragung</h3><ul><li>Die ersten drei messen nur den Text, nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst.</li><li>Nicht über einen Fragebogen auf der Website — den füllt genau die Zielgruppe nicht aus, um die es geht.</li><li>Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.</li><li><span class=\"wichtig\">Freiwillig und vergütet.</span> <span class=\"neben\">Sonst wäre sie eine neue Aufgabe ohne Bezahlung — bei Honorarkräften genau das Problem von der Widerstandsfolie.</span></li></ul><h3>Letzte Spalte: womit gemessen wird</h3><ul><li>Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung. Dafür bleibt es unverändert liegen.</li><li>Sonst wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.</li></ul><h3>Das Risiko unten</h3><ul><li>Die ersten drei Kennzahlen lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Quote.</li><li><span class=\"wichtig\">Ein kürzerer Satz ist nicht automatisch ein verständlicherer.</span></li><li>Genau dagegen steht die vierte. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist.</li><li>Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab.</li></ul>", "roh": "Und woran würde man merken, ob es gewirkt hat?\n\n### Die ersten drei Kennzahlen\n- Vier Kennzahlen, jede mit Ausgangswert und Ziel.\n- Die Befundquote soll von 57 Prozent unter 25 fallen.\n- Alle neuen Texte im Pilotbereich sollen geprüft sein.\n- Von den 31 Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.\n\n### Die vierte Kennzahl: die Befragung\n- Die ersten drei messen nur den Text, nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst.\n- Nicht über einen Fragebogen auf der Website — den füllt genau die Zielgruppe nicht aus, um die es geht.\n- Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.\n- ==Freiwillig und vergütet.== ((Sonst wäre sie eine neue Aufgabe ohne Bezahlung — bei Honorarkräften genau das Problem von der Widerstandsfolie.))\n\n### Letzte Spalte: womit gemessen wird\n- Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung. Dafür bleibt es unverändert liegen.\n- Sonst wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.\n\n### Das Risiko unten\n- Die ersten drei Kennzahlen lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Quote.\n- ==Ein kürzerer Satz ist nicht automatisch ein verständlicherer.==\n- Genau dagegen steht die vierte. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist.\n- Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab."}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "html": "<ul><li>Danke für die Aufmerksamkeit.</li></ul><ul><li>Zum Test an einem Kurstext aus dem Portal habe ich die URL zum Prototypen verlinkt — mit dem Prompt in allen Fassungen.</li></ul><ul><li>Wenn es Fragen gibt gerne.</li></ul>", "roh": "- Danke für die Aufmerksamkeit.\n\n- Zum Test an einem Kurstext aus dem Portal habe ich die URL zum Prototypen verlinkt — mit dem Prompt in allen Fassungen.\n\n- Wenn es Fragen gibt gerne."}];
</script>
<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
const eBild = document.getElementById('bild');

function zeige(i){
  const f = FOLIEN[i];
  eBild.src = f.bild;
  eBild.alt = 'Folie ' + f.nr + ': ' + f.titel;
  document.title = 'Folie ' + String(f.nr).padStart(2, '0');
}

// Alle Folienbilder einmal vorladen, damit beim Blaettern kein schwarzer
// Zwischenzustand entsteht.
FOLIEN.forEach(f => { const v = new Image(); v.src = f.bild; });

window.klartext = { gehe: i => gehe(i, false), anzahl: () => FOLIEN.length };

gehe(ausAdresse(), false);
</script>
</body>
