<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "html": "<h3>Begrüßung</h3><p>Willkommen zu meinem Abschlussprojekt!</p><ul><li>KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.</li></ul><h3>Worum geht es?</h3><ul><li>Barrierefreiheit.</li><li>Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:</li><li>ob der Text ankommt bei denen, für die er geschrieben ist.</li></ul><h3>Der schärfste Fall</h3><ul><li>Beispiel: bietet die Volkshochschule Deutschkurse für Menschen an, die gerade erst Deutsch lernen.</li><li>Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht.</li></ul>", "roh": "### Begrüßung\n\nWillkommen zu meinem Abschlussprojekt!\n- KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.\n\n### Worum geht es?\n\n- Barrierefreiheit.\n- Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:\n- ob der Text ankommt bei denen, für die er geschrieben ist.\n\n### Der schärfste Fall\n- Beispiel: bietet die Volkshochschule Deutschkurse für Menschen an, die gerade erst Deutsch lernen.\n- Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht."}, {"nr": 2, "titel": "Die Technik wird geprüft, die Texte nicht.", "bild": "folie-02.png", "html": "<p>Erstmal eine kurze Übersicht zum Projekt.</p><h3>5.800 Texte und 57 Prozent</h3><ul><li>Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.</li><li>Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. <span class=\"neben\">Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.</span></li></ul><h3>Fünf Jahre ohne externe Prüfung</h3><p>Die letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.</p><h3>Einfache Sprache, der eigentliche Anlass</h3><p>Dort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.</p><h3>Der Kasten unten</h3><p>Vor allem hier setzt das Projekt an.</p>", "roh": "Erstmal eine kurze Übersicht zum Projekt.\n\n### 5.800 Texte und 57 Prozent\n\n- Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.\n- Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. ((Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.))\n\n### Fünf Jahre ohne externe Prüfung\nDie letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.\n\n### Einfache Sprache, der eigentliche Anlass\nDort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.\n\n### Der Kasten unten\nVor allem hier setzt das Projekt an."}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "html": "<p>Daraus folgt mein Vorschlag.</p><h3>Ziel</h3><ul><li><em>vorlesen</em></li></ul><h3>Lösung</h3><ul><li>Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung. (weiter vorlesen)</li></ul><h3>Abgrenzung</h3><ul><li>Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.</li></ul><h3>Der Kasten unten</h3><ul><li><em>vorlesen</em></li></ul>", "roh": "Daraus folgt mein Vorschlag.\n\n### Ziel\n- *vorlesen*\n\n### Lösung\n- Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung. (weiter vorlesen)\n\n### Abgrenzung\n- Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.\n\n### Der Kasten unten\n- *vorlesen*"}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "html": "<p>Zunächst zum Unternehmen und zum aktuellen Prozess.</p><h3>Das Unternehmen</h3><ul><li>kein Amt, sondern ein Eigenbetrieb der Stadt.</li><li>seit 2005 extern qualitätsgeprüft nach <strong>LQW</strong>, <strong>Lernerorientierte Qualitätstestierung in der Weiterbildung</strong></li><li>Es gibt acht Programmbereiche in vier Fachbereichen</li><li>Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.</li><li>Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat.</li></ul><h3>Der Satz oben aus der Betriebssatzung</h3><p>Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.</p><h3>So entsteht ein Kurstext</h3><ul><li><em>(vorlesen)</em></li></ul>", "roh": "Zunächst zum Unternehmen und zum aktuellen Prozess.\n\n### Das Unternehmen\n- kein Amt, sondern ein Eigenbetrieb der Stadt.\n- seit 2005 extern qualitätsgeprüft nach **LQW**, **Lernerorientierte Qualitätstestierung in der Weiterbildung**\n- Es gibt acht Programmbereiche in vier Fachbereichen\n- Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.\n- Darüber steht eine Betriebskommission mit sechzehn Sitzen, zwei davon für den Personalrat.\n\n### Der Satz oben aus der Betriebssatzung\nDer Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.\n\n### So entsteht ein Kurstext\n- *(vorlesen)*"}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "html": "<p>Zur Potenzialermittlung. Was zählt als Befund und für wen?</p><h3>Die Messung</h3><ul><li>Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen und mit einem eigenen Skript ausgewertet.</li></ul><h3>Wonach gemessen wurde</h3><ul><li>Dabei wurde nach sechs Regeln gemessen.</li><li>Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.</li></ul><h3>Die zwei Pflichtregeln</h3><ul><li>Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.</li><li><strong>STRUKTUR</strong>: Eine Zeile sieht z.B. aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.</li><li><strong>LINKTEXT</strong>: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“</li><li><strong>Bei beiden</strong>: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.</li></ul><h3>Die vier Empfehlungen</h3><ul><li>Nicht verbindlich, aber der größte Ertrag des Projekts.</li><li><strong>NIVEAU:</strong> Niveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.</li><li><strong>AMTSDEUTSCH</strong>: (vorlesen)</li><li><strong>SATZ</strong>: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.</li><li>**AB</li></ul><p>Abkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.</p><h3>Zwei Kurse im Vergleich</h3><p>Die Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.</p><p>Beim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.</p><p>Der Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.</p><p>Dabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.</p><h3>Der Kasten unten</h3><p>Deshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.</p><h3>Nachtrag: warum 57 Prozent eine Untergrenze sind</h3><p>Noch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch.</p>", "roh": "Zur Potenzialermittlung. Was zählt als Befund und für wen?\n\n### Die Messung\n- Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte gezogen und mit einem eigenen Skript ausgewertet.\n\n### Wonach gemessen wurde\n- Dabei wurde nach sechs Regeln gemessen.\n- Dieselben sechs Regeln sind zugleich der Maßstab des Prüfassistenten, den ich gleich zeige.\n\n### Die zwei Pflichtregeln\n- Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.\n- **STRUKTUR**: Eine Zeile sieht z.B. aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.\n- **LINKTEXT**: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“\n- **Bei beiden**: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.\n\n### Die vier Empfehlungen\n- Nicht verbindlich, aber der größte Ertrag des Projekts.\n- **NIVEAU:** Niveau heißt: Ein Wort liegt über dem Sprachniveau derer, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.\n- **AMTSDEUTSCH**: (vorlesen)\n- **SATZ**: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.\n- **AB\nAbkürzung heißt: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige eigene, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.\n\n### Zwei Kurse im Vergleich\n\nDie Tabelle darunter zeigt zwei Sprachkurse, und beide tragen eine niedrige Stufe im Titel. Das bedeutet zweimal etwas völlig Verschiedenes.\n\nBeim Englischkurs steht A1 für das Englisch, das dort gelernt wird. Wer die Beschreibung liest, ist deutschsprachig und liest Deutsch fließend. Beim Deutschkurs steht A2 für das Deutsch, das dort gelernt wird. Wer diese Beschreibung liest, kann Deutsch bisher eine Stufe darunter, also A1.\n\nDer Englischkurs hat kein einziges Wort über dem Niveau seiner Leser und einen Befund insgesamt, eine nicht aufgelöste Abkürzung. Der Deutschkurs hat dreiundfünfzig zu schwere Wörter und siebenundfünfzig Befunde. Darunter Selbsteinschätzung, Fehleinschätzung und Umbuchung — Wörter, die man erst weit oberhalb des Kursziels lernt.\n\nDabei sind beide Texte gleich einfach gebaut. Die Sätze sind in beiden Fällen kurz, im Schnitt neun und sieben Wörter. Ein Lesbarkeitsindex, der Satz- und Wortlängen zählt, findet bei keinem der beiden etwas. Er schweigt zweimal, und einmal davon zu Unrecht.\n\n### Der Kasten unten\n\nDeshalb reicht kein Werkzeug, das nur den Text ansieht. Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es einunddreißig verschiedene Texte, und alle einunddreißig enthalten Wörter über dem Niveau ihrer Leser. Genau hier kann ein fachlich eingestellter Prompt etwas, was ein Standardwerkzeug nicht kann.\n\n### Nachtrag: warum 57 Prozent eine Untergrenze sind\n\nNoch einmal zu den siebenundfünfzig Prozent: Das ist eine Untergrenze. Mein Messskript prüft fünf der sechs Regeln; die erste, ob eine hervorgehobene Zeile eine Überschrift sein sollte, kann kein Skript entscheiden. Ich messe also bewusst zu niedrig statt zu hoch."}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "html": "<p>Kurz die Rechtslage.</p><h3>Was Barrierefreiheit heißt</h3><p>Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.</p><h3>Welches Recht gilt</h3><p>Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.</p><h3>Der Block in der Mitte: Pflicht und freiwillig</h3><p>Der Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — und beides gehört zum Kern dieses Projekts. Zwei meiner Regeln liegen dagegen im Pflichtbereich; dazu gleich mehr.</p><h3>Warum ich nicht mit dem Bußgeld argumentiere</h3><p>Ich könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.</p><h3>Der Kasten unten</h3><p>Freiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.</p><p>Den eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind.</p>", "roh": "Kurz die Rechtslage.\n\n### Was Barrierefreiheit heißt\n\nDigitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, doppel A und dreifach A.\n\n### Welches Recht gilt\n\nFür die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar. Sie ist eine kommunale Einrichtung in Hessen, also greift Landesrecht: Paragraph vierzehn des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe doppel A.\n\n### Der Block in der Mitte: Pflicht und freiwillig\n\nDer Block in der Mitte zeigt nur die Kriterien, die am Text der Kursbeschreibung selbst hängen. Links steht, was daran verbindlich ist: dass eine Zeile, die eine Gliederungsebene eröffnet, auch technisch als Überschrift ausgezeichnet wird, und dass ein Linktext sagt, wohin er führt. Rechts steht, was freiwillig ist: dass Abkürzungen erklärt werden und dass das Leseniveau zur Zielgruppe passt. Beides ist dreifach A und damit nicht gefordert — und beides gehört zum Kern dieses Projekts. Zwei meiner Regeln liegen dagegen im Pflichtbereich; dazu gleich mehr.\n\n### Warum ich nicht mit dem Bußgeld argumentiere\n\nIch könnte jetzt mit einem drohenden Bußgeld argumentieren. Das wäre bequem, und es wäre falsch.\n\n### Der Kasten unten\n\nFreiwillig heißt aber nicht belanglos. Paragraph drei Absatz eins der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind. Die Konformitätsstufe begründet eine Vermutung, keine Obergrenze der Pflicht. Ich argumentiere also nicht gegen das Recht, sondern in einer Lücke, die es selbst offenlässt.\n\nDen eigentlichen Auftrag gibt sich das Unternehmen ohnehin selbst. Die Betriebssatzung sagt, die Angebote stünden allen offen, ohne Rücksicht auf Vorbildung. Für ein solches Unternehmen ist es nicht vertretbar, dass ausgerechnet die Kriterien für Menschen mit geringer Vorbildung die freiwilligen sind."}, {"nr": 7, "titel": "Was die Technik prüft, und was nur ein Mensch sieht.", "bild": "folie-07.png", "html": "<p>Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.</p><h3>Linke Spalte: Das Seitengerüst</h3><p>Links steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.</p><h3>Rechte Spalte: Der einzelne Text</h3><p>Rechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.</p><h3>Der Kasten unten: wo die Trennlinie verläuft</h3><p>Die Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.</p><p>Diese Trennung hat sich beim Bauen dreimal selbst bestätigt. Drei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Alle drei stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.</p><h3>Technische Voraussetzungen</h3><p>Technisch braucht es den KI-Zugang, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort angelegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem.</p>", "roh": "Zur Lösung. Sie beginnt mit einer Abgrenzung, und die halte ich für den wichtigsten Teil meines Konzepts.\n\n### Linke Spalte: Das Seitengerüst\n\nLinks steht, was am Gerüst der Seite hängt: Kontraste, Tastaturbedienung, Seitentitel, Navigation. Das kann man prüfen, ohne einen einzigen Kurs zu kennen. Es gilt für alle fünftausendachthundert Texte gleich, dafür gibt es etablierte Programme wie axe-core, und zuständig ist die städtische IT.\n\n### Rechte Spalte: Der einzelne Text\n\nRechts steht, was am einzelnen Text hängt. Versteht die Zielgruppe genau dieses Kurses ihn? Diese Frage lässt sich nicht beantworten, ohne zu wissen, wer liest. Zuständig sind die Programmbereiche.\n\n### Der Kasten unten: wo die Trennlinie verläuft\n\nDie Trennlinie verläuft also nicht zwischen Sprache und Technik. Zwei meiner sechs Regeln sind selbst Pflichtkriterien der Barrierefreiheit. Ein Beispiel: eine hervorgehobene Zeile, die als Überschrift gemeint ist, aber im Quelltext keine ist. Das Prüfprogramm sieht dort nur Fließtext und meldet nichts. Ob diese Zeile eine Überschrift sein sollte, kann man dem Text nicht ansehen, sondern nur verstehen. Deshalb liegt ausgerechnet dieses Pflichtkriterium rechts.\n\nDiese Trennung hat sich beim Bauen dreimal selbst bestätigt. Drei Zusagen, die ich zuerst in den Prompt geschrieben hatte, hat das Modell nicht zuverlässig eingehalten. Alle drei stehen jetzt im Programmcode, weil sie feststehen und keine Einschätzung verlangen.\n\n### Technische Voraussetzungen\n\nTechnisch braucht es den KI-Zugang, den der Volkshochschul-Verband ohnehin bereitstellt, einen dort angelegten Assistenten und die Wortliste als Datei. Kein neuer Vertrag, kein Eingriff ins Kursverwaltungssystem."}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "html": "<p>Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.</p><h3>Rolle, Aufgabe, Format</h3><p>Die ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.</p><h3>Kontext: die Wortliste</h3><p>Der KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.</p><p>Das ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.</p><h3>Der Kasten unten: die Zeile Grenzen</h3><p>In der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn hoch eingestuft wird dort nur, was Menschen bewertet — dieses System bewertet Texte. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird.</p>", "roh": "Zum Kern der Aufgabe, dem System-Prompt. Er folgt der Sechs-Komponenten- Struktur aus dem Aufgabenblatt.\n\n### Rolle, Aufgabe, Format\n\nDie ROLLE macht ihn zur Redaktionsassistenz, nicht zur Autorin. Die AUFGABE schreibt die Reihenfolge vor: erst die Zielgruppe bestimmen, dann prüfen. Das FORMAT erzwingt zu jedem Befund ein wörtliches Zitat, eine Begründung und einen konkreten Vorschlag. Ohne Vorschlag kein Befund.\n\n### Kontext: die Wortliste\n\nDer KONTEXT enthält das Hauswissen: die acht Programmbereiche, die internen Abkürzungen, sechs Prüfregeln und — der wichtigste Teil — achthundertzwanzig Wörter des Prüfungswortschatzes für das Goethe-Zertifikat A1. Diese Liste steht vollständig im Prompt, nicht als Verweis. Er schätzt das Sprachniveau also nicht, sondern begründet es.\n\nDas ist das Ergebnis der ersten Überarbeitung. In meiner ersten Fassung behauptete der Prompt, gegen die Wortlisten zu prüfen, hatte sie aber gar nicht. Er schätzte weiter frei und klang dabei nach Beleg — derselbe Fehler, den ich anderen Werkzeugen vorwerfe. Der Grundstock dieser Listen stammt übrigens laut Goethe-Institut aus einer Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschulverbands in Frankfurt.\n\n### Der Kasten unten: die Zeile Grenzen\n\nIn der Zeile GRENZEN steht: bewertet Texte, niemals Personen. Dieser eine Satz leistet zweierlei. Er hält das Projekt aus dem Hochrisikobereich der KI- Verordnung heraus, denn hoch eingestuft wird dort nur, was Menschen bewertet — dieses System bewertet Texte. Und er ist die Antwort auf die Frage des Personalrats, ob hier Leistung kontrolliert wird."}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "html": "<p>Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.</p><h3>Weg 1: Als KI-Assistent bei fobizz</h3><p>Der erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.</p><h3>Die Einschränkung zu Weg 1</h3><p>Eine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.</p><h3>Weg 2: Als eigenes Prüfwerkzeug</h3><p>Der zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.</p><h3>Rechts im Bild: ein Befund</h3><p>Rechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.</p><h3>Hier die Vorführung</h3><p>Ich zeige euch das kurz live, an genau diesem Kurs.</p><p>Das ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.</p><h3>Der Kasten unten</h3><p>Die Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt.</p>", "roh": "Bleibt die Frage, wie das in den Alltag kommt. Dafür gibt es zwei Wege, und beide stehen vom ersten Tag an offen.\n\n### Weg 1: Als KI-Assistent bei fobizz\n\nDer erste braucht keine eigene Technik. Der Deutsche Volkshochschul-Verband hat im Mai zweitausendfünfundzwanzig eine Rahmenvereinbarung mit einem Anbieter namens fobizz geschlossen. Mitarbeitende aller Volkshochschulen in Deutschland haben darüber datenschutzkonformen Zugang zu KI-Anwendungen, und man kann dort eigene Assistenten mit eigenen Anweisungen anlegen. Genau das ist mein Prompt. Zustimmung außerhalb des Pilotbereichs braucht es dafür nicht, weil der Rahmenvertrag schon da ist. Zu klären ist allerdings, ob die vhs Frankfurt die Lizenz auch tatsächlich gebucht hat — der Rahmenvertrag schafft die Möglichkeit, er ist nicht die Buchung.\n\n### Die Einschränkung zu Weg 1\n\nEine Einschränkung gehört dazu, denn diesen Weg habe ich nicht ausprobiert: Mein Prüfwerkzeug bearbeitet jede Antwort nach. Es rechnet die Einstufung anhand einer Tabelle nach und entfernt Personennamen. Beides stand ursprünglich im Prompt, und beides hielt das Modell nicht zuverlässig ein — deshalb steht es heute im Programmcode. In einem fremden Assistenten gibt es diesen Code nicht. Was das praktisch bedeutet, muss der Pilot zeigen.\n\n### Weg 2: Als eigenes Prüfwerkzeug\n\nDer zweite Weg ist das Prüfwerkzeug, das ich gebaut habe. Dort fügt man den Entwurf ein — oder gibt bei einem vorhandenen Kurs nur die Nummer ein, dann holt es den Text selbst. Die Schnittstelle des Kursportals ist öffentlich, das kostet keinen Zugang; es braucht nur einen eigenen Server.\n\n### Rechts im Bild: ein Befund\n\nRechts steht, was dabei herauskommt: ein Befund aus einem echten Durchlauf, dem Deutschkurs auf A2. Jeder Befund hat dieselben vier Teile: die Einstufung, die Regel, die wörtliche Stelle aus dem Text und einen konkreten Vorschlag. Dieser hier ist Pflicht, der Link heißt schlicht „hier“. Wer sich die Seite vorlesen lässt und von Link zu Link springt, hört nur „hier“. Der Vorschlag daneben ist kein Kommentar, sondern fertiger Text zum Übernehmen.\n\n### Hier die Vorführung\n\nIch zeige euch das kurz live, an genau diesem Kurs.\n\nDas ist ein Prototyp, den ich für diese Arbeit gebaut habe. Er belegt, dass der Weg funktioniert, er ist keine fertige Anwendung.\n\n### Der Kasten unten\n\nDie Nachbemerkung unten ist kein Teil des Pilotprojekts. Man könnte die Prüfung ins Redaktionssystem selbst einbauen, dort, wo der Text entsteht. Nur wird das Portal von einem externen Dienstleister betreut, also hieße das: Auftrag, Budget, Vorlauf. Man kauft nichts, bevor man weiß, ob es wirkt."}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "html": "<p>Damit zum Change-Teil, und der beginnt mit den <strong>Stakeholdern</strong>. Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.</p><h3>Oben rechts: Eng einbinden</h3><p>Wer entscheidet oder zustimmen muss.</p><p><strong>Der Direktor</strong> — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.</p><p><strong>Der Fachbereich des Pilotbereichs</strong> — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.</p><p><strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.</p><p><strong>Der Personalrat</strong> — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein <strong>sperrender</strong>: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.</p><h3>Unten links: Informieren</h3><p>Nur dieser eine Fachbereich ist im Pilot — die anderen erfahren davon.</p><p><strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.</p><h3>Oben links: Beobachten</h3><p>Hoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.</p><p><strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.</p><p><strong>Advellence</strong> — die Schweizer Firma, die laut Impressum das Portal programmiert.</p><p><strong>Die Betriebskommission</strong> — Aufsichtsgremium.</p><p><strong>Der Volkshochschul-Verband</strong> — stellt den KI-Zugang, den ich nutze.</p><h3>Unten rechts: Konsultieren</h3><p>Der Quadrant, der mich am meisten beschäftigt hat.</p><p><strong>Die Kursleitungen auf Honorarbasis</strong> — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.</p><p><strong>Die Teilnehmenden</strong> — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.</p><p>Bei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie.</p>", "roh": "Damit zum Change-Teil, und der beginnt mit den **Stakeholdern**. Die **Einfluss-Betroffenheits-Matrix** sortiert sie nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.\n\n### Oben rechts: Eng einbinden\n\nWer entscheidet oder zustimmen muss.\n\n**Der Direktor** — laut Impressum persönlich für die redaktionellen Inhalte verantwortlich.\n\n**Der Fachbereich des Pilotbereichs** — er entscheidet über den Text. Und zwar nur dieser eine: Vier Fachbereiche gleichzeitig wären kein Pilot mehr.\n\n**Die Redaktion des Programmhefts** — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht.\n\n**Der Personalrat** — hier ist die Einordnung eigentlich zu schwach. Sein Einfluss ist kein hoher, sondern ein **sperrender**: Die Einführung des Werkzeugs ist mitbestimmungspflichtig, sie braucht seine Zustimmung. Seine zwei von sechzehn Sitzen in der Betriebskommission sind daneben bedeutungslos.\n\n### Unten links: Informieren\n\nNur dieser eine Fachbereich ist im Pilot — die anderen erfahren davon.\n\n**Die drei übrigen Fachbereiche** — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.\n\n### Oben links: Beobachten\n\nHoher Einfluss, aber mein Projekt verändert ihre Arbeit nicht.\n\n**Die städtische IT** — bleibt für die technische Seite zuständig.\n\n**Advellence** — die Schweizer Firma, die laut Impressum das Portal programmiert.\n\n**Die Betriebskommission** — Aufsichtsgremium.\n\n**Der Volkshochschul-Verband** — stellt den KI-Zugang, den ich nutze.\n\n### Unten rechts: Konsultieren\n\nDer Quadrant, der mich am meisten beschäftigt hat.\n\n**Die Kursleitungen auf Honorarbasis** — maximal betroffen, denn in der Branche schreiben sie viele dieser Texte. In keinem Gremium sitzen sie, und vorschreiben kann man ihnen als Honorarkräften nichts. Einen Kanal haben sie aber doch: Arbeitnehmerähnliche Personen gelten nach dem Personalvertretungsgesetz als Beschäftigte, der Personalrat vertritt sie mit.\n\n**Die Teilnehmenden** — besonders in den Deutschkursen und in der Grundbildung. Für sie ist das ganze Projekt gemacht, und sie haben keine Stimme, in keinem Gremium und in keinem Gesetz.\n\nBei ihnen ist Beteiligung kein guter Stil, sondern das einzige Instrument, das überhaupt zur Verfügung steht. Was das praktisch heißt, steht auf der nächsten Folie."}, {"nr": 11, "titel": "Vier Widerstände, und vier Antworten.", "bild": "folie-11.png", "html": "<p>Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.</p><h3>Unsicherheit · im ganzen Haus</h3><p>Die Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.</p><h3>Verlustangst · Fachbereich</h3><p>Der einzige Einwand, der noch offen ist. Eine Kursbeschreibung ist selten von einer Hand: Der Anmeldehinweis, die Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht in dem Bereich gepflegt, der den Kurs anbietet. Wer die Befunde bekommt, darf den Text also oft gar nicht ändern. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.</p><h3>Fehlende Perspektive · Kursleitung</h3><p>Bei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor, der Einwand ist also berechtigt und gehört auch so beantwortet. Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.</p><h3>Gewohnheit · Redaktion des Programmhefts</h3><p>Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich. Entscheidend ist, wie man darauf antwortet: Diese Redaktion prüft Texte im Haus als Einzige schon heute. Sie ist keine Bremse, sie ist der nächstliegende Verbündete, und so sollte man ihr auch begegnen. Der Punkt ist nur: Wer sich beschwert, hat den Text gelesen und verstanden. Die Menschen, um die es hier geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit — dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.</p><h3>Der Kasten unten</h3><p>Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird.</p>", "roh": "Jetzt zum Widerstand. Der Unterricht nennt vier Ursachen: Unsicherheit, Verlustangst, fehlende Perspektive und Gewohnheit. Ich zeige für jede einen Fall, den es hier wirklich gibt.\n\n### Unsicherheit · im ganzen Haus\n\nDie Frage, die im ganzen Haus als Erstes kommt: Schreibt die KI jetzt unsere Texte? Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen. Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.\n\n### Verlustangst · Fachbereich\n\nDer einzige Einwand, der noch offen ist. Eine Kursbeschreibung ist selten von einer Hand: Der Anmeldehinweis, die Beschreibung der Niveaustufe — solche Bausteine stehen wortgleich in vielen Kursen und werden nicht in dem Bereich gepflegt, der den Kurs anbietet. Wer die Befunde bekommt, darf den Text also oft gar nicht ändern. Das ist keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört. Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.\n\n### Fehlende Perspektive · Kursleitung\n\nBei den Honorarkräften schärfer als bei allen anderen, weil ihre Abrechnungseinheit die Unterrichtsstunde ist. Textarbeit kommt darin nicht vor, der Einwand ist also berechtigt und gehört auch so beantwortet. Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht. Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.\n\n### Gewohnheit · Redaktion des Programmhefts\n\nDer Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich. Entscheidend ist, wie man darauf antwortet: Diese Redaktion prüft Texte im Haus als Einzige schon heute. Sie ist keine Bremse, sie ist der nächstliegende Verbündete, und so sollte man ihr auch begegnen. Der Punkt ist nur: Wer sich beschwert, hat den Text gelesen und verstanden. Die Menschen, um die es hier geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit — dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.\n\n### Der Kasten unten\n\nBetroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird."}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "html": "<p>Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.</p><h3>Monat 2, Strang Kommunikation: Training</h3><p>Erstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.</p><h3>Strang Change: erst fragen, dann handeln</h3><p>Und zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat.</p>", "roh": "Der Zeitplan, drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung als Überschrift jeder Zelle. Die Zellen könnt ihr mitlesen, ich hebe zwei Dinge heraus.\n\n### Monat 2, Strang Kommunikation: Training\n\nErstens das Training im zweiten Monat. Das ist keine Kür, sondern Pflicht: Artikel vier der KI-Verordnung verlangt seit Februar zweitausendfünfundzwanzig ausreichende KI-Kompetenz, und zwar für das Personal und für alle, die im Auftrag mit Betrieb und Nutzung befasst sind. Deshalb steht in der Zelle nicht Personal, sondern alle, die bedienen. Wer nicht bedient, braucht die Schulung nicht — das ist der Grund, warum die Kursleitungen aus dieser Kette bleiben.\n\n### Strang Change: erst fragen, dann handeln\n\nUnd zweitens die Reihenfolge im Change-Strang: erst fragen, dann handeln. Die Freigabe der Textbausteine steht deshalb im ersten Monat und nicht im zweiten, sonst läuft der Quick Win auf eine Zuständigkeit, die niemand hat."}, {"nr": 13, "titel": "Die ersten 30 Tage.", "bild": "folie-13.png", "html": "<p>Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.</p><h3>Die vier Schritte</h3><p>Die Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Zugang ist da.</p><h3>Der Kasten unten: der dritte Schritt</h3><p>Der dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt.</p>", "roh": "Die ersten dreißig Tage, und das ist keine Aufzählung, sondern eine Reihenfolge: Jeder Schritt bedingt den nächsten.\n\n### Die vier Schritte\nDie Dienstvereinbarung zuerst, aus dem Grund von eben. Dann einen Programmbereich gewinnen, und zwar freiwillig — ein zugewiesener liefert kein belastbares Ergebnis, sondern nur Erfüllung. Dann die Freigabe der Bausteine. Und erst als viertes das Technische, den Assistenten anlegen. Es kostet nichts: kein Einkauf, keine neue Stelle, der KI-Zugang ist da.\n\n### Der Kasten unten: der dritte Schritt\n\nDer dritte Schritt ist der, den man am ehesten überspringt, und der teuerste. Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf — und das Werkzeug hat sich beim ersten Durchlauf selbst erledigt."}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "html": "<p>Und woran würde man merken, ob es gewirkt hat?</p><h3>Die ersten drei Kennzahlen</h3><p>Vier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.</p><h3>Die vierte Kennzahl: die Befragung</h3><p>Die vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.</p><p>Diese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.</p><h3>Letzte Spalte: womit gemessen wird</h3><p>In der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und dafür bleibt es unverändert liegen. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.</p><h3>Das Risiko unten</h3><p>Das Risiko steckt in den Kennzahlen selbst. Die ersten drei lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Befundquote — ob der Text dadurch verständlicher geworden ist, hat dann noch niemand gefragt. Ein kürzerer Satz ist nicht automatisch ein verständlicherer.</p><p>Genau dagegen steht die vierte Kennzahl. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist. Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab.</p>", "roh": "Und woran würde man merken, ob es gewirkt hat?\n\n### Die ersten drei Kennzahlen\n\nVier Kennzahlen mit Ausgangswert und Ziel. Die Befundquote soll von siebenundfünfzig Prozent unter fünfundzwanzig fallen. Alle neuen Texte im Pilotbereich sollen geprüft sein. Und von den einunddreißig Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.\n\n### Die vierte Kennzahl: die Befragung\n\nDie vierte Zeile ist mir wichtig, weil die ersten drei nur den Text messen und nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst. Nicht über einen Fragebogen auf der Website, denn den füllt genau die Zielgruppe nicht aus, um die es geht. Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.\n\nDiese Befragung ist freiwillig und wird vergütet. Sonst wäre sie eine neue Aufgabe ohne Bezahlung, und das ist bei Honorarkräften genau das Problem von der Widerstandsfolie.\n\n### Letzte Spalte: womit gemessen wird\n\nIn der letzten Spalte steht, womit gemessen wird. Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung, und dafür bleibt es unverändert liegen. Wäre es zwischendurch verbessert worden, wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.\n\n### Das Risiko unten\n\nDas Risiko steckt in den Kennzahlen selbst. Die ersten drei lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Befundquote — ob der Text dadurch verständlicher geworden ist, hat dann noch niemand gefragt. Ein kürzerer Satz ist nicht automatisch ein verständlicherer.\n\nGenau dagegen steht die vierte Kennzahl. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist. Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab."}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "html": "<h3>Was diese Arbeit ist</h3><p>Ich habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.</p><h3>Meine Lehre aus dem Projekt</h3><p>Der System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.</p><h3>Der Link auf der Folie</h3><p>Danke für die Aufmerksamkeit. Die Adresse steht hier auf der Folie, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen.</p>", "roh": "### Was diese Arbeit ist\n\nIch habe ein reales Unternehmen analysiert, einen Prozess gefunden, in dem niemand etwas falsch macht und trotzdem etwas fehlt, und ich habe den Zustand gemessen statt geschätzt.\n\n### Meine Lehre aus dem Projekt\n\nDer System-Prompt selbst ist an einem Nachmittag geschrieben. Das ist meine eigentliche Lehre aus diesem Projekt. Die Arbeit steckt in allem, was ihn möglich macht: zu wissen, für wen ein Text ist, zu wissen, was Pflicht ist und was Anspruch, und einen Weg zu finden, auf dem die Menschen, die diese Texte schreiben, das Werkzeug nicht als Kontrolle erleben.\n\n### Der Link auf der Folie\n\nDanke für die Aufmerksamkeit. Die Adresse steht hier auf der Folie, dort läuft der Prototyp weiter — mit dem Prompt in allen Fassungen und den Läufen, die ihr gesehen habt. Jetzt gerne eure Fragen."}];

<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
const eBild = document.getElementById('bild');

function zeige(i){
  const f = FOLIEN[i];
  eBild.src = f.bild;
  eBild.alt = 'Folie ' + f.nr + ': ' + f.titel;
  document.title = 'Folie ' + String(f.nr).padStart(2, '0');
}

// Alle Folienbilder einmal vorladen, damit beim Blaettern kein schwarzer
// Zwischenzustand entsteht.
FOLIEN.forEach(f => { const v = new Image(); v.src = f.bild; });

window.klartext = { gehe: i => gehe(i, false), anzahl: () => FOLIEN.length };

gehe(ausAdresse(), false);
</script>
