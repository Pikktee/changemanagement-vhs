<script>
const FOLIEN = [{"nr": 1, "titel": "KLARTEXT — Kursbeschreibungen barrierefrei prüfen.", "bild": "folie-01.png", "html": "<h3>Begrüßung</h3><p>Willkommen zu meinem Abschlussprojekt!</p><ul><li>KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.</li></ul><h3>Worum geht es?</h3><ul><li>Barrierefreiheit.</li><li>Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:</li><li>ob der Text ankommt bei denen, für die er geschrieben ist.</li></ul><h3>Ein konkreter Fall</h3><ul><li>Beispiel: Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen.</li><li>Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht.</li></ul>", "roh": "### Begrüßung\n\nWillkommen zu meinem Abschlussprojekt!\n- KLARTEXT, ein KI-gestützter Prüfschritt für die Kursbeschreibungen der Volkshochschule Frankfurt.\n\n### Worum geht es?\n\n- Barrierefreiheit.\n- Aber nicht der technische Teil wie Kontraste oder Tastaturbedienung, sondern:\n- ob der Text ankommt bei denen, für die er geschrieben ist.\n\n### Ein konkreter Fall\n- Beispiel: Die Volkshochschule bietet Deutschkurse für Menschen an, die gerade erst Deutsch lernen.\n- Die Beschreibungen dieser Kurse sind oft in einem Deutsch geschrieben, das man erst nach dem Kurs versteht."}, {"nr": 2, "titel": "Die Technik wird geprüft, die Texte nicht.", "bild": "folie-02.png", "html": "<p>Erstmal eine kurze Übersicht zum Projekt.</p><h3>5.800 Texte und 57 Prozent</h3><ul><li>Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.</li><li>Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. <span class=\"neben\">Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.</span></li></ul><h3>Fünf Jahre ohne externe Prüfung</h3><p>Die letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.</p><h3>Einfache Sprache, der eigentliche Anlass</h3><p>Dort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.</p><h3>Der Kasten unten</h3><p>Vor allem hier setzt das Projekt an.</p>", "roh": "Erstmal eine kurze Übersicht zum Projekt.\n\n### 5.800 Texte und 57 Prozent\n\n- Die Volkshochschule veröffentlicht rund 5800 Kursbeschreibungen im Jahr.\n- Von allen Texten, die heute im Portal stehen, hat mehr als jeder zweite Text einen Befund. ((Die Zahl stammt von einem Skript, das ohne KI auskommt und deshalb eine der sechs Regeln nicht prüfen kann. Mit dem Prüfassistenten liegt der Wert höher.))\n\n### Fünf Jahre ohne externe Prüfung\nDie letzte externe Prüfung auf Barrierefreiheit der Website ist etwa 5 Jahre her. Die Zahl stammt aus der Erklärung zur Barrierefreiheit der Volkshochschule.\n\n### Einfache Sprache, der eigentliche Anlass\nDort heißt es auch, dass Informationen zu Betrieb und Kursgeschäft in einfacher Sprache verfügbar sind. Das gilt jedoch nicht für die Kursbeschreibungen selbst, die immerhin den größten Textbestand darstellen.\n\n### Der Kasten unten\nVor allem hier setzt das Projekt an."}, {"nr": 3, "titel": "Der Vorschlag, und was er bringt.", "bild": "folie-03.png", "html": "<p>Daraus folgt mein Vorschlag.</p><h3>Ziel</h3><ul><li><em>vorlesen</em></li></ul><h3>Lösung</h3><ul><li><span class=\"wichtig\">Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung.</span> (weiter vorlesen)</li></ul><h3>Abgrenzung</h3><ul><li>Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.</li></ul><h3>Ergebnis</h3><ul><li><em>vorlesen</em></li></ul><h3>Callout</h3><ul><li><em>vorlesen</em></li></ul>", "roh": "Daraus folgt mein Vorschlag.\n\n### Ziel\n- *vorlesen*\n\n### Lösung\n- ==Ein Prüfschritt zur Sicherstellung der Zugänglichkeit eines Kurstextes für die Zielgruppe des Textes vor der Veröffentlichung.== (weiter vorlesen)\n\n### Abgrenzung\n- Für die technische Barrierefreiheit der Website bleiben normale Prüfwerkzeug zuständig, zusammen mit der städtischen IT. Die KI sieht nur den Kurstext.\n\n### Ergebnis\n- *vorlesen*\n\n### Callout\n- *vorlesen*"}, {"nr": 4, "titel": "Die vhs Frankfurt, und wie ein Kurstext entsteht.", "bild": "folie-04.png", "html": "<p>Zunächst zum Unternehmen und zum aktuellen Prozess.</p><h3>Das Unternehmen</h3><ul><li>kein Amt, sondern ein Eigenbetrieb der Stadt.</li><li>seit 2005 extern qualitätsgeprüft nach <strong>LQW</strong>, <strong>Lernerorientierte Qualitätstestierung in der Weiterbildung</strong></li><li>Es gibt acht Programmbereiche in vier Fachbereichen</li><li>Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.</li><li>Darüber steht eine Betriebskommission mit 16 Sitzen, 2 davon für den Personalrat.</li></ul><h3>Der Satz oben aus der Betriebssatzung</h3><p>Der Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.</p><h3>So entsteht ein Kurstext</h3><ul><li><em>(vorlesen)</em></li></ul>", "roh": "Zunächst zum Unternehmen und zum aktuellen Prozess.\n\n### Das Unternehmen\n- kein Amt, sondern ein Eigenbetrieb der Stadt.\n- seit 2005 extern qualitätsgeprüft nach **LQW**, **Lernerorientierte Qualitätstestierung in der Weiterbildung**\n- Es gibt acht Programmbereiche in vier Fachbereichen\n- Geleitet wird sie von einem Direktor, der laut Impressum auch persönlich für die redaktionellen Inhalte der Website verantwortlich ist.\n- Darüber steht eine Betriebskommission mit 16 Sitzen, 2 davon für den Personalrat.\n\n### Der Satz oben aus der Betriebssatzung\nDer Satz oben stammt wörtlich aus der Betriebssatzung: Die Angebote stehen grundsätzlich allen offen, ohne Rücksicht auf Vorbildung.\n\n### So entsteht ein Kurstext\n- *(vorlesen)*"}, {"nr": 5, "titel": "Was zählt als Befund, und für wen.", "bild": "folie-05.png", "html": "<p>Zur Potenzialermittlung. Was zählt als Befund und für wen?</p><ul><li>Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte erhalten und mit einem Skript ausgewertet.</li></ul><h3>Wonach wurde gemssen?</h3><ul><li>Nach 6 Regeln, die auch im System-Prompt Verwendung finden</li></ul><h3>Es gibt 2 Pflichtregeln</h3><ul><li>Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.</li><li><strong>STRUKTUR</strong>: z.B. eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.</li><li><strong>LINKTEXT</strong>: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“</li><li><strong>Bei beiden</strong>: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.</li></ul><h3>Die vier Empfehlungen</h3><ul><li>Nicht verbindlich, aber sind die wichtigsten des Projekts.</li><li><strong>NIVEAU:</strong> Niveau heißt: Ein Wort liegt über dem Sprachniveau der Menschen, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.</li><li><strong>AMTSDEUTSCH</strong>: (vorlesen)</li><li><strong>SATZ</strong>: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.</li><li><strong>ABKÜRZUNG</strong>: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.</li></ul><h3>Zwei Kurse im Vergleich als Beispiel</h3><ul><li>Englisch A1.1 und Deutsch als Fremdsprache A2.2</li><li>Beide Beschreibungen sind auf Deutsch. <span class=\"wichtig\">Nur kann die eine Zielgruppe Deutsch — die andere lernt es gerade erst.</span></li><li>Englischkurs: kein einziges zu schweres Wort. Deutschkurs: dreiundfünfzig.</li><li>Beide Texte haben kurze Sätze. Ein Programm, das nur zählt, findet bei keinem etwas.</li></ul><h3>Der Kasten unten</h3><ul><li>Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es z.B. 31 verschiedene Texte, die  Wörter über dem Niveau ihrer Leser enthalten. Genau hier kann ein KI-Prompt etwas, was ein Standardwerkzeug nicht kann.</li></ul>", "roh": "Zur Potenzialermittlung. Was zählt als Befund und für wen?\n\n- Erstmal kurz zur Messung: Das Kursportal hat eine offene Schnittstelle. Darüber habe ich alle Kurstexte erhalten und mit einem Skript ausgewertet.\n\n### Wonach wurde gemssen?\n- Nach 6 Regeln, die auch im System-Prompt Verwendung finden\n\n### Es gibt 2 Pflichtregeln\n- Stehen auf Stufe A der Barrierefreiheitsrichtlinien und sind damit gesetzlich verbindlich.\n- **STRUKTUR**: z.B. eine Zeile sieht aus wie eine Überschrift, ist im Quelltext aber gewöhnlicher Fließtext.\n- **LINKTEXT**: Der Linktext sagt nicht, wohin er führt. Beispiel: „hier“\n- **Bei beiden**: Screen-Reader können die Inhalte damit nicht zuverlässig lesen.\n\n### Die vier Empfehlungen\n- Nicht verbindlich, aber sind die wichtigsten des Projekts.\n- **NIVEAU:** Niveau heißt: Ein Wort liegt über dem Sprachniveau der Menschen, die den Text lesen sollen. Das ist die Regel, die sich ohne Kenntnis der Zielgruppe überhaupt nicht anwenden lässt.\n- **AMTSDEUTSCH**: (vorlesen)\n- **SATZ**: Zur Satzlänge sagen die Barrierefreiheitsrichtlinien nichts. Aber die Zahlen orientieren sich an den Empfehlungen für einfache Sprache.\n- **ABKÜRZUNG**: Ein Kürzel steht im Text, ohne beim ersten Mal aufgelöst zu werden. Davon hat die vhs einige, D-T-Z zum Beispiel, der Deutsch-Test für Zuwanderer.\n\n### Zwei Kurse im Vergleich als Beispiel\n- Englisch A1.1 und Deutsch als Fremdsprache A2.2\n- Beide Beschreibungen sind auf Deutsch. ==Nur kann die eine Zielgruppe Deutsch — die andere lernt es gerade erst.==\n- Englischkurs: kein einziges zu schweres Wort. Deutschkurs: dreiundfünfzig.\n- Beide Texte haben kurze Sätze. Ein Programm, das nur zählt, findet bei keinem etwas.\n\n### Der Kasten unten\n- Man muss wissen, für wen der Text ist. Für Deutschkurse auf den Stufen A1 und A2 gibt es z.B. 31 verschiedene Texte, die  Wörter über dem Niveau ihrer Leser enthalten. Genau hier kann ein KI-Prompt etwas, was ein Standardwerkzeug nicht kann."}, {"nr": 6, "titel": "Welches Recht gilt, und was nicht.", "bild": "folie-06.png", "html": "<p>Zunächst noch kurz zur Rechtslage.</p><h3>Was bedeutet Barrierefreiheit?</h3><ul><li>Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, Doppel A und Dreifach A.</li></ul><h3>Welches Recht gilt?</h3><ul><li>Wichtig: Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar.</li><li>Als kommunale Einrichtung in Hessen greift Landesrecht: Paragraph 14 des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe Doppel A.</li></ul><h3>Callout</h3><ul><li>Einige der Regeln sind freiwillig, da sie nicht in WCAG Doppel A enthalten sind.</li><li>Freiwillig heißt aber nicht belanglos. Paragraph 3 Absatz 1 der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind.</li><li>Außerdem sagt die Betriebssatzung, dass die Angebote allen offen stehen, ohne Rücksicht auf Vorbildung.</li></ul>", "roh": "Zunächst noch kurz zur Rechtslage.\n\n### Was bedeutet Barrierefreiheit?\n- Digitale Barrierefreiheit bedeutet, dass eine Website auch für Menschen mit Behinderung nutzbar sein muss. Der Maßstab sind die WCAG, mit drei Stufen: A, Doppel A und Dreifach A.\n\n### Welches Recht gilt?\n- Wichtig: Für die vhs gilt weder die EU-Richtlinie noch das Barrierefreiheitsstärkungsgesetz unmittelbar.\n- Als kommunale Einrichtung in Hessen greift Landesrecht: Paragraph 14 des Hessischen Behindertengleichstellungsgesetzes und die hessische Verordnung. Gefordert wird Stufe Doppel A.\n\n### Callout\n- Einige der Regeln sind freiwillig, da sie nicht in WCAG Doppel A enthalten sind.\n- Freiwillig heißt aber nicht belanglos. Paragraph 3 Absatz 1 der hessischen Verordnung verlangt eigenständig, dass Angebote verständlich sind.\n- Außerdem sagt die Betriebssatzung, dass die Angebote allen offen stehen, ohne Rücksicht auf Vorbildung."}, {"nr": 7, "titel": "Was die Technik prüft, und wo KLARTEXT ansetzt.", "bild": "folie-07.png", "html": "<ul><li>Nochmal zur Abgrenzung</li><li>Was die Technik prüft, und wo KLARTEXT ansetzt.</li></ul><h3><span class=\"neben\">Die Website</span></h3><ul><li>Was nicht zum Projekt gehört ist die technische Prüfung der Website als ganzes.</li><li>Also z.B. Kontraste, Tastaturbedienung, Seitentitel, Navigation.</li><li>Das ist prüfbar, ohne einen einzigen Kurs zu kennen.</li><li>Dafür gibt es etablierte Tools wie <strong>axe-core</strong>. Zuständig ist hier die städtische IT.</li></ul><h3>Der einzelne Text</h3><ul><li>Das Projekt prüft den einzelnen Text:</li><li>Versteht die Zielgruppe genau dieses Kurses ihn?</li><li>Die KI kann hier nur Vorschläge machen, die Entscheidung liegt beim Fachbereich.</li></ul><h3>Callout</h3><ul><li>Die Trennlinie verläuft also nicht zwischen Technik und Sprache, sondern zwischen der Seite und dem einzelnen Text.</li><li><span class=\"wichtig\">Neu ist allein der Schritt, für den man wissen muss, wer liest.</span></li><li>Und genau dafür setzen wir ein KI-Sprachmodell ein.</li></ul>", "roh": "- Nochmal zur Abgrenzung\n- Was die Technik prüft, und wo KLARTEXT ansetzt.\n\n### ((Die Website))\n- Was nicht zum Projekt gehört ist die technische Prüfung der Website als ganzes.\n- Also z.B. Kontraste, Tastaturbedienung, Seitentitel, Navigation.\n- Das ist prüfbar, ohne einen einzigen Kurs zu kennen.\n- Dafür gibt es etablierte Tools wie **axe-core**. Zuständig ist hier die städtische IT.\n\n### Der einzelne Text\n- Das Projekt prüft den einzelnen Text:\n- Versteht die Zielgruppe genau dieses Kurses ihn?\n- Die KI kann hier nur Vorschläge machen, die Entscheidung liegt beim Fachbereich.\n\n### Callout\n- Die Trennlinie verläuft also nicht zwischen Technik und Sprache, sondern zwischen der Seite und dem einzelnen Text.\n- ==Neu ist allein der Schritt, für den man wissen muss, wer liest.==\n- Und genau dafür setzen wir ein KI-Sprachmodell ein."}, {"nr": 8, "titel": "Der System-Prompt in sechs Bausteinen.", "bild": "folie-08.png", "html": "<ul><li>Und damit kommen wir zum Kern der Aufgabe, unserem System-Prompt.</li><li>Er folgt der gängigen Sechs-Komponenten- Struktur</li></ul><h3>Rolle, Aufgabe, Format, Grenzen</h3><p><em>(Vorlesen)</em></p><h3>Kontext: die Wortliste</h3><ul><li>Der KONTEXT enthält das Hauswissen: acht Programmbereiche, interne Abkürzungen und auch die sechs Prüfregeln sind hier drin.</li><li>Der wichtigste Teil: 820 Wörter des Prüfungswortschatzes für das <strong>Goethe-Zertifikat A1</strong>. Die werden vollständig mit dem Prompt übergeben.</li><li>Das ist das Ergebnis der ersten Überarbeitung: Vorher hat die KI behauptet gegen die Wortlisten zu prüfen, was jedoch nicht erfolgt ist.</li><li><span class=\"wichtig\">Funfact:</span> Die Liste geht laut Goethe-Institut auf eine Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschul-Verbands zurück.</li></ul>", "roh": "- Und damit kommen wir zum Kern der Aufgabe, unserem System-Prompt.\n- Er folgt der gängigen Sechs-Komponenten- Struktur\n\n### Rolle, Aufgabe, Format, Grenzen\n*(Vorlesen)*\n\n### Kontext: die Wortliste\n- Der KONTEXT enthält das Hauswissen: acht Programmbereiche, interne Abkürzungen und auch die sechs Prüfregeln sind hier drin.\n- Der wichtigste Teil: 820 Wörter des Prüfungswortschatzes für das **Goethe-Zertifikat A1**. Die werden vollständig mit dem Prompt übergeben.\n- Das ist das Ergebnis der ersten Überarbeitung: Vorher hat die KI behauptet gegen die Wortlisten zu prüfen, was jedoch nicht erfolgt ist.\n- ==Funfact:== Die Liste geht laut Goethe-Institut auf eine Veröffentlichung der Prüfungszentrale des Deutschen Volkshochschul-Verbands zurück."}, {"nr": 9, "titel": "Der System-Prompt im Einsatz.", "bild": "folie-09.png", "html": "<ul><li>Zur technischen Implementierung</li><li>Zwei Wege sind zu Beginn des Pilotprojekts verfügbar.</li></ul><h3>Weg 1: Als KI-Assistent bei fobizz</h3><ul><li>Braucht keine eigene Technik.</li><li>Der Deutsche Volkshochschul-Verband hat im Mai 2025 eine Rahmenvereinbarung mit dem Anbieter <strong>fobizz</strong> geschlossen: datenschutzkonformer KI-Zugang für alle Volkshochschulen, mit eigenen Assistenten und eigenen Anweisungen.</li><li>Zustimmung außerhalb des Pilotbereichs braucht es nicht, weil bereits ein Rahmenvertrag besteht.</li></ul><h3>Weg 2: Als eigenes Prüfwerkzeug</h3><ul><li>Einen Entwurf einfügen — oder einen vorhandenen Kurs auswählen</li><li>Die Schnittstelle des Kursportals ist öffentlich. Es braucht nur einen eigenen Server.</li><li>Auch um den Prompt zu testen, habe ich hier einen Prototyp gebaut.</li></ul><h3>Unten:</h3><ul><li>Perspektivisch möglich, aber kein Teil des Pilotprojekts: Man könnte die Prüfung direkt ins Redaktionssystem einbauen, also dort, wo der Text entsteht.</li><li>Allerdings wird das Portal von einem externen Dienstleister betreut.</li></ul>", "roh": "- Zur technischen Implementierung\n- Zwei Wege sind zu Beginn des Pilotprojekts verfügbar.\n\n### Weg 1: Als KI-Assistent bei fobizz\n- Braucht keine eigene Technik.\n- Der Deutsche Volkshochschul-Verband hat im Mai 2025 eine Rahmenvereinbarung mit dem Anbieter **fobizz** geschlossen: datenschutzkonformer KI-Zugang für alle Volkshochschulen, mit eigenen Assistenten und eigenen Anweisungen.\n- Zustimmung außerhalb des Pilotbereichs braucht es nicht, weil bereits ein Rahmenvertrag besteht.\n\n### Weg 2: Als eigenes Prüfwerkzeug\n- Einen Entwurf einfügen — oder einen vorhandenen Kurs auswählen\n- Die Schnittstelle des Kursportals ist öffentlich. Es braucht nur einen eigenen Server.\n- Auch um den Prompt zu testen, habe ich hier einen Prototyp gebaut.\n\n### Unten:\n- Perspektivisch möglich, aber kein Teil des Pilotprojekts: Man könnte die Prüfung direkt ins Redaktionssystem einbauen, also dort, wo der Text entsteht.\n- Allerdings wird das Portal von einem externen Dienstleister betreut."}, {"nr": 10, "titel": "Wer eingebunden werden muss.", "bild": "folie-10.png", "html": "<ul><li>Damit zum Change-Teil: Wen sollten wir im Projekt auf welche Weise berücksichtigen?</li><li>Wichtig: Der Pilot beschränkt sich auf einen der vier Fachbereiche.</li></ul><ul><li>Die <strong>Einfluss-Betroffenheits-Matrix</strong> sortiert die Stakeholder nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.</li></ul><h3>Oben rechts: Eng einbinden</h3><ul><li>Ich fange an mit den Stakeholdern, die wir eng einbinden müssen.</li><li><strong>Der Direktor</strong> — da er laut Impressum persönlich für die redaktionellen Inhalte verantwortlich ist.</li><li><strong>Der Pilot-Fachbereich</strong> — natürlich, er entscheidet über den Text.</li><li><strong>Der Personalrat</strong> — der Einzige, der das Projekt anhalten kann: Die Einführung ist mitbestimmungspflichtig. <span class=\"wichtig\">Ohne seine Zustimmung passiert nichts.</span></li></ul><h3>Unten links: Informieren</h3><ul><li><strong>Die drei übrigen Fachbereiche</strong> — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.</li></ul><h3>Oben links: Beobachten</h3><ul><li>Hoher Einfluss, aber ihre Arbeit verändert das Projekt nicht.</li><li><strong>Die städtische IT</strong> — bleibt für die technische Seite zuständig.</li><li><strong>Die Betriebskommission</strong> — als Aufsichtsgremium.</li><li><strong>Der Volkshochschul-Verband</strong> — stellt den KI-Zugang.</li></ul><h3>Unten rechts: Konsultieren</h3><ul><li><strong>Die Kursleitungen auf Honorarbasis</strong> — oft kommt der Text von ihnen. Trotzdem sitzen sie in keinem Gremium, und vorschreiben kann man ihnen nichts.</li><li><strong>Die Redaktion des Programmhefts</strong> — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht. <span class=\"neben\">Im Pilot ist sie nicht: Der prüft nur neue Portaltexte.</span></li><li><strong>Die Teilnehmenden</strong></li></ul>", "roh": "- Damit zum Change-Teil: Wen sollten wir im Projekt auf welche Weise berücksichtigen?\n- Wichtig: Der Pilot beschränkt sich auf einen der vier Fachbereiche.\n\n- Die **Einfluss-Betroffenheits-Matrix** sortiert die Stakeholder nach zwei Fragen: Wer ist betroffen, und wer hat Einfluss.\n\n### Oben rechts: Eng einbinden\n- Ich fange an mit den Stakeholdern, die wir eng einbinden müssen.\n- **Der Direktor** — da er laut Impressum persönlich für die redaktionellen Inhalte verantwortlich ist.\n- **Der Pilot-Fachbereich** — natürlich, er entscheidet über den Text.\n- **Der Personalrat** — der Einzige, der das Projekt anhalten kann: Die Einführung ist mitbestimmungspflichtig. ==Ohne seine Zustimmung passiert nichts.==\n\n### Unten links: Informieren\n- **Die drei übrigen Fachbereiche** — sollen wissen, dass es läuft, und sehen, was herauskommt. Im Pilot sind sie nicht dabei.\n\n### Oben links: Beobachten\n- Hoher Einfluss, aber ihre Arbeit verändert das Projekt nicht.\n- **Die städtische IT** — bleibt für die technische Seite zuständig.\n- **Die Betriebskommission** — als Aufsichtsgremium.\n- **Der Volkshochschul-Verband** — stellt den KI-Zugang.\n\n### Unten rechts: Konsultieren\n- **Die Kursleitungen auf Honorarbasis** — oft kommt der Text von ihnen. Trotzdem sitzen sie in keinem Gremium, und vorschreiben kann man ihnen nichts.\n- **Die Redaktion des Programmhefts** — prüft Texte für den Druck schon heute, weiß also, wie Textprüfung geht. ((Im Pilot ist sie nicht: Der prüft nur neue Portaltexte.))\n- **Die Teilnehmenden**"}, {"nr": 11, "titel": "Vier Widerstände, und vier Antworten.", "bild": "folie-11.png", "html": "<p>Jetzt zu den Widerständen.</p><h3>Unsicherheit · im ganzen Haus</h3><ul><li>Die Frage, die als Erstes kommen könnte: Schreibt die KI jetzt unsere Texte?</li><li>Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen.</li><li><span class=\"wichtig\">Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.</span></li></ul><h3>Verlustangst · Fachbereich</h3><ul><li>Der einzige Einwand, der noch offen ist.</li><li>Eine Kursbeschreibung ist selten von einer Hand: Anmeldehinweis, Beschreibung der Niveaustufe — solche Textbausteine stehen wortgleich in vielen Kursen und werden nicht dort gepflegt, wo der Kurs angeboten wird.</li><li>Wer die Befunde bekommt, darf den Text also oft gar nicht ändern.</li><li>Keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört.</li><li>Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.</li></ul><h3>Fehlende Perspektive · Kursleitung</h3><ul><li>Bei den Honorarkräften schärfer als bei allen anderen: Ihre Abrechnungseinheit ist die Unterrichtsstunde, Textarbeit kommt darin nicht vor.</li><li>Der Einwand ist berechtigt und gehört auch so beantwortet.</li><li>Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht.</li><li><span class=\"neben\">Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.</span></li></ul><h3>Gewohnheit · Redaktion des Programmhefts</h3><ul><li>Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich.</li><li>Diese Redaktion prüft als Einzige im Haus heute schon Texte. Sie ist keine Bremse, sondern der nächstliegende Verbündete — und so sollte man ihr auch begegnen.</li><li>Der Punkt ist nur: <span class=\"wichtig\">Wer sich beschwert, hat den Text gelesen und verstanden.</span></li><li>Die Menschen, um die es geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. <span class=\"neben\">Dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.</span></li></ul><h3>Der Kasten unten</h3><ul><li>Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird.</li></ul>", "roh": "Jetzt zu den Widerständen.\n\n### Unsicherheit · im ganzen Haus\n- Die Frage, die als Erstes kommen könnte: Schreibt die KI jetzt unsere Texte?\n- Nein. Sie schlägt vor, mehr nicht. Entschieden und veröffentlicht wird von Menschen.\n- ==Das ist keine Beruhigung, sondern der Zuschnitt des Werkzeugs.==\n\n### Verlustangst · Fachbereich\n- Der einzige Einwand, der noch offen ist.\n- Eine Kursbeschreibung ist selten von einer Hand: Anmeldehinweis, Beschreibung der Niveaustufe — solche Textbausteine stehen wortgleich in vielen Kursen und werden nicht dort gepflegt, wo der Kurs angeboten wird.\n- Wer die Befunde bekommt, darf den Text also oft gar nicht ändern.\n- Keine Angst vor der Maschine, sondern die Aussicht, für etwas geradezustehen, das einem nicht gehört.\n- Die Antwort ist deshalb keine Schulung, sondern eine Zuständigkeitsfrage — und die gehört vor den Pilot.\n\n### Fehlende Perspektive · Kursleitung\n- Bei den Honorarkräften schärfer als bei allen anderen: Ihre Abrechnungseinheit ist die Unterrichtsstunde, Textarbeit kommt darin nicht vor.\n- Der Einwand ist berechtigt und gehört auch so beantwortet.\n- Die Antwort ist der Zuschnitt: Geprüft wird im Fachbereich, an dem Text, der dort eingeht.\n- ((Das schützt auch ihren Status: Verbindliche Regeln und ein Protokoll je Text wären genau die Merkmale, an denen sich eine Scheinselbständigkeit festmachen lässt.))\n\n### Gewohnheit · Redaktion des Programmhefts\n- Der Satz, der jedes Qualitätsprojekt begleitet: Es hat sich doch nie jemand beschwert. Und er stimmt vermutlich.\n- Diese Redaktion prüft als Einzige im Haus heute schon Texte. Sie ist keine Bremse, sondern der nächstliegende Verbündete — und so sollte man ihr auch begegnen.\n- Der Punkt ist nur: ==Wer sich beschwert, hat den Text gelesen und verstanden.==\n- Die Menschen, um die es geht, fragen nicht nach und melden sich auch nicht an. Ihr Fehlen sieht von innen aus wie Zufriedenheit. ((Dass es bisher niemand gesehen hat, ist deshalb kein Versäumnis, sondern liegt in der Sache.))\n\n### Der Kasten unten\n- Betroffene zu Beteiligten machen heißt hier: entscheiden, bevor geschult wird."}, {"nr": 12, "titel": "Der Plan für die nächsten drei Monate.", "bild": "folie-12.png", "html": "<p>Der Zeitplan: drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung. Und eine Logik dahinter, eine Kette von Freigaben: <span class=\"wichtig\">Ohne Dienstvereinbarung kein Setup, ohne Training kein Pilot, ohne Nachmessung kein Rollout.</span> Ich gehe die Stränge einmal durch.</p><h3>Technische Implementation</h3><ul><li><strong>Setup:</strong> Der Assistent wird im bestehenden KI-Zugang des Verbands angelegt. Den Prompt schärfe ich im Prüfwerkzeug an echten Kurstexten — jeder Lauf wird protokolliert.</li><li><strong>Pilot:</strong> Ein Fachbereich, nur neu entstehende Texte. Klein genug, um alle Beteiligten wirklich einzubinden.</li><li><strong>Rollout:</strong> Wird nur vorbereitet. <span class=\"wichtig\">Ob er kommt, entscheidet die Nachmessung — nicht der Kalender.</span></li></ul><h3>Kommunikation</h3><ul><li><strong>Ankündigung:</strong> Erst die Dienstvereinbarung mit dem Personalrat, dann die Bekanntgabe im Haus — in dieser Reihenfolge, sonst verhandelt man öffentlich.</li><li><strong>Training:</strong> Kein KI-Grundlagenkurs, sondern eine Schulung am konkreten System, bevor der erste Text geprüft wird. Pflicht ist sie ohnehin: <strong>Artikel 4 der KI-Verordnung</strong>, für alle, die bedienen. <span class=\"neben\">Wer nicht bedient, braucht keine Schulung — deshalb bleiben die Kursleitungen draußen.</span></li><li><strong>Support:</strong> Eine feste Sprechstunde statt Zuruf. Sie senkt die Schwelle zu fragen, hält den Aufwand planbar — und dieselbe Frage dreimal in einer Stunde ist ein Befund am Prompt oder an der Schulung.</li></ul><h3>Change</h3><ul><li><strong>Vorbereitung:</strong> Den Pilotbereich gewinnen, nicht zuweisen. Die Betroffenen befragen, bevor etwas läuft. Und klären, wer die Textbausteine ändern darf — die zentral gepflegten Teile, die wortgleich in vielen Kursen stehen. <span class=\"neben\">Das war die Verlustangst von der Widerstandsfolie.</span></li><li><strong>Einbindung:</strong> Der Bereich wählt selbst, welche Regeln verbindlich gelten. Und er korrigiert die Textbausteine zuerst: <span class=\"wichtig\">Ein korrigierter Textbaustein wirkt sofort in allen Kursen, die ihn verwenden.</span></li><li><strong>Begleitung:</strong> Die Nachmessung, mit demselben Skript wie die Ausgangsmessung — sonst weiß man nicht, ob die Texte besser wurden oder nur die Messung anders. Danach fällt die Rollout-Entscheidung.</li></ul>", "roh": "Der Zeitplan: drei Monate, drei Stränge, die neun Phasen aus der Aufgabenstellung. Und eine Logik dahinter, eine Kette von Freigaben: ==Ohne Dienstvereinbarung kein Setup, ohne Training kein Pilot, ohne Nachmessung kein Rollout.== Ich gehe die Stränge einmal durch.\n\n### Technische Implementation\n- **Setup:** Der Assistent wird im bestehenden KI-Zugang des Verbands angelegt. Den Prompt schärfe ich im Prüfwerkzeug an echten Kurstexten — jeder Lauf wird protokolliert.\n- **Pilot:** Ein Fachbereich, nur neu entstehende Texte. Klein genug, um alle Beteiligten wirklich einzubinden.\n- **Rollout:** Wird nur vorbereitet. ==Ob er kommt, entscheidet die Nachmessung — nicht der Kalender.==\n\n### Kommunikation\n- **Ankündigung:** Erst die Dienstvereinbarung mit dem Personalrat, dann die Bekanntgabe im Haus — in dieser Reihenfolge, sonst verhandelt man öffentlich.\n- **Training:** Kein KI-Grundlagenkurs, sondern eine Schulung am konkreten System, bevor der erste Text geprüft wird. Pflicht ist sie ohnehin: **Artikel 4 der KI-Verordnung**, für alle, die bedienen. ((Wer nicht bedient, braucht keine Schulung — deshalb bleiben die Kursleitungen draußen.))\n- **Support:** Eine feste Sprechstunde statt Zuruf. Sie senkt die Schwelle zu fragen, hält den Aufwand planbar — und dieselbe Frage dreimal in einer Stunde ist ein Befund am Prompt oder an der Schulung.\n\n### Change\n- **Vorbereitung:** Den Pilotbereich gewinnen, nicht zuweisen. Die Betroffenen befragen, bevor etwas läuft. Und klären, wer die Textbausteine ändern darf — die zentral gepflegten Teile, die wortgleich in vielen Kursen stehen. ((Das war die Verlustangst von der Widerstandsfolie.))\n- **Einbindung:** Der Bereich wählt selbst, welche Regeln verbindlich gelten. Und er korrigiert die Textbausteine zuerst: ==Ein korrigierter Textbaustein wirkt sofort in allen Kursen, die ihn verwenden.==\n- **Begleitung:** Die Nachmessung, mit demselben Skript wie die Ausgangsmessung — sonst weiß man nicht, ob die Texte besser wurden oder nur die Messung anders. Danach fällt die Rollout-Entscheidung."}, {"nr": 13, "titel": "Die ersten 30 Tage.", "bild": "folie-13.png", "html": "<p>Das war der Plan für drei Monate — das hier ist sein erster Monat im Detail. Keine Aufzählung, sondern eine Reihenfolge: <span class=\"wichtig\">Jeder Schritt bedingt den nächsten.</span></p><h3>Schritt eins: die Dienstvereinbarung</h3><ul><li>Zuerst die <strong>Dienstvereinbarung</strong> mit dem Personalrat — er ist der Einzige, der das Projekt anhalten kann, die Einführung ist mitbestimmungspflichtig.</li><li>Vorher wird nichts angelegt, auch nicht „nur zum Ausprobieren“. <span class=\"neben\">Ein Assistent, der schon läuft, während noch verhandelt wird, kostet genau das Vertrauen, von dem der Pilot lebt.</span></li></ul><h3>Schritt zwei: den Pilotbereich gewinnen</h3><ul><li>Einen <strong>Fachbereich</strong> gewinnen, nicht zuweisen. Freiwillig deshalb, weil ein zugewiesener Pilot Erfüllung liefert, kein Ergebnis.</li><li>Der Bereich, der sich meldet, bekommt dafür etwas: Er wählt im zweiten Monat selbst, welche Regeln verbindlich gelten.</li></ul><h3>Schritt drei: die Freigabe der Textbausteine</h3><ul><li>Klären, wer die zentral gepflegten <strong>Textbausteine</strong> ändern darf — die Teile, die wortgleich in vielen Kursen stehen.</li><li>Das ist der Schritt, den man am ehesten überspringt, und der teuerste: Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf.</li><li><span class=\"wichtig\">Das Werkzeug hätte sich dann beim ersten Durchlauf selbst erledigt.</span> Das sagt auch der Kasten unten.</li></ul><h3>Schritt vier: der Assistent</h3><ul><li>Erst als Letztes das Technische: den <strong>Assistenten anlegen</strong>. Das kostet nichts — kein Einkauf, keine neue Stelle, der KI-Zugang des Verbands ist da.</li><li>Dass der technische Schritt der letzte und der billigste ist, ist die Pointe dieser Folie: <span class=\"wichtig\">Die Arbeit liegt nicht in der Technik, sondern in den Zuständigkeiten davor.</span></li></ul>", "roh": "Das war der Plan für drei Monate — das hier ist sein erster Monat im Detail. Keine Aufzählung, sondern eine Reihenfolge: ==Jeder Schritt bedingt den nächsten.==\n\n### Schritt eins: die Dienstvereinbarung\n- Zuerst die **Dienstvereinbarung** mit dem Personalrat — er ist der Einzige, der das Projekt anhalten kann, die Einführung ist mitbestimmungspflichtig.\n- Vorher wird nichts angelegt, auch nicht „nur zum Ausprobieren“. ((Ein Assistent, der schon läuft, während noch verhandelt wird, kostet genau das Vertrauen, von dem der Pilot lebt.))\n\n### Schritt zwei: den Pilotbereich gewinnen\n- Einen **Fachbereich** gewinnen, nicht zuweisen. Freiwillig deshalb, weil ein zugewiesener Pilot Erfüllung liefert, kein Ergebnis.\n- Der Bereich, der sich meldet, bekommt dafür etwas: Er wählt im zweiten Monat selbst, welche Regeln verbindlich gelten.\n\n### Schritt drei: die Freigabe der Textbausteine\n- Klären, wer die zentral gepflegten **Textbausteine** ändern darf — die Teile, die wortgleich in vielen Kursen stehen.\n- Das ist der Schritt, den man am ehesten überspringt, und der teuerste: Lässt man ihn aus, liefert der Pilot eine Liste von Befunden, die im Pilotbereich niemand ändern darf.\n- ==Das Werkzeug hätte sich dann beim ersten Durchlauf selbst erledigt.== Das sagt auch der Kasten unten.\n\n### Schritt vier: der Assistent\n- Erst als Letztes das Technische: den **Assistenten anlegen**. Das kostet nichts — kein Einkauf, keine neue Stelle, der KI-Zugang des Verbands ist da.\n- Dass der technische Schritt der letzte und der billigste ist, ist die Pointe dieser Folie: ==Die Arbeit liegt nicht in der Technik, sondern in den Zuständigkeiten davor.=="}, {"nr": 14, "titel": "57 Prozent heute, unter 25 nach dem Pilot.", "bild": "folie-14.png", "html": "<p>Und woran würde man merken, ob es gewirkt hat?</p><h3>Die ersten drei Kennzahlen</h3><ul><li>Vier Kennzahlen, jede mit Ausgangswert und Ziel.</li><li>Die Befundquote soll von 57 Prozent unter 25 fallen.</li><li>Alle neuen Texte im Pilotbereich sollen geprüft sein.</li><li>Von den 31 Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.</li></ul><h3>Die vierte Kennzahl: die Befragung</h3><ul><li>Die ersten drei messen nur den Text, nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst.</li><li>Nicht über einen Fragebogen auf der Website — den füllt genau die Zielgruppe nicht aus, um die es geht.</li><li>Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.</li><li><span class=\"wichtig\">Freiwillig und vergütet.</span> <span class=\"neben\">Sonst wäre sie eine neue Aufgabe ohne Bezahlung — bei Honorarkräften genau das Problem von der Widerstandsfolie.</span></li></ul><h3>Letzte Spalte: womit gemessen wird</h3><ul><li>Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung. Dafür bleibt es unverändert liegen.</li><li>Sonst wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.</li></ul><h3>Das Risiko unten</h3><ul><li>Die ersten drei Kennzahlen lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Quote.</li><li><span class=\"wichtig\">Ein kürzerer Satz ist nicht automatisch ein verständlicherer.</span></li><li>Genau dagegen steht die vierte. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist.</li><li>Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab.</li></ul>", "roh": "Und woran würde man merken, ob es gewirkt hat?\n\n### Die ersten drei Kennzahlen\n- Vier Kennzahlen, jede mit Ausgangswert und Ziel.\n- Die Befundquote soll von 57 Prozent unter 25 fallen.\n- Alle neuen Texte im Pilotbereich sollen geprüft sein.\n- Von den 31 Texten für Deutschkurse auf A1 und A2, die heute alle Wörter über dem Niveau ihrer Leser enthalten, sollen höchstens noch zehn betroffen sein.\n\n### Die vierte Kennzahl: die Befragung\n- Die ersten drei messen nur den Text, nicht die Wirkung. Deshalb frage ich die Teilnehmenden selbst.\n- Nicht über einen Fragebogen auf der Website — den füllt genau die Zielgruppe nicht aus, um die es geht.\n- Sondern im Kurs, am Ende einer Stunde, in einfacher Sprache.\n- ==Freiwillig und vergütet.== ((Sonst wäre sie eine neue Aufgabe ohne Bezahlung — bei Honorarkräften genau das Problem von der Widerstandsfolie.))\n\n### Letzte Spalte: womit gemessen wird\n- Die Nachmessung läuft mit demselben Skript wie die Ausgangsmessung. Dafür bleibt es unverändert liegen.\n- Sonst wüsste man hinterher nicht, ob die Texte besser geworden sind oder nur die Messung anders.\n\n### Das Risiko unten\n- Die ersten drei Kennzahlen lassen sich erfüllen, ohne dass ein einziger Text besser wird: Wer lange Sätze teilt und schwere Wörter austauscht, drückt die Quote.\n- ==Ein kürzerer Satz ist nicht automatisch ein verständlicherer.==\n- Genau dagegen steht die vierte. Sie fragt nicht den Text, sondern die Menschen, für die er geschrieben ist.\n- Ohne sie misst der Pilot am Ende nur seinen eigenen Maßstab."}, {"nr": 15, "titel": "Danke für die Aufmerksamkeit.", "bild": "folie-15.png", "html": "<ul><li>Danke für die Aufmerksamkeit.</li></ul><ul><li>Zum Test an einem Kurstext aus dem Portal habe ich die URL zum Prototypen verlinkt — mit dem Prompt in allen Fassungen.</li></ul><ul><li>Wenn es Fragen gibt gerne.</li></ul>", "roh": "- Danke für die Aufmerksamkeit.\n\n- Zum Test an einem Kurstext aus dem Portal habe ich die URL zum Prototypen verlinkt — mit dem Prompt in allen Fassungen.\n\n- Wenn es Fragen gibt gerne."}];

<script>
const KANAL = 'klartext-vortrag';
const kanal = (() => { try { return new BroadcastChannel(KANAL); }
                       catch (e) { return null; } })();

let folie = 0;                 // 0-basiert
let geblaettert = false;

// Solange die Notiz bearbeitet wird, darf nichts blaettern: Leertaste und
// Pfeile sind dann Schreibtasten, und ein Folienwechsel wuerde den Text im
// Kasten stillschweigend gegen den der naechsten Folie tauschen.
// imEditor() steht nur auf der Notizseite; vortrag.html kennt es nicht.
function editorAktiv(){
  return typeof imEditor === 'function' && imEditor();
}

function ausAdresse(){
  const m = /[?&#]folie=(\d+)/.exec(location.search + location.hash);
  if (m) return Math.min(FOLIEN.length, Math.max(1, parseInt(m[1], 10))) - 1;
  return 0;
}

// senden=false, wenn der Sprung selbst aus dem Kanal kam. Sonst schickt die
// Gegenseite ihn zurueck und beide springen im Kreis.
function gehe(i, senden){
  folie = Math.min(FOLIEN.length - 1, Math.max(0, i));
  zeige(folie);
  if (senden !== false && kanal) kanal.postMessage({folie: folie});
}

// Blaettern von Hand. Nur das laesst den Hinweis in der Fusszeile
// verschwinden — der erste Aufbau der Seite (auch mit ?folie=N) nicht.
function blaettern(i){
  geblaettert = true;
  gehe(i);
}

if (kanal) kanal.onmessage = e => {
  if (editorAktiv()) return;
  if (e.data && typeof e.data.folie === 'number') {
    geblaettert = true;
    gehe(e.data.folie, false);
  }
};

const VOR    = ['ArrowRight','ArrowDown',' ','Spacebar','PageDown'];
const ZURUCK = ['ArrowLeft','ArrowUp','PageUp','Backspace'];

// Vollbild auf Taste F. Der Browser verlangt dafuer eine Nutzeraktion, ein
// Tastendruck ist eine. F11 des Browsers tut dasselbe, ist aber auf jedem
// System anders belegt.
function vollbild(){
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); }
  else { d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); }
}

document.addEventListener('keydown', ev => {
  // Im Editor gehoert die Tastatur dem Text. Escape, Cmd+S und Cmd+B fasst
  // der eigene Handler der Notizseite ab, bevor dieser hier laeuft.
  if (editorAktiv()) return;
  const k = ev.key;
  if (VOR.includes(k))          { blaettern(folie + 1); }
  else if (ZURUCK.includes(k))  { blaettern(folie - 1); }
  else if (k === 'Home')        { blaettern(0); }
  else if (k === 'End')         { blaettern(FOLIEN.length - 1); }
  else if (typeof groesser === 'function' &&
           (k === '+' || k === '=' || k === 'Add'))      { groesser(+1); }
  else if (typeof groesser === 'function' &&
           (k === '-' || k === '_' || k === 'Subtract')) { groesser(-1); }
  else if (k === 'f' || k === 'F')  { vollbild(); }
  else if (typeof editorOeffnen === 'function' &&
           (k === 'e' || k === 'E')) { editorOeffnen(); }
  else return;
  ev.preventDefault();
});

// Maus- und Fingerbedienung: ein Klick blaettert vor. Praktisch, wenn die
// Fernbedienung streikt. Nicht in einem Bereich, den man rollen kann —
// dort will man scrollen und nicht weiterblaettern.
document.addEventListener('click', ev => {
  if (editorAktiv()) return;
  if (ev.target.closest && ev.target.closest('.rollt')) return;
  blaettern(folie + 1);
});
</script>
<script>
const eBild = document.getElementById('bild');

function zeige(i){
  const f = FOLIEN[i];
  eBild.src = f.bild;
  eBild.alt = 'Folie ' + f.nr + ': ' + f.titel;
  document.title = 'Folie ' + String(f.nr).padStart(2, '0');
}

// Alle Folienbilder einmal vorladen, damit beim Blaettern kein schwarzer
// Zwischenzustand entsteht.
FOLIEN.forEach(f => { const v = new Image(); v.src = f.bild; });

window.klartext = { gehe: i => gehe(i, false), anzahl: () => FOLIEN.length };

gehe(ausAdresse(), false);
</script>
